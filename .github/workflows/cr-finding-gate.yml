name: CR finding gate

# Promotes CodeRabbit's "0 actionable findings" semantics to a required
# server-side StatusContext: `CR findings (0 actionable)`. Plan:
# gate-enforcement-hardening § Slice 3.
#
# CR-timing race: CodeRabbit reviews asynchronously, so the initial
# `pull_request` run usually fires BEFORE CR has reviewed the head — the action
# posts PENDING then (not success), mirroring merge-gates.sh's grace-window
# block. The check flips green only once CR has reported on the current head,
# which is why this also re-triggers on the events CR emits when it finishes:
#   - pull_request_review / pull_request_review_comment — when CR posts a review
#     with inline findings;
#   - issue_comment (CR-bot authored) — when CR has 0 actionable findings it
#     posts a PR-level summary comment ("No actionable comments…") + flips its
#     own `CodeRabbit` StatusContext to SUCCESS, leaving NO review node. Without
#     this trigger the initial PENDING run is never re-run and the gate sticks
#     on "awaiting CodeRabbit review" forever (observed on PR #536).
#
# No on.paths filter — required checks must report on every PR (Pattern A,
# docs/agent-rules/ci-required-check-pattern.md). The action itself decides
# pending/success/failure, so it always posts a status.
#
# Fork-PR limitation: `pull_request` from a fork carries a read-only token, so
# `gh api .../statuses/<sha>` cannot post. Smatchet is sole-maintainer with no
# external PR flow today; if external PRs are ever accepted, this gate cannot
# post for them (would need pull_request_target with head-SHA pinning).

on:
  pull_request:
    branches: [develop]
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  statuses: write
  # read for PR metadata / file lists; the action's stale-evidence auto-nudge
  # additionally POSTs one `@coderabbitai full review` issue comment (once per
  # head, budget-capped — see maybe_nudge_full_review in the action), which
  # needs write on the issue-comment surface. PR comments go through the
  # issues endpoint, so grant both scopes.
  pull-requests: write
  issues: write

concurrency:
  # Do NOT cancel in-progress: review/comment events fire in bursts, and a
  # cancelled run leaves a red "cancelled" check on the commit. Each run only
  # posts a status (last write wins), so let them all complete rather than
  # cancel. NB "each run is a few seconds" was never true — a run that has to
  # wait on CodeRabbit polls for up to POLL_BUDGET_SECONDS (see the action), so
  # the timeouts below are sized against that, not against a few seconds.
  group: cr-finding-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cr-gate:
    name: CR finding gate
    runs-on: ubuntu-latest
    # Sized against the action's poll budget (POLL_BUDGET_SECONDS, 180 s), NOT
    # against a "few seconds" run: job > Evaluate step > poll budget, so a slow
    # runner cannot kill the job before the gate posts a status. The old value
    # was 5, which left the ~3 min poll loop sharing a 5 min budget with setup +
    # checkout — congestion killed the step mid-poll and wedged the PR (#1954).
    timeout-minutes: 12
    # PR events carry a pull_request payload (scope to develop). issue_comment
    # has only an issue payload — accept it ONLY when it's a CodeRabbit-authored
    # comment on a PR (that's exactly when CR signals "0 actionable" with no
    # review node); base-branch is re-checked after PR resolution below.
    if: >-
      github.event.pull_request.base.ref == 'develop' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.user.login == 'coderabbitai[bot]' ||
        github.event.comment.user.login == 'coderabbitai'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolve PR number + CURRENT head SHA + base ref uniformly across all
      # trigger events (issue_comment has no pull_request payload). Always reads
      # the live head via the API so the status lands on the right commit.
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            num="${{ github.event.issue.number }}"
          else
            num="${{ github.event.pull_request.number }}"
          fi
          read -r sha base < <(gh api "repos/${{ github.repository }}/pulls/${num}" \
                                 --jq '"\(.head.sha) \(.base.ref)"' 2>/dev/null || echo " ")
          echo "num=${num}"   >> "$GITHUB_OUTPUT"
          echo "sha=${sha}"   >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Evaluate CR findings
        id: eval
        if: steps.pr.outputs.base == 'develop' && steps.pr.outputs.sha != ''
        # STEP-level (not job-level) timeout is load-bearing: a step timeout
        # cancels only this step, so the fallback poster below still runs. A
        # job-level kill would take the fallback down with it.
        timeout-minutes: 6
        uses: ./.github/actions/cr-finding-gate
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ steps.pr.outputs.num }}
          head-sha: ${{ steps.pr.outputs.sha }}

      # The whole point of this gate is that it always leaves a status behind.
      # If the Evaluate step is killed by its own timeout-minutes (or dies on a
      # runner fault) it posts nothing, and the PR wedges: the StatusContext
      # keeps whatever value it had and nothing re-triggers this workflow. Post
      # PENDING on its behalf so a later CR review event or a re-run still has a
      # path to resolve it. The action runs `set +e` and exits 0 on every
      # terminal verdict (incl. `post failure`), so outcome != success/skipped
      # genuinely means "did not conclude".
      - name: Post PENDING if the evaluation could not conclude
        if: >-
          always() && steps.eval.outcome != 'success' && steps.eval.outcome != 'skipped'
          && steps.pr.outputs.base == 'develop' && steps.pr.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending \
            -f context='CR findings (0 actionable)' \
            -f description='gate evaluation did not conclude (timeout/runner fault) — re-run or await CR' \
            >/dev/null || echo "WARN: fallback status POST failed" >&2
