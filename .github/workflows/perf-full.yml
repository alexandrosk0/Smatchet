name: Perf full-suite

# Slice 4 of docs/plans/shipped/pillar-1-2-perf-review-system.md. Scheduled weekday-
# morning run of all 14 production scenarios against ci-windows-latest
# baselines. On regression: opens an issue tagged `perf-regression` with the
# delta table. On improvement: opens a PR via `perf-baseline.sh bump --yes`
# against the affected baseline files; a human reviews + merges.
#
# Also exposes `workflow_dispatch` so a developer can invoke the full sweep
# on-demand against a specific branch.

on:
  schedule:
    - cron: '0 6 * * 1-5'  # weekday mornings UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  perf-full:
    name: Perf full-suite (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps
        uses: actions/cache@v4
        with:
          # FETCHCONTENT_BASE_DIR defaults to .fetchcontent-src (CMakeLists.txt:280).
          # The previous path (build/ninja-iter-msvc/_deps) was wrong — that dir
          # contains only the subbuild CMakeCache, not the downloaded sources — so
          # every perf-full run cold-fetched all deps. Aligned with build-and-test.yml.
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-iter-msvc
        run: cmake --preset ninja-iter-msvc

      - name: Build SmatchetStandalone
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

      - name: Discover scenarios from scenario.list
        id: scenarios
        shell: bash
        run: |
          set -e
          # The full suite is whatever scenario.list reports — keeps the
          # workflow in sync with new IScenario registrations automatically.
          # --quiet returns one name per line; jq pulls them out.
          mapfile -t scen_list < <(
            ./build/ninja-iter-msvc/Smatchet.exe cmd scenario.list --spawn --yes --quiet 2>/dev/null \
              | grep -v '^$' || true
          )
          if [ "${#scen_list[@]}" -eq 0 ]; then
            echo "FAIL: scenario.list returned no scenarios."
            exit 1
          fi
          printf '%s\n' "${scen_list[@]}" > /tmp/scenarios.txt
          echo "count=${#scen_list[@]}" >> "$GITHUB_OUTPUT"
          echo "Discovered scenarios:"
          cat /tmp/scenarios.txt

      - name: Run full suite + compare against baselines
        id: perf
        shell: bash
        run: |
          set +e
          mkdir -p build/perf-runs
          : > /tmp/perf-report.md
          echo "## Perf full-suite — ci-windows-latest" >> /tmp/perf-report.md
          echo "" >> /tmp/perf-report.md
          regression_count=0
          run_failure_count=0
          improvement_count=0
          declare -a improved=()
          while IFS= read -r scen; do
            [ -z "$scen" ] && continue
            echo "::group::Scenario $scen"
            result=$(bash scripts/dev/perf-run.sh "$scen" 2>&1 | tail -1)
            if [ ! -f "$result" ]; then
              # Plumbing failure tracked separately from regressions; gate
              # blocks hard regardless of any future override label. Mirrors
              # the Slice 3 fix on perf-pr-fast.yml. (CodeRabbit PR #324 #1.)
              echo "FAIL: $scen scenario.run did not produce $result" >&2
              run_failure_count=$((run_failure_count + 1))
              echo "::endgroup::"
              continue
            fi
            baseline="docs/perf/baselines/${scen}.ci-windows-latest.json"
            if [ ! -f "$baseline" ]; then
              # Same bootstrap path as PR-fast — capture + flag. Inline
              # heredoc replaced by scripts/dev/perf-baseline-bootstrap.py
              # (Slice 3 fix); the column-0 heredoc body inside a YAML
              # `run: |` block scalar terminated the block early and
              # caused workflow parse failure on GitHub Actions.
              echo "::warning::No baseline at $baseline — bootstrap capture."
              python scripts/dev/perf-baseline-bootstrap.py \
                  "$result" "$baseline" "$scen" \
                  --hardware-note "GitHub Actions windows-2022"
              echo "### $scen — bootstrap baseline captured" >> /tmp/perf-report.md
            else
              python scripts/dev/perf-compare.py "$baseline" "$result" --markdown-only >> /tmp/perf-report.md
              python scripts/dev/perf-compare.py "$baseline" "$result" > /dev/null 2>&1
              rc=$?
              if [ "$rc" -ne 0 ]; then
                regression_count=$((regression_count + 1))
              fi
              # Improvement detection — any row's lastTotalMs improved by
              # >= 15 % is a candidate for baseline bump. Script extracted
              # from a column-0 YAML heredoc (same defect class as
              # perf-baseline-bootstrap.py — PR #323 fix).
              if python scripts/dev/perf-improvement-detect.py "$baseline" "$result"; then
                improved+=("$scen")
                improvement_count=$((improvement_count + 1))
              fi
            fi
            echo "::endgroup::"
          done < /tmp/scenarios.txt
          echo "regression_count=$regression_count" >> "$GITHUB_OUTPUT"
          echo "run_failure_count=$run_failure_count" >> "$GITHUB_OUTPUT"
          echo "improvement_count=$improvement_count" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${improved[@]}" > /tmp/improved.txt
          set -e
          cat /tmp/perf-report.md

      - name: Upload full-suite snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-full-snapshots
          path: |
            build/perf-runs/*.json
            docs/perf/baselines/*.ci-windows-latest.json

      # Slice 5 — Pillar 2 visible-cue invariant via bucket-E ImGui Test
      # Engine. Optional / advisory final stage. Builds the ninja-ui-test-msvc
      # preset (separate binaryDir, no conflict with the iter build above) and
      # runs the GoodOrder + BadOrder variants. Failure is reported but does
      # NOT fail the full-suite job — the existing perf gates are the
      # block-merge surface.
      - name: Configure ninja-ui-test-msvc (visible-cue harness)
        continue-on-error: true
        run: cmake --preset ninja-ui-test-msvc

      - name: Build SmatchetStandalone (ui-test preset)
        continue-on-error: true
        run: cmake --build --preset ninja-ui-test-msvc --target SmatchetStandalone

      - name: Run visible-cue bucket-E driver
        continue-on-error: true
        run: bash scripts/dev/test-ui-sync-stall-visible-cue.sh

      - name: Open regression issue
        if: steps.perf.outputs.regression_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "perf-regression: full-suite run ${{ github.run_id }}" \
            --label "perf-regression" \
            --body-file /tmp/perf-report.md

      - name: Open scenario-run-failure issue
        if: steps.perf.outputs.run_failure_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "perf-run-failure: full-suite run ${{ github.run_id }}" \
            --label "perf-regression" \
            --body "One or more scenarios in the full-suite run failed to produce output (build / exe / scenario-runner plumbing). See run ${{ github.run_id }} logs."

      - name: Open baseline-bump PR for improvements
        if: steps.perf.outputs.improvement_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="bot/perf-baseline-bump-${{ github.run_id }}"
          git checkout -b "$branch"
          while IFS= read -r scen; do
            [ -z "$scen" ] && continue
            bash scripts/dev/perf-baseline.sh bump "$scen" --host=ci-windows-latest --yes
          done < /tmp/improved.txt
          git config user.email "smatchet-perf-bot@noreply.local"
          git config user.name  "smatchet-perf-bot"
          git add docs/perf/baselines/
          git commit -m "chore(perf): bump ci-windows-latest baselines after improvement"
          git push -u origin "$branch"
          gh pr create \
            --title "chore(perf): bump baselines after improvement" \
            --base develop \
            --body "Auto-generated by .github/workflows/perf-full.yml run ${{ github.run_id }}. Reviews the improvement deltas + merges to lock in the new floor." \
            --draft
