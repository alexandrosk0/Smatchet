name: Perf full-suite

# Slice 4 of docs/plans/shipped/pillar-1-2-perf-review-system.md. Scheduled weekday-
# morning run of all 14 production scenarios against ci-windows-latest
# baselines. On regression: opens an issue tagged `perf-regression` with the
# delta table. On improvement: opens a PR via `perf-baseline.sh bump --yes`
# against the affected baseline files; a human reviews + merges.
#
# Also exposes `workflow_dispatch` so a developer can invoke the full sweep
# on-demand against a specific branch.

on:
  schedule:
    - cron: '0 6 * * 1-5'  # weekday mornings UTC
  workflow_dispatch:
    inputs:
      recapture_baselines:
        description: >-
          Recapture ALL ci-windows-latest baselines from this run and open a
          draft PR for human approval (perf-gate step-5 Phase 2). Use to refresh
          baselines after a snapshot-schema change (e.g. the p99Ms emitter) — NOT
          gated on an improvement delta. The PR is a golden-image approval: a
          human reviews + merges. Default false = normal scheduled full-suite run.
        type: boolean
        default: false

# Least-privilege default (ci-workflows-05): the workflow-level token is read-only
# so any future job added here is read-only unless it opts in. The single perf-full
# job that pushes baseline-bump branches + opens regression issues elevates its own
# token below.
permissions:
  contents: read

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # NOTE: the SMATCHET_MCP_REQUIRE_TOKEN_ON_LOOPBACK=false opt-out (PR A / #1574,
  # the #1566 fast-unblock) was REMOVED once PR B / #1576 landed the real product
  # fix (the --spawn parent auto-provisions a per-spawn MCP token). These perf
  # scenario.run --spawn paths now run under the SECURE default and rely on PR
  # B's handshake — keeping them green is part of the #1566 regression guard.

jobs:
  perf-full:
    name: Perf full-suite (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    # Elevated per-job (ci-workflows-05): this job pushes baseline-bump branches
    # (contents) and opens regression / scenario-failure issues (issues); the
    # baseline-recapture path opens a PR (pull-requests). The workflow-level
    # default stays read-only.
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache FetchContent _deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # FETCHCONTENT_BASE_DIR defaults to .fetchcontent-src (CMakeLists.txt:280).
          # The previous path (build/ninja-iter-msvc/_deps) was wrong — that dir
          # contains only the subbuild CMakeCache, not the downloaded sources — so
          # every perf-full run cold-fetched all deps. Aligned with build-and-test.yml.
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-iter-msvc
        run: cmake --preset ninja-iter-msvc

      - name: Build SmatchetStandalone
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

      # Mesa software-GL parity with bucket-C/E (build-and-test.yml). The
      # hidden-GLFW-window "headless" run still needs a working opengl32 ICD;
      # without it every --spawn child fails device-object creation and all
      # scenarios are run_failures. Keep MESA_VERSION + cache key in lockstep
      # with build-and-test.yml. docs/plans/perf-gate-revival.md step 1.
      - name: Cache Mesa software-GL DLLs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mesa-cache
          key: mesa-dlls-24.2.5-v2

      - name: Install Mesa software OpenGL ICD (opengl32sw.dll)
        shell: bash
        env:
          MESA_VERSION: "24.2.5"
        run: |
          set -euo pipefail
          # Mesa >= 22 splits the GL driver: opengl32.dll is only a thin loader
          # that hard-requires libgallium_wgl.dll (the actual ~53 MB driver) +
          # libglapi.dll beside it. Copying opengl32.dll alone makes EVERY exe
          # in the target dir die at process start (STATUS_DLL_NOT_FOUND,
          # silent) — exactly how the bucket-C/E + perf headless runs were
          # broken-but-masked until the perf-gate-revival step-3 investigation
          # (2026-06-06; reproduced + fixed locally against Smatchet.exe).
          need_fetch=0
          for d in opengl32.dll libgallium_wgl.dll libglapi.dll; do
            if [ ! -f "mesa-cache/$d" ]; then need_fetch=1; fi
          done
          if [ "$need_fetch" = "1" ]; then
            mkdir -p mesa-tmp mesa-cache
            cd mesa-tmp
            curl -fL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
            # Supply-chain integrity: pal1000/mesa-dist-win publishes no checksum
            # (digest:null on every release asset), so this is a self-computed TOFU
            # pin — it catches silent upstream tampering / corrupt transfer, not
            # first-time trust. Keep in lockstep with MESA_VERSION; update on bump.
            # security.md "Mesa archive integrity" entry.
            echo "3f288b9d5d8b2d25ec0bd81dd82c6b8c77bc0ffad45cc467c37489170dd001ab  mesa.7z" | sha256sum -c -
            7z x mesa.7z -o./extracted >/dev/null 2>&1 || true
            for d in opengl32.dll libgallium_wgl.dll libglapi.dll; do
              if [ -f "extracted/x64/$d" ]; then cp "extracted/x64/$d" "../mesa-cache/$d"; fi
            done
            cd ..
            rm -rf mesa-tmp
          fi
          # Strict copy — a missing DLL here must fail LOUDLY, not reproduce
          # the silent-loader-death class this block exists to prevent.
          for d in opengl32.dll libgallium_wgl.dll libglapi.dll; do
            cp "mesa-cache/$d" "build/ninja-iter-msvc/$d"
          done

      - name: Discover scenarios from scenario.list
        id: scenarios
        shell: bash
        env:
          # scenario.list --spawn also launches the exe — it needs the Mesa
          # ICD env just like the measurement step below.
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -e
          # Enumerate the full IScenario universe (keeps us aware of every
          # registration), then SCOPE the perf sweep to the committed
          # ci-windows-latest baseline set. --quiet returns one name per line.
          mapfile -t all_scen < <(
            ./build/ninja-iter-msvc/Smatchet.exe cmd scenario.list --spawn --yes --quiet 2>/dev/null \
              | grep -v '^$' || true
          )
          if [ "${#all_scen[@]}" -eq 0 ]; then
            echo "FAIL: scenario.list returned no scenarios."
            exit 1
          fi

          # In-scope = scenarios that have a committed baseline file. This is
          # the SAME source of truth the recapture step uses (git ls-files —
          # tracked files only) and it matches reality on two axes:
          #   * only these 6 emit UiPerfMonitor `rows` via a plain
          #     `scenario.run --spawn` (no --screenshotPath), so only these
          #     produce a gate-able perf sample; and
          #   * only these have a baseline to compare against.
          # The other ~8 discovered scenarios are legitimately non-perf-runnable
          # via this path — bucket-C screenshot scenarios (require
          # --screenshotPath: command-palette-fuzzy, dock-gap-sentinel,
          # code-syntax-coloring, theme-switch-roundtrip), the bucket-E ui-test
          # (needs SMATCHET_BUILD_UI_TESTS, OFF here), and functional/contract
          # gates that emit their own result JSON with no perf `rows`
          # (command-contract-sweep, mobile-texture-guard,
          # ai-assistant-send-s2-s4-s5). Iterating them made run_failure_count
          # perpetually > 0 and (via the failure-issue step) kept this nightly
          # RED for weeks. Scoping to the baseline set makes run_failure_count
          # reflect ONLY real breakage of an in-scope scenario.
          declare -A have_baseline=()
          while IFS= read -r f; do
            scen="$(basename "$f" .ci-windows-latest.json)"
            have_baseline["$scen"]=1
          done < <(git ls-files 'docs/perf/baselines/*.ci-windows-latest.json')

          scen_list=()
          skipped=()
          for scen in "${all_scen[@]}"; do
            if [ "${have_baseline[$scen]:-}" = "1" ]; then
              scen_list+=("$scen")
            else
              skipped+=("$scen")
            fi
          done

          if [ "${#scen_list[@]}" -eq 0 ]; then
            echo "FAIL: no discovered scenario has a committed ci-windows-latest baseline."
            exit 1
          fi

          printf '%s\n' "${scen_list[@]}" > /tmp/scenarios.txt
          echo "count=${#scen_list[@]}" >> "$GITHUB_OUTPUT"
          echo "In-scope scenarios (have a committed baseline):"
          cat /tmp/scenarios.txt
          # NEVER silently drop — log every out-of-scope scenario so a newly
          # baselined (or newly broken) registration is visible in the log.
          if [ "${#skipped[@]}" -gt 0 ]; then
            echo "::notice title=perf-full scope::Skipped ${#skipped[@]} discovered scenario(s) with no committed ci-windows-latest baseline (not perf-runnable via scenario.run --spawn): ${skipped[*]}"
          fi

      - name: Run full suite + compare against baselines
        id: perf
        shell: bash
        env:
          # Route the hidden-window GL context through Mesa llvmpipe — the
          # --spawn child inherits this step env via CreateProcessA.
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          mkdir -p build/perf-runs
          : > /tmp/perf-report.md
          echo "## Perf full-suite — ci-windows-latest" >> /tmp/perf-report.md
          echo "" >> /tmp/perf-report.md
          regression_count=0
          run_failure_count=0
          improvement_count=0
          declare -a improved=()
          while IFS= read -r scen; do
            [ -z "$scen" ] && continue
            echo "::group::Scenario $scen"
            result=$(bash scripts/dev/perf-run.sh "$scen" 2>&1 | tail -1 || true)
            if [ ! -f "$result" ]; then
              # Plumbing failure tracked separately from regressions; gate
              # blocks hard regardless of any future override label. Mirrors
              # the Slice 3 fix on perf-pr-fast.yml. (CodeRabbit PR #324 #1.)
              echo "FAIL: $scen scenario.run did not produce $result" >&2
              run_failure_count=$((run_failure_count + 1))
              echo "::endgroup::"
              continue
            fi
            baseline="docs/perf/baselines/${scen}.ci-windows-latest.json"
            if [ ! -f "$baseline" ]; then
              # Same bootstrap path as PR-fast — capture + flag. Inline
              # heredoc replaced by scripts/dev/perf-baseline-bootstrap.py
              # (Slice 3 fix); the column-0 heredoc body inside a YAML
              # `run: |` block scalar terminated the block early and
              # caused workflow parse failure on GitHub Actions.
              echo "::warning::No baseline at $baseline — bootstrap capture."
              python scripts/dev/perf-baseline-bootstrap.py \
                  "$result" "$baseline" "$scen" \
                  --hardware-note "GitHub Actions windows-2022"
              echo "### $scen — bootstrap baseline captured" >> /tmp/perf-report.md
            else
              # Gate FIRST (exit code), report AFTER — so confirm-on-exceed can
              # swap in the confirm sample before the markdown table is written
              # (one table per scenario, always the gated sample).
              python scripts/dev/perf-compare.py "$baseline" "$result" > /dev/null 2>&1
              rc=$?
              # Confirm-on-exceed (ported from perf-pr-fast.yml's scenario loop,
              # gate-fp-hardening 2026-06-10): the 2-core shared runner swings
              # JOB-wide, so a single exceed can be runner noise (cell-edit-burst
              # SmatchetUI::Draw p99 10.9 -> 15.661 ms across days with no code
              # change, PR #1112). Take 3 more independent runs, median them, and
              # gate on THAT — a real regression fails both samples (false-positive
              # probability squared); a noisy episode clears. Trigger ONLY on rc=1
              # (regression); rc=2 is malformed input a re-run can't fix, so it
              # falls through and counts. (perf-full is nightly / non-PR-blocking,
              # so this only suppresses spurious perf-regression ISSUES.)
              if [ "$rc" -eq 1 ]; then
                echo "::warning::$scen exceeded policy on the first run — taking a confirm sample (3 more runs)."
                confirm_plumbing=0
                confirm_runs=()
                for i in 1 2 3; do
                  r=$(bash scripts/dev/perf-run.sh "$scen" 2>&1 | tail -1 || true)
                  if [ ! -f "$r" ]; then
                    echo "FAIL: $scen confirm scenario.run #$i did not produce $r" >&2
                    run_failure_count=$((run_failure_count + 1))
                    confirm_plumbing=1
                    break
                  fi
                  confirm_runs+=("$r")
                done
                if [ "$confirm_plumbing" = "0" ]; then
                  confirm_result=$(python scripts/dev/perf-median.py "${confirm_runs[@]}" | tail -1 || true)
                  if [ -f "$confirm_result" ]; then
                    python scripts/dev/perf-compare.py "$baseline" "$confirm_result" > /dev/null 2>&1
                    rc2=$?
                    if [ "$rc2" -eq 0 ]; then
                      echo "::notice::$scen confirm sample within policy — first exceed was runner noise (gated on the confirm median)."
                      result="$confirm_result"; rc=0
                    elif [ "$rc2" -eq 1 ]; then
                      echo "::warning::$scen exceeded policy on BOTH independent samples — confirmed regression."
                      result="$confirm_result"; rc=1
                    else
                      echo "FAIL: $scen confirm compare reported malformed input (rc=$rc2)" >&2
                      run_failure_count=$((run_failure_count + 1))
                      confirm_plumbing=1
                    fi
                  else
                    echo "FAIL: perf-median selected no usable confirm snapshot for $scen" >&2
                    run_failure_count=$((run_failure_count + 1))
                    confirm_plumbing=1
                  fi
                fi
                # A confirm-plumbing failure is already tracked in run_failure_count;
                # neutralise rc so it is not ALSO counted as a regression.
                [ "$confirm_plumbing" = "1" ] && rc=0
              fi
              # Report AFTER gating, on the gated (possibly confirm) sample.
              python scripts/dev/perf-compare.py "$baseline" "$result" --markdown-only >> /tmp/perf-report.md
              if [ "$rc" -ne 0 ]; then
                regression_count=$((regression_count + 1))
              fi
              # Improvement detection — any row's lastTotalMs improved by
              # >= 15 % is a candidate for baseline bump. Script extracted
              # from a column-0 YAML heredoc (same defect class as
              # perf-baseline-bootstrap.py — PR #323 fix).
              if python scripts/dev/perf-improvement-detect.py "$baseline" "$result"; then
                improved+=("$scen")
                improvement_count=$((improvement_count + 1))
              fi
            fi
            echo "::endgroup::"
          done < /tmp/scenarios.txt
          echo "regression_count=$regression_count" >> "$GITHUB_OUTPUT"
          echo "run_failure_count=$run_failure_count" >> "$GITHUB_OUTPUT"
          echo "improvement_count=$improvement_count" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${improved[@]}" > /tmp/improved.txt
          set -e
          cat /tmp/perf-report.md

      - name: Upload full-suite snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-full-snapshots
          path: |
            build/perf-runs/*.json
            docs/perf/baselines/*.ci-windows-latest.json

      # Slice 5 — Pillar 2 visible-cue invariant via bucket-E ImGui Test
      # Engine. BLOCKING final stage (all-gates-blocking flip): a visible-cue
      # regression is a Pillar-2 UX invariant break, and this nightly is the only
      # lane exercising it — masking it made the invariant unenforced. Builds the
      # ninja-ui-test-msvc preset (separate binaryDir, no conflict with the iter
      # build above) and runs the GoodOrder + BadOrder variants; a red here reds
      # the nightly full-suite run (never a PR — this workflow is schedule-driven).
      - name: Configure ninja-ui-test-msvc (visible-cue harness)
        run: cmake --preset ninja-ui-test-msvc

      - name: Build SmatchetStandalone (ui-test preset)
        run: cmake --build --preset ninja-ui-test-msvc --target SmatchetStandalone

      - name: Run visible-cue bucket-E driver
        run: bash scripts/dev/test-ui-sync-stall-visible-cue.sh

      # !cancelled() on the three follow-up steps below: the visible-cue stage above is
      # now unmasked (blocking), and these read the PERF step's outputs — a
      # visible-cue red must not swallow a perf-regression issue / baseline bump
      # (the implicit success() would skip them once any earlier step fails).
      - name: Open regression issue
        if: ${{ !cancelled() && steps.perf.outputs.regression_count > 0 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          # Stable title (NO per-run-id) so this upserts a single tracking
          # issue instead of spamming one per run. Find-then-comment mirrors
          # the sibling nightlies (sanitizer / fuzz / monkey).
          title="perf-regression: full-suite baseline exceeded"
          label="perf-regression"
          existing=$(gh issue list --state open --label "$label" --search "$title in:title" \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            {
              echo "Recurred: ${RUN_URL}"
              echo ""
              cat /tmp/perf-report.md
            } | gh issue comment "$existing" --body-file - || true
          else
            {
              echo "One or more in-scope scenarios exceeded their ci-windows-latest baseline."
              echo ""
              echo "Run: ${RUN_URL}"
              echo ""
              cat /tmp/perf-report.md
            } | gh issue create --title "$title" --label "$label" --body-file - || true
          fi

      - name: Open scenario-run-failure issue
        if: ${{ !cancelled() && steps.perf.outputs.run_failure_count > 0 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          # Stable title (NO per-run-id) so this upserts a single tracking
          # issue. Scope is now the committed-baseline set, so a run_failure
          # here is a REAL plumbing break of an in-scope scenario (not the old
          # "8 non-baselined scenarios always fail to spawn" noise that kept
          # this nightly perpetually RED).
          title="perf-run-failure: in-scope scenario produced no output"
          label="perf-regression"
          body="One or more IN-SCOPE scenarios (those with a committed ci-windows-latest baseline) failed to produce output — a build / exe / scenario-runner plumbing break. See the run logs for the failing scenario(s)."
          existing=$(gh issue list --state open --label "$label" --search "$title in:title" \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "Recurred: ${RUN_URL}" || true
          else
            gh issue create --title "$title" --label "$label" \
              --body "${body}"$'\n\n'"Run: ${RUN_URL}" || true
          fi

      - name: Push baseline-bump branch for improvements
        if: ${{ !cancelled() && steps.perf.outputs.improvement_count > 0 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="bot/perf-baseline-bump-${{ github.run_id }}"
          git checkout -b "$branch"
          # Bump ONLY the improved scenarios' baselines. All improved scenarios
          # are in-scope (they came out of the perf loop, which now iterates the
          # committed-baseline set), so each bump targets a tracked file.
          bumped=()
          while IFS= read -r scen; do
            [ -z "$scen" ] && continue
            bash scripts/dev/perf-baseline.sh bump "$scen" --host=ci-windows-latest --yes
            bumped+=("docs/perf/baselines/${scen}.ci-windows-latest.json")
          done < /tmp/improved.txt
          git config user.email "smatchet-perf-bot@noreply.local"
          git config user.name  "smatchet-perf-bot"
          # Stage ONLY the tracked baselines we just bumped — never a broad
          # `git add docs/perf/baselines/` (that would also sweep in any
          # untracked bootstrap writes). Mirrors the recapture step.
          git add "${bumped[@]}"
          if git diff --cached --quiet; then
            echo "::notice::improvement bump produced no baseline changes — nothing to push."
            exit 0
          fi
          git commit -m "chore(perf): bump ci-windows-latest baselines after improvement"
          git push -u origin "$branch"
          # NOTE: no `gh pr create` here — this repo disables "Allow GitHub
          # Actions to create and approve pull requests", so GITHUB_TOKEN can't
          # open a PR (GraphQL: not permitted, createPullRequest). Push the
          # branch; the orchestrator opens the review PR from it. Same push-only
          # pattern as the recapture step below.
          echo "::notice title=baseline-bump branch pushed::$branch — open the review PR from this branch to lock in the improved floor (gh Actions cannot create PRs on this repo)."

      # Manual recapture (perf-gate step-5 Phase 2): refresh the EXISTING
      # ci-windows-latest baselines from this on-runner run — not gated on an
      # improvement delta. Use after a snapshot-schema change (the p99Ms
      # emitter landed after the current baselines were captured, so they carry
      # no p99Ms). Reuses the same sanctioned writer (perf-baseline.sh bump) +
      # draft-PR-for-human-approval pattern as the improvement path above.
      #
      # Scope = ONLY scenarios that already have a docs/perf/baselines/
      # *.ci-windows-latest.json file — NOT the full scenario.list universe.
      # The full suite discovers ~14 scenarios, several of which have no
      # committed baseline and legitimately fail to spawn on the runner
      # (MCP-ready / app.quit timeouts); iterating that list re-ran + failed
      # them and (via the failed scenario-run-failure-issue step) starved this
      # step. `!cancelled()` gating keeps recapture alive across that unrelated
      # failure; the baseline-file loop keeps it to the 6 real baselines.
      - name: Open baseline-recapture PR (manual dispatch)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.recapture_baselines }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="bot/perf-baseline-recapture-${{ github.run_id }}"
          git checkout -b "$branch"
          # Source the recapture set from git (TRACKED files only). A filesystem
          # glob would also pick up the untracked baselines the full-suite step
          # bootstrap-WRITES for non-baselined scenarios — `git checkout --` only
          # restores tracked files, it does NOT remove those untracked writes, so
          # a glob swept ~12 extras into the commit (run 28762850902: 18 files).
          # git ls-files returns exactly the committed baseline set.
          baselines=()
          while IFS= read -r f; do baselines+=("$f"); done \
            < <(git ls-files 'docs/perf/baselines/*.ci-windows-latest.json')
          if [ ${#baselines[@]} -eq 0 ]; then
            echo "::error::no ci-windows-latest baselines to recapture."; exit 1
          fi
          for f in "${baselines[@]}"; do
            scen="$(basename "$f" .ci-windows-latest.json)"
            echo "::group::recapture $scen"
            bash scripts/dev/perf-baseline.sh bump "$scen" --host=ci-windows-latest --yes
            echo "::endgroup::"
          done
          git config user.email "smatchet-perf-bot@noreply.local"
          git config user.name  "smatchet-perf-bot"
          # stage ONLY the tracked recaptured baselines — untracked bootstrap
          # writes for non-baselined scenarios are never added.
          git add "${baselines[@]}"
          if git diff --cached --quiet; then
            echo "::notice::recapture produced no baseline changes — nothing to PR."
            exit 0
          fi
          git commit -m "chore(perf): recapture ci-windows-latest baselines (refresh incl. p99Ms)"
          git push -u origin "$branch"
          # NOTE: no `gh pr create` here — the repo disables "Allow GitHub Actions
          # to create and approve pull requests", so GITHUB_TOKEN can't open a PR
          # (GraphQL: not permitted, createPullRequest). Push the branch; the
          # orchestrator opens the golden-approval PR from it.
          echo "::notice title=recapture branch pushed::$branch — open the golden PR from this branch (gh Actions cannot create PRs on this repo)."
