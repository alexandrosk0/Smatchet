name: Duplication scanner (advisory)

# DRY Quality Pillar (Engineering Pillar 5): runs agents/scripts/core/dup_audit.py
# --diff over the PR's first-party C++ and surfaces NEW copy-paste clones as advisory
# [dup] WARN lines. WARN-first (calibration phase per ADR-0015): this job ALWAYS
# exits 0 and is NOT a required check — it does not block a merge yet. Graduation to
# a blocking gate is the committed follow-up once the false-positive rate is < 10%
# over ~20 PRs (plan: dry-pillar-dup-gate § Verification).
#
# Pattern A "always reports" (docs/agent-rules/ci-required-check-pattern.md): NO
# on.paths filter; the single job computes its own base and exits 0 when nothing is
# in scope, so the context reports on every PR — but advisory, never required.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: dup-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dup-scan:
    name: Duplication scanner (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan for NEW copy-paste clones (advisory — never blocks)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          echo "Duplication scanner (DRY pillar, WARN-first) — base: $base"
          # dup_audit.py --diff is WARN-first: it prints [dup] WARN lines to stderr and ALWAYS
          # exits 0. Capture its stderr to a file, echo it back to the log, and key the advisory
          # notice off it. The job's own success is independent of whether any clone was found.
          python3 agents/scripts/core/dup_audit.py --diff "$base" 2>/tmp/dup.warn || \
            echo "dup-scan: dup_audit.py exited non-zero (infra error) — not failing the advisory job." >&2
          cat /tmp/dup.warn >&2 || true
          if grep -q '\[dup\] WARN' /tmp/dup.warn 2>/dev/null; then
            n=$(grep -c '\[dup\] WARN' /tmp/dup.warn)
            echo "::notice::Duplication scanner found $n NEW copy-paste clone(s) (advisory; not blocking). De-duplicate or exempt with SMATCHET_DEVIATION(rule=duplication)."
          else
            echo "Duplication scanner: no new clones."
          fi
          exit 0
