name: Duplication scanner

# DRY Quality Pillar (Engineering Pillar 5): runs agents/scripts/core/dup_audit.py
# --diff over the PR's first-party C++ and BLOCKS on NEW copy-paste clones ([dup] FAIL
# lines, exit 1). Graduated WARN→blocking on 2026-06-21 (ADR-0015 calibration complete).
# De-duplicate or exempt a genuine NEW clone with SMATCHET_DEVIATION(rule=duplication).
#
# Pattern A "always reports" (docs/agent-rules/ci-required-check-pattern.md): NO
# on.paths filter; the single job computes its own base and exits 0 when nothing is
# in scope, so the context reports on every PR.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: dup-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dup-scan:
    name: Duplication scanner
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Scan for NEW copy-paste clones (blocks on a new clone)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # NO --depth: a shallow base-ref fetch re-shallows develop after the
            # fetch-depth:0 checkout and breaks merge-base for any diff consumer
            # (same defect as the Pillar-2 scanner, #1227(b)).
            git fetch --no-tags origin -- "${{ github.base_ref }}" 2>/dev/null || true
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          echo "Duplication scanner (DRY pillar, blocking) — base: $base"
          # dup_audit.py --diff prints [dup] FAIL lines to stderr and exits 1 on a NEW clone (exit 0
          # clean, >=2 infra error). Capture stderr, echo it back, then fail CLOSED on its exit code.
          rc=0
          python3 agents/scripts/core/dup_audit.py --diff "$base" 2>/tmp/dup.warn || rc=$?
          cat /tmp/dup.warn >&2 || true
          if [ "$rc" -eq 0 ]; then
            echo "Duplication scanner: no new clones."
            exit 0
          fi
          if [ "$rc" -ge 2 ]; then
            echo "::error::Duplication scanner infra error (exit $rc)."
            exit "$rc"
          fi
          n=$(grep -c '\[dup\] FAIL' /tmp/dup.warn 2>/dev/null || echo 0)
          echo "::error::Duplication scanner found $n NEW copy-paste clone(s). De-duplicate or exempt with SMATCHET_DEVIATION(rule=duplication)."
          exit 1
