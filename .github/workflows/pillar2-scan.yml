name: Pillar 2 scanner

# Pillar 2 (UI-thread never blocks > 100 ms): runs scripts/dev/pillar2-scan.sh
# over the PR's changed first-party C++ and fails on any new CRITICAL sync-I/O.
# Promotes the agent-side scanner to a GitHub-required check (plan:
# gate-enforcement-hardening § Slice 1).
#
# Required-check "always reports" — Pattern A in docs/agent-rules/ci-required-
# check-pattern.md: NO on.paths filter; the single job diffs changed files
# itself and exits 0 when none are first-party C++. So the "Pillar 2 scanner"
# context reports on EVERY PR (docs-only included) — no path-filter deadlock.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pillar2-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pillar2:
    name: Pillar 2 scanner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan changed first-party C++ for UI-thread sync I/O
        shell: bash
        run: |
          set -euo pipefail
          # Base = develop for PRs; for develop pushes, diff against the prior commit.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # NO --depth here: the diff below is three-dot ("$base"...HEAD), which
            # needs the merge-base of develop and HEAD. A --depth=1 fetch truncates
            # origin/develop to its tip, so a branch lagging the tip by even one
            # commit has no reachable merge-base → `git diff` exits 128 ("no merge
            # base") and the fail-closed guard rejects the PR (a recurring false
            # FAIL — bit the security campaign's #1245). checkout uses fetch-depth:0,
            # so the repo is already un-shallow and a full ref fetch is cheap.
            # Same defect lived in 4 sibling delta gates (dup-scan / build-and-test
            # ×2 / perf-pr-fast); all fixed + lint-swept by tests/bats/
            # delta_gate_base_ref_fetch.bats. (#1227(b))
            git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # #518 (fail-closed): the previous `git diff ... 2>/dev/null || true`
          # collapsed a FAILED diff (unresolvable base ref — e.g. a fetch that
          # silently failed, or an all-zero `before` on a first push) into an
          # EMPTY file list, so the scan was SKIPPED and the gate posted
          # "no first-party C++ changed — pass". A skipped Pillar-2 scan is a
          # non-result, not a pass. Verify the base resolves to a real commit,
          # and capture the diff's exit code: distinguish "diff ran, 0 matches"
          # (legit pass) from "diff errored" (hard fail).
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "Pillar 2 scanner: FAIL — base ref '$base' does not resolve to a commit" \
                 "(fetch failure / shallow clone?). Refusing to skip the scan." >&2
            exit 1
          fi
          diff_rc=0
          diff_out=$(git diff --name-only "$base"...HEAD) || diff_rc=$?
          if [ "$diff_rc" -ne 0 ]; then
            echo "Pillar 2 scanner: FAIL — 'git diff $base...HEAD' exited $diff_rc." \
                 "Refusing to skip the scan on a diff error." >&2
            exit 1
          fi
          # Array (not a space-joined string) so paths with spaces survive as
          # distinct args to pillar2-scan.sh.
          mapfile -t files < <(printf '%s\n' "$diff_out" \
                  | grep -E '\.(cpp|h|hpp)$' \
                  | grep -E '^(Source/Core/|Source/Plugins/)' \
                  | grep -v '/ThirdParty/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Pillar 2 scanner: no first-party C++ changed — pass."
            exit 0
          fi
          echo "Pillar 2 scanner: checking changed files:"
          printf '  %s\n' "${files[@]}"
          # pillar2-scan.sh exits 1 on any CRITICAL (new unannotated UI-thread
          # sync I/O); WARN-tracked backlog sites do not fail it.
          bash scripts/dev/pillar2-scan.sh "${files[@]}"
