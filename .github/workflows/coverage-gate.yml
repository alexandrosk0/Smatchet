name: Coverage gate (test-delta)

# Hard-blocking gate from day 1: any PR that touches Source/Core/src/*.cpp
# without a paired test delta under tests/ is rejected. The `tests-out-of-band`
# PR label dismisses the gate for legitimate non-behavioural changes
# (docs-only edits, include-shape fixes, sanitizer flag flips, build-system
# adjustments). Apply the label via the PR sidebar; any maintainer can do it.
#
# Why structural-not-threshold: this gate enforces "if you change behaviour,
# add a test." The numerical coverage threshold (>=70%) is the separate
# coverage.yml workflow's responsibility and stays advisory during the soak.
#
# See docs/plans/active/applied/test-suite-expansion-completion.md § Phase 9.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Merge-queue readiness (docs/plans/active/build-quality-velocity-hardening.md
  # finding #14 path B): `Test-delta gate` is a branch-protection REQUIRED check.
  # When develop is behind a GitHub merge queue, required checks run on the
  # synthetic `merge_group` ref; a required check that never reports there
  # deadlocks the queue forever (#880/#881/#882 class). This gate is inherently
  # PR-scoped (it diffs the PR head vs its base + reads the PR's override label),
  # and the queued commit already passed it at PR time, so on `merge_group` the
  # job SELF-GATES to a green no-op that still reports the same `Test-delta gate`
  # context — mirroring doc-validation.yml's Detect self-gate pattern.
  merge_group:

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  delta-gate:
    name: Test-delta gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0  # need full history for merge-base against develop

      # Self-gate for the merge queue: the delta gate is PR-scoped (diffs PR
      # head vs base, reads the PR's override label). On a `merge_group` event
      # there is no pull_request context — the queued commit already passed this
      # gate at PR time, so both PR-only steps below skip and the job reports the
      # `Test-delta gate` required context green (no-op). See the `on:` header.
      - name: Merge-queue no-op note
        if: github.event_name != 'pull_request'
        run: echo "merge_group event — Test-delta already enforced at PR time; reporting green."

      - name: Check for tests-out-of-band override label
        id: label_check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "${{ github.event.pull_request.number }}" --json labels --jq '.labels[].name' | tr '\n' ',' || echo "")
          echo "labels=$labels"
          if echo ",$labels," | grep -q ',tests-out-of-band,'; then
              echo "override=1" >> "$GITHUB_OUTPUT"
              echo "::notice::tests-out-of-band label present — gate dismissed"
          else
              echo "override=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run delta gate
        if: github.event_name == 'pull_request' && steps.label_check.outputs.override != '1'
        env:
          SMATCHET_COVERAGE_GATE_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/dev/coverage-delta-gate.sh
