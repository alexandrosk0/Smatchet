name: Plan-lock staleness sweep

# Daily cron that scans refs/locks/* on origin and opens (or updates) a
# GitHub Issue for any lock whose most-recent activity timestamp is older
# than the staleness threshold (default 14 days).
#
# Phase 4 of docs/plans/shipped/git-ref-plan-locks.md. The bulk of the logic
# lives in agents/scripts/core/lock-staleness-sweep.sh — keeping the YAML thin
# avoids the block-scalar parse pitfall where embedded multi-line Python
# heredocs at column 1 break the `run: |` literal block scalar (the
# bug that fix/lock-staleness-yaml-parse repaired).

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily — off-peak, prime-number minute
  workflow_dispatch:
    inputs:
      threshold_days:
        description: 'Override staleness threshold in days (default 14)'
        required: false
        default: '14'

concurrency:
  group: plan-lock-staleness
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sweep:
    name: Sweep refs/locks/* for stale entries
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1

      - name: Fetch refs/locks/*
        run: |
          # NOTE: no `|| true` — a transient fetch failure here would leave
          # the local namespace empty and the sweep would log "nothing to
          # sweep", silently skipping the day. Fail loud so the next
          # scheduled run retries and any permanent failure surfaces via
          # GitHub's repeated-failure email.
          git fetch --quiet --prune origin '+refs/locks/*:refs/locks/*'

      - name: Ensure `plan-lock-stale` label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: create the label only if missing. `gh label create`
          # exits non-zero on duplicate, hence the existence check first.
          if ! gh label list --repo "${{ github.repository }}" --limit 500 \
              --json name --jq '.[].name' | grep -qx 'plan-lock-stale'; then
            gh label create plan-lock-stale \
              --repo "${{ github.repository }}" \
              --color "fbca04" \
              --description "Auto-generated by lock-staleness.yml; resolve via lock-claim-update or lock-release."
          fi

      - name: Sweep and post Issues
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THRESHOLD_DAYS: ${{ github.event.inputs.threshold_days || '14' }}
        run: bash agents/scripts/core/lock-staleness-sweep.sh
