name: Plan-lock staleness sweep

# Daily cron that scans refs/locks/* on origin and opens (or updates) a
# GitHub Issue for any lock whose most-recent activity timestamp is older
# than the staleness threshold (default 14 days).
#
# Phase 4 of docs/design/git-ref-plan-locks.md. The action never deletes
# refs — silent deletion would break coordination with the slice that
# claimed the lock. An Issue surfaces the stale ref so a human (or the
# plan owner) can decide: rescue the slice, abandon it, or extend it via
# `bash scripts/dev/lock-claim-update.sh`.
#
# Staleness is computed against `max(claim.started, claim.updated)` so
# locks that have been touched recently are not flagged even if the
# original claim is old.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily — off-peak, prime-number minute
  workflow_dispatch:
    inputs:
      threshold_days:
        description: 'Override staleness threshold in days (default 14)'
        required: false
        default: '14'

concurrency:
  group: plan-lock-staleness
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    name: Sweep refs/locks/* for stale entries
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Fetch refs/locks/*
        run: |
          git fetch --quiet --prune origin '+refs/locks/*:refs/locks/*' || true

      - name: Ensure `plan-lock-stale` label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: create the label only if missing. `gh label create`
          # exits non-zero on duplicate, hence the existence check first.
          if ! gh label list --repo "${{ github.repository }}" --limit 500 \
              --json name --jq '.[].name' | grep -qx 'plan-lock-stale'; then
            gh label create plan-lock-stale \
              --repo "${{ github.repository }}" \
              --color "fbca04" \
              --description "Auto-generated by lock-staleness.yml; resolve via lock-claim-update or lock-release."
          fi

      - name: Sweep and post Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THRESHOLD_DAYS: ${{ github.event.inputs.threshold_days || '14' }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          NOW_EPOCH=$(date -u +%s)
          THRESHOLD_SECS=$((THRESHOLD_DAYS * 86400))

          echo "::notice::Sweep starting; threshold=${THRESHOLD_DAYS} days (${THRESHOLD_SECS} s); repo=${REPO}."

          refs=$(git for-each-ref --format='%(refname)' refs/locks/ || true)
          if [ -z "$refs" ]; then
            echo "::notice::No refs/locks/* present; nothing to sweep."
            exit 0
          fi

          stale_count=0
          fresh_count=0

          for ref in $refs; do
            slug=${ref#refs/locks/}

            # Read claim.json; tolerate parse errors.
            claim=$(git cat-file blob "${ref}:claim.json" 2>/dev/null || echo '{}')

            # Extract started + updated via python (stdlib).
            read_ts() {
              python3 -c "
import json, sys
d = json.loads(sys.stdin.read() or '{}')
started = d.get('started') or ''
updated = d.get('updated') or started
# Print updated unless empty; fall back to started.
print(updated or started)
" 2>/dev/null || true
            }
            latest_ts=$(printf '%s' "$claim" | read_ts)

            if [ -z "$latest_ts" ]; then
              echo "::warning::${ref} claim.json has no started/updated timestamp; skipping."
              continue
            fi

            # Parse ISO-8601 to epoch via python (date -d works on GNU but
            # this keeps parsing isolated to one tool).
            ts_epoch=$(python3 -c "
import sys, datetime
s = '${latest_ts}'
try:
    # Accept both 'Z' and '+00:00' suffix forms.
    if s.endswith('Z'):
        s = s[:-1] + '+00:00'
    print(int(datetime.datetime.fromisoformat(s).timestamp()))
except Exception:
    print('')
")

            if [ -z "$ts_epoch" ]; then
              echo "::warning::${ref} timestamp '${latest_ts}' unparseable; skipping."
              continue
            fi

            age_secs=$((NOW_EPOCH - ts_epoch))
            age_days=$((age_secs / 86400))

            if [ "$age_secs" -lt "$THRESHOLD_SECS" ]; then
              fresh_count=$((fresh_count + 1))
              echo "fresh: ${slug} age=${age_days}d"
              continue
            fi

            stale_count=$((stale_count + 1))
            echo "::warning::STALE: ${slug} age=${age_days}d (latest=${latest_ts})"

            # Extract human-facing context for the Issue body.
            owner=$(printf '%s' "$claim" | python3 -c "import json,sys; print(json.loads(sys.stdin.read() or '{}').get('owner') or '?')")
            branch=$(printf '%s' "$claim" | python3 -c "import json,sys; print(json.loads(sys.stdin.read() or '{}').get('branch') or '?')")
            plan=$(printf '%s' "$claim" | python3 -c "import json,sys; print(json.loads(sys.stdin.read() or '{}').get('originating_plan') or '')")
            ws_count=$(printf '%s' "$claim" | python3 -c "import json,sys; print(len(json.loads(sys.stdin.read() or '{}').get('write_set') or []))")

            title="Stale plan-lock: ${slug}"

            # Look up an existing open Issue with this exact title.
            existing=$(gh issue list \
              --repo "$REPO" \
              --state open \
              --search "in:title \"${title}\"" \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n1 || true)

            body_file=$(mktemp)
            {
              echo "Plan-lock \`${slug}\` has been in-flight for **${age_days} days** without an \`updated\` timestamp newer than the staleness threshold (${THRESHOLD_DAYS} days)."
              echo
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Slug | \`${slug}\` |"
              echo "| Owner | \`${owner}\` |"
              echo "| Branch | \`${branch}\` |"
              if [ -n "$plan" ]; then
                echo "| Originating plan | [\`${plan}\`](../blob/develop/${plan}) |"
              fi
              echo "| Latest activity | \`${latest_ts}\` |"
              echo "| Age | ${age_days} days |"
              echo "| Write-set size | ${ws_count} paths |"
              echo
              echo "## What to do"
              echo
              echo "Pick one:"
              echo
              echo "1. **Slice is still active** — bump the lock with \`bash scripts/dev/lock-claim-update.sh ${slug} <write-set-file>\` to refresh \`updated\`. This Issue will close automatically on the next sweep."
              echo "2. **Slice is abandoned** — \`bash scripts/dev/lock-release.sh ${slug}\` to delete the ref. Close this Issue."
              echo "3. **Slice has merged** — the PR was missing a \`lock-slug: ${slug}\` line in its body. \`bash scripts/dev/lock-release.sh ${slug}\` and close this Issue. Add the line to future PRs holding a lock."
              echo
              echo "Live ref state: \`bash scripts/dev/locks-show.sh\`."
              echo "Plan: [\`docs/design/git-ref-plan-locks.md\`](../blob/develop/docs/design/git-ref-plan-locks.md)."
              echo
              echo "_Auto-generated by \`.github/workflows/lock-staleness.yml\` at $(date -u +%Y-%m-%dT%H:%M:%SZ)._"
            } > "$body_file"

            if [ -n "$existing" ]; then
              echo "::notice::Updating Issue #${existing} for ${slug}."
              gh issue edit "$existing" \
                --repo "$REPO" \
                --body-file "$body_file"
            else
              echo "::notice::Opening new Issue for ${slug}."
              gh issue create \
                --repo "$REPO" \
                --title "$title" \
                --body-file "$body_file" \
                --label "plan-lock-stale"
            fi

            rm -f "$body_file"
          done

          echo "::notice::Sweep finished. stale=${stale_count}, fresh=${fresh_count}."
