name: Build and test

# Primary CI: MSVC + Clang (equal-citizen toolchains).
# See docs/design/generic-cmake-cross-platform.md.

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agents/**'
      - '.gitignore'
      - '.gitattributes'
      - '.coderabbit.yaml'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agents/**'
      - '.gitignore'
      - '.gitattributes'
      - '.coderabbit.yaml'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'

# Cancel in-flight runs for the same branch on a new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows + MSVC
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (msvc)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-test-msvc/_deps
            build/ninja-iter-msvc/_deps
          key: ${{ runner.os }}-fetchcontent-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Toolchain pre-flight (doctor.sh)
        shell: bash
        run: |
          set +e
          bash scripts/dev/doctor.sh
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error::doctor.sh failed (required toolchain check)"
            exit 1
          fi
          echo "doctor.sh rc=$rc (0=GREEN, 2=YELLOW acceptable in CI)"

      - name: Configure ninja-test-msvc
        run: cmake --preset ninja-test-msvc

      - name: Build test binaries (MSVC)
        run: cmake --build --preset ninja-test-msvc

      - name: Run ctest (MSVC)
        working-directory: build/ninja-test-msvc
        run: ctest --output-on-failure

      - name: Configure ninja-iter-msvc
        run: cmake --preset ninja-iter-msvc

      - name: Build SmatchetStandalone (MSVC)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

      - name: Build SmatchetCore_DX12 (MSVC dual-target)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetCore_DX12

      - name: Run non-UI bucket-A tests
        shell: bash
        run: |
          bash scripts/dev/test-cppcheck-path-detection.sh
          bash scripts/dev/test-build-warnings.sh
          bash scripts/dev/test-markdown-lang-tag.sh

      - name: Upload Smatchet.exe artefact (for bucket-C / bucket-E jobs)
        uses: actions/upload-artifact@v4
        with:
          name: smatchet-exe-${{ github.run_id }}
          path: |
            build/ninja-iter-msvc/Smatchet.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload Smatchet.exe on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Smatchet-failure-${{ github.run_id }}
          path: build/ninja-iter-msvc/Smatchet.exe
          if-no-files-found: ignore

  windows-msvc-no-whisper:
    name: Windows + MSVC (SMATCHET_WITH_WHISPER=OFF)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (msvc-no-whisper)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-iter-msvc/_deps
          key: ${{ runner.os }}-fetchcontent-msvc-no-whisper-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-iter-msvc with SMATCHET_WITH_WHISPER=OFF
        run: cmake --preset ninja-iter-msvc -DSMATCHET_WITH_WHISPER=OFF

      - name: Build SmatchetStandalone (MSVC, no whisper)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

  windows-msvc-no-agentic:
    name: Windows + MSVC (SMATCHET_WITH_AGENTIC=OFF)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (msvc-no-agentic)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-iter-msvc/_deps
          key: ${{ runner.os }}-fetchcontent-msvc-no-agentic-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-iter-msvc with SMATCHET_WITH_AGENTIC=OFF
        run: cmake --preset ninja-iter-msvc -DSMATCHET_WITH_AGENTIC=OFF

      - name: Build SmatchetStandalone (MSVC, no agentic)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

  bucket-c-screenshot-diff:
    name: Bucket-C screenshot diff (Mesa headless GL)
    needs: windows-msvc
    runs-on: windows-2022
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Smatchet.exe artefact
        uses: actions/download-artifact@v4
        with:
          name: smatchet-exe-${{ github.run_id }}
          path: build/ninja-iter-msvc/

      - name: Install Mesa software OpenGL ICD (opengl32sw.dll)
        shell: bash
        env:
          MESA_VERSION: "24.2.5"
        run: |
          set -euo pipefail
          mkdir -p mesa-tmp
          cd mesa-tmp
          curl -fL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z x mesa.7z -o./extracted >/dev/null 2>&1 || true
          if [ -f extracted/x64/opengl32.dll ]; then
            cp extracted/x64/opengl32.dll ../build/ninja-iter-msvc/opengl32.dll
          fi
          cd ..
          rm -rf mesa-tmp

      - name: Run bucket-C screenshot diff
        continue-on-error: true
        shell: bash
        env:
          SMATCHET_EXE: build/ninja-iter-msvc/Smatchet.exe
          TMPDIR: ${{ github.workspace }}/build/tmp
          SMATCHET_KEEP_SCREENSHOT_CAPTURES: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "${TMPDIR}"
          bash scripts/dev/test-screenshot-diff.sh

      - name: Upload captured PNGs (for golden bootstrap)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-c-captures-${{ github.run_id }}
          path: |
            build/tmp/smatchet-screenshot-diff-*/*.png
          if-no-files-found: ignore

  bucket-e-ui-tests:
    name: Bucket-E UI tests (Mesa headless GL)
    needs: windows-msvc
    runs-on: windows-2022
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (ui-test preset)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-ui-test-msvc/_deps
          key: ${{ runner.os }}-fetchcontent-ui-test-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-ui-test-msvc
        run: cmake --preset ninja-ui-test-msvc

      - name: Build SmatchetStandalone (UI tests on)
        run: cmake --build --preset ninja-ui-test-msvc

      - name: Install Mesa software OpenGL ICD (opengl32sw.dll)
        shell: bash
        env:
          MESA_VERSION: "24.2.5"
        run: |
          set -euo pipefail
          mkdir -p mesa-tmp
          cd mesa-tmp
          curl -fL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z x mesa.7z -o./extracted >/dev/null 2>&1 || true
          if [ -f extracted/x64/opengl32.dll ]; then
            cp extracted/x64/opengl32.dll ../build/ninja-ui-test-msvc/opengl32.dll
          fi
          cd ..
          rm -rf mesa-tmp

      - name: Run bucket-E ImGui Test Engine scenario
        id: run-bucket-e
        continue-on-error: true
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: build/ninja-ui-test-msvc
        run: ./Smatchet.exe scenario.run --name=ui-test --yes

      - name: Upload bucket-E exe on failure
        if: ${{ steps.run-bucket-e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: bucket-e-exe-${{ github.run_id }}
          path: build/ninja-ui-test-msvc/Smatchet.exe
          if-no-files-found: ignore

  sanitizer-asan:
    name: Sanitizer (ASAN via MSVC)
    needs: windows-msvc
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (msvc-asan)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-msvc-asan/_deps
          key: ${{ runner.os }}-fetchcontent-msvc-asan-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-msvc-asan
        run: cmake --preset ninja-msvc-asan -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_LUA_AUTOMATION=OFF

      - name: Build (ASAN via MSVC)
        run: cmake --build --preset ninja-msvc-asan

      - name: Run ctest under ASAN
        working-directory: build/ninja-msvc-asan
        run: ctest --output-on-failure

      - name: Surface sanitizer report in job summary
        if: failure()
        shell: bash
        run: |
          echo "## ASAN failure (MSVC)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/ninja-msvc-asan/Testing/Temporary/LastTest.log ]; then
            grep -A 30 'ERROR: AddressSanitizer' \
              build/ninja-msvc-asan/Testing/Temporary/LastTest.log \
              | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
