name: Build and test

# Primary CI: MSVC + Clang (equal-citizen toolchains).
# See docs/plans/shipped/generic-cmake-cross-platform.md.

# Least-privilege default for GITHUB_TOKEN: every job here only checks out,
# builds, and uploads run-scoped artifacts — none writes to the repo. Jobs that
# need more elevate per-job (none currently do).
permissions:
  contents: read

on:
  # NO paths-ignore: required status checks (Windows + MSVC, Windows + MSVC
  # light) must report on EVERY PR or branch protection wedges docs-only PRs
  # ("Expected — Waiting for status," unmergeable). Instead the `changes` job
  # below detects whether any non-docs path changed and the build jobs skip
  # when it is docs-only — a skipped required job is treated as success by
  # branch protection, while a path-skipped workflow never reports at all.
  # See docs/agent-rules/ci-required-check-pattern.md (Pattern C).
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Cancel in-flight runs for the same branch on a new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: did any NON-docs path change? Build jobs key off this so a
  # docs-only PR skips the expensive Windows builds while the required check
  # contexts still report (skipped == success for branch protection).
  # Fail-safe: any detection uncertainty (empty/failed diff) defaults to
  # code=true, so a code PR can never be wrongly skipped — the worst case is
  # running a build that wasn't strictly needed, never skipping one that was.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect non-docs changes
        id: detect
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1...HEAD"
            else
              range="${before}...HEAD"
            fi
          fi
          files=$(git diff --name-only $range 2>/dev/null || true)
          echo "Changed files in ${range}:"; printf '  %s\n' $files
          # Default code=true (fail-safe). Only flip to false when we have a
          # non-empty file list AND every entry is a docs-class path.
          code=true
          if [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # Build-invoked exception: test-lint-rules.sh is the strict-zone
                # delta gate run INSIDE the windows-msvc job (steps below at the
                # "--diff origin/develop" + develop "--catalog --refresh" lines).
                # It lives in the agentic tree but a change to it MUST trigger the
                # build so the gate is re-validated — otherwise a PR touching only
                # the gate skips the build and the gate never runs. Keep before the
                # agents/* docs-class arm (case matches first pattern).
                agents/scripts/project/test-lint-rules.sh) code=true; break ;;
                *.md|docs/*|agents/*|scripts/dev/local/*|.gitignore|.gitattributes|.coderabbit.yaml|.github/CODEOWNERS|.github/pull_request_template.md) ;;
                *) code=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "non-docs changes present: ${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  windows-msvc:
    name: Windows + MSVC
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (msvc)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-test-msvc/_deps
            build/ninja-iter-msvc/_deps
          key: ${{ runner.os }}-fetchcontent-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Toolchain pre-flight (doctor.sh)
        shell: bash
        run: |
          set +e
          bash scripts/dev/doctor.sh
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error::doctor.sh failed (required toolchain check)"
            exit 1
          fi
          echo "doctor.sh rc=$rc (0=GREEN, 2=YELLOW acceptable in CI)"

      - name: Configure ninja-test-msvc
        run: cmake --preset ninja-test-msvc

      - name: Build test binaries (MSVC)
        run: cmake --build --preset ninja-test-msvc

      - name: Run ctest (MSVC)
        working-directory: build/ninja-test-msvc
        run: ctest --output-on-failure

      - name: Fetch Font Awesome 6 Solid TTF (pinned + checksum-verified)
        shell: bash
        env:
          # Pin to an immutable tag, not the mutable `6.x` branch — protects
          # against silent upstream changes / branch hijack.
          FA_TAG: "6.7.2"
          # sha256 of fa-solid-900.ttf at tag 6.7.2. Bump in lockstep with FA_TAG.
          FA_SHA256: "af19d135d3a935b3ebfbd80320716ffe1202052c5f68dc2c5f1abc57005ac605"
        run: |
          set -euo pipefail
          # `-f` flips curl to fail on HTTP error (so a 404 HTML page doesn't
          # land in the font path). `-L` follows redirects.
          curl -fsSL \
               "https://github.com/FortAwesome/Font-Awesome/raw/${FA_TAG}/webfonts/fa-solid-900.ttf" \
               -o assets/fonts/fa-solid-900.ttf
          echo "${FA_SHA256}  assets/fonts/fa-solid-900.ttf" | sha256sum -c -
          ls -l assets/fonts/fa-solid-900.ttf

      - name: Configure ninja-iter-msvc
        run: cmake --preset ninja-iter-msvc

      - name: Build SmatchetStandalone (MSVC)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

      - name: Run non-UI bucket-A tests
        shell: bash
        run: |
          bash scripts/dev/test-cppcheck-path-detection.sh
          bash scripts/dev/test-build-warnings.sh
          bash scripts/dev/test-markdown-lang-tag.sh
          # High-integrity C++ delta gate (docs/plans/shipped/high-integrity-cpp-enforcement.md):
          # fail on any NEW strict-zone violation vs origin/develop, grandfathering
          # existing. The gate scans HEAD vs a base worktree of origin/develop, so
          # fetch that ref (depth 1 is enough — no merge-base needed); warn-skips if
          # unreachable.
          git fetch --no-tags --depth=1 origin develop
          git rev-parse --verify --quiet origin/develop >/dev/null || {
            echo "::error::origin/develop unavailable — cannot run high-integrity delta gate"; exit 1; }
          bash agents/scripts/project/test-lint-rules.sh --diff origin/develop
          # NB: the gate's bats (tests/bats/lint_rules.bats via test-lint-rules-bats.sh)
          # run at the pre-push gate (test-all.sh, where bats is installed), NOT here —
          # the Windows CI runner has no bats (the wrapper would exit 2 / "bats missing").
          # CI enforces the gate itself (--diff above); the bats are the gate's unit tests.

      - name: Upload Smatchet.exe artefact (for bucket-C / bucket-E jobs)
        uses: actions/upload-artifact@v4
        with:
          name: smatchet-exe-${{ github.run_id }}
          path: |
            build/ninja-iter-msvc/Smatchet.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload Smatchet.exe on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Smatchet-failure-${{ github.run_id }}
          path: build/ninja-iter-msvc/Smatchet.exe
          if-no-files-found: ignore

  windows-msvc-light:
    name: Windows + MSVC (Smatchet light — AI/Whisper/MCP off)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (msvc-light)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-iter-msvc/_deps
          key: ${{ runner.os }}-fetchcontent-msvc-light-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # Smatchet "light" feature set (the _smatchet-light-features profile):
      # AI + Whisper + MCP OFF. One build replaces the former per-flag-off jobs
      # (no-whisper + no-agentic — the latter set a flag CMake no longer defines)
      # and exercises that every stub-side TU (Lua/Whisper/AI/MCP bindings<->stubs
      # split) compiles cleanly with those features disabled.
      - name: Configure ninja-iter-msvc (Smatchet light)
        run: cmake --preset ninja-iter-msvc -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_AI=OFF -DSMATCHET_WITH_MCP=OFF

      - name: Build SmatchetStandalone (Smatchet light)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

      # The DX12 / Unreal-embedded core compiles with the light feature set:
      # SMATCHET_EMBEDDED_IN_UNREAL forces Whisper off (CMakeLists.txt), and the
      # Unreal plugin ships AI + MCP off too (SMATCHET_WITH_MCP_UNREAL). The
      # SmatchetCore_DX12 target is gated only by if(WIN32) — not by any feature
      # flag — so it still builds with AI/Whisper/MCP off. Keeping the dual-target
      # compile guard here (off the windows-msvc critical path that bucket-c /
      # bucket-e / sanitizer gate on via `needs:`) shortens the overall pipeline.
      - name: Build SmatchetCore_DX12 (Unreal-embedded dual-target)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetCore_DX12

  bucket-c-screenshot-diff:
    name: Bucket-C screenshot diff (Mesa headless GL)
    needs: windows-msvc
    runs-on: windows-2022
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Smatchet.exe artefact
        uses: actions/download-artifact@v4
        with:
          name: smatchet-exe-${{ github.run_id }}
          path: build/ninja-iter-msvc/

      - name: Install Mesa software OpenGL ICD (opengl32sw.dll)
        shell: bash
        env:
          MESA_VERSION: "24.2.5"
        run: |
          set -euo pipefail
          mkdir -p mesa-tmp
          cd mesa-tmp
          curl -fL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z x mesa.7z -o./extracted >/dev/null 2>&1 || true
          if [ -f extracted/x64/opengl32.dll ]; then
            cp extracted/x64/opengl32.dll ../build/ninja-iter-msvc/opengl32.dll
          fi
          cd ..
          rm -rf mesa-tmp

      - name: Run bucket-C screenshot diff
        continue-on-error: true
        shell: bash
        env:
          SMATCHET_EXE: build/ninja-iter-msvc/Smatchet.exe
          TMPDIR: ${{ github.workspace }}/build/tmp
          SMATCHET_KEEP_SCREENSHOT_CAPTURES: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "${TMPDIR}"
          bash scripts/dev/test-screenshot-diff.sh

      - name: Upload captured PNGs (for golden bootstrap)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-c-captures-${{ github.run_id }}
          path: |
            build/tmp/smatchet-screenshot-diff-*/*.png
          if-no-files-found: ignore

  bucket-e-ui-tests:
    name: Bucket-E UI tests (Mesa headless GL)
    needs: windows-msvc
    runs-on: windows-2022
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (ui-test preset)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-ui-test-msvc/_deps
          key: ${{ runner.os }}-fetchcontent-ui-test-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-ui-test-msvc
        run: cmake --preset ninja-ui-test-msvc

      - name: Build SmatchetStandalone (UI tests on)
        run: cmake --build --preset ninja-ui-test-msvc

      - name: Install Mesa software OpenGL ICD (opengl32sw.dll)
        shell: bash
        env:
          MESA_VERSION: "24.2.5"
        run: |
          set -euo pipefail
          mkdir -p mesa-tmp
          cd mesa-tmp
          curl -fL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z x mesa.7z -o./extracted >/dev/null 2>&1 || true
          if [ -f extracted/x64/opengl32.dll ]; then
            cp extracted/x64/opengl32.dll ../build/ninja-ui-test-msvc/opengl32.dll
          fi
          cd ..
          rm -rf mesa-tmp

      - name: Run bucket-E ImGui Test Engine scenario
        id: run-bucket-e
        continue-on-error: true
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: build/ninja-ui-test-msvc
        run: ./Smatchet.exe scenario.run --name=ui-test --yes

      - name: Upload bucket-E exe on failure
        if: ${{ steps.run-bucket-e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: bucket-e-exe-${{ github.run_id }}
          path: build/ninja-ui-test-msvc/Smatchet.exe
          if-no-files-found: ignore

  sanitizer-asan:
    name: Sanitizer (ASAN via MSVC)
    needs: windows-msvc
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent _deps (msvc-asan)
        uses: actions/cache@v4
        with:
          path: |
            build/ninja-msvc-asan/_deps
          key: ${{ runner.os }}-fetchcontent-msvc-asan-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-msvc-asan
        run: cmake --preset ninja-msvc-asan -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_LUA_AUTOMATION=OFF

      - name: Build (ASAN via MSVC)
        run: cmake --build --preset ninja-msvc-asan

      - name: Run ctest under ASAN
        working-directory: build/ninja-msvc-asan
        run: ctest --output-on-failure

      - name: Surface sanitizer report in job summary
        if: failure()
        shell: bash
        run: |
          echo "## ASAN failure (MSVC)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/ninja-msvc-asan/Testing/Temporary/LastTest.log ]; then
            grep -A 30 'ERROR: AddressSanitizer' \
              build/ninja-msvc-asan/Testing/Temporary/LastTest.log \
              | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  high-integrity-baseline-drift:
    name: High-integrity baseline (develop drift)
    # develop post-merge only: regenerate the grandfathered baseline and fail if
    # the committed snapshot diverged. CI stays read-only against develop — it
    # never auto-commits; the remediation is for a contributor to refresh + commit.
    # See docs/plans/shipped/high-integrity-cpp-enforcement.md § CI baseline-refresh policy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refresh baseline + assert no drift
        shell: bash
        run: |
          bash agents/scripts/project/test-lint-rules.sh --catalog --refresh
          if ! git diff --exit-code docs/high-integrity/baseline.md; then
            echo "::error::baseline stale — run 'bash agents/scripts/project/test-lint-rules.sh --catalog --refresh' locally and commit"
            exit 1
          fi
          echo "high-integrity baseline in sync"

  high-integrity-narrowing:
    name: High-integrity narrowing (clang)
    # develop post-merge only: cppcoreguidelines-narrowing-conversions needs a
    # *clang* compile-DB with the PCH disabled — clang-tidy can't load the project
    # PCH (cmake_pch.cxx.pch) and clang-cl targets the MSVC ABI, so this is
    # Windows-only. Mirrors high-integrity-baseline-drift: develop-push gated,
    # read-only, fails forward post-merge rather than blocking every PR on a clang
    # configure. See docs/plans/active/high-integrity-cpp-enforcement.md § Deviations.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure ninja-iter-clang (PCH-free, compile-DB only)
        # No build: clang-tidy parses each strict TU straight from compile_commands.json.
        # PCH disabled so there is no unbuilt cmake_pch.cxx.pch to load. Whisper off
        # (not in the strict zone; skips a large FetchContent pull).
        run: cmake --preset ninja-iter-clang -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DSMATCHET_WITH_WHISPER=OFF

      - name: Verify clang toolchain + compile-DB present
        # Fail CLOSED: a missing clang-tidy / db would make scan_narrowing warn-skip
        # and the gate would pass without checking anything (silent false-clean).
        shell: bash
        run: |
          command -v clang-tidy >/dev/null 2>&1 || { echo "::error::clang-tidy not on PATH"; exit 1; }
          test -f build/ninja-iter-clang/compile_commands.json || { echo "::error::clang compile_commands.json missing"; exit 1; }

      - name: Enforce zero first-party strict-zone narrowing
        # --catalog (not --full): runs the per-TU clang-tidy sweep ONCE. --full
        # computes the triple set twice (display + count) — a needless second
        # serial clang-tidy pass over the whole strict zone.
        shell: bash
        run: |
          set -uo pipefail
          out="$(SMATCHET_LINT_NARROWING=1 bash agents/scripts/project/test-lint-rules.sh --catalog)"
          printf '%s\n' "$out"
          n="$(printf '%s\n' "$out" | grep -oE 'narrowing-conversions \([0-9]+ entries\)' | grep -oE '[0-9]+' | head -1)"
          if [ "${n:-1}" != "0" ]; then
            echo "::error::first-party strict-zone narrowing-conversions found (${n:-unknown}) — fix the cast (static_cast<std::ptrdiff_t> / std::next); do not grandfather:"
            printf '%s\n' "$out" | sed -n '/narrowing-conversions (/,/^## /p'
            exit 1
          fi
          echo "strict-zone narrowing-conversions: clean (0 first-party)"
