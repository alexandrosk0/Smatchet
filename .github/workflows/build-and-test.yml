      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (msvc-light)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-msvc-light-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-msvc-light-

      - name: Cache FetchContent _deps (msvc-light)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-light-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # Smatchet "light" feature set (the _smatchet-light-features profile):
      # AI + Whisper + MCP OFF. One build replaces the former per-flag-off jobs
      # (no-whisper + no-agentic — the latter set a flag CMake no longer defines)
      # and exercises that every stub-side TU (Lua/Whisper/AI/MCP bindings<->stubs
      # split) compiles cleanly with those features disabled.
      - name: Configure ninja-iter-msvc (Smatchet light)
        run: cmake --preset ninja-iter-msvc -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_AI=OFF -DSMATCHET_WITH_MCP=OFF

      - name: Build SmatchetStandalone (Smatchet light)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

      # The DX12 / Unreal-embedded core compiles with the light feature set: the
      # explicit -DSMATCHET_WITH_WHISPER=OFF on the configure step above keeps
      # Whisper off (SMATCHET_EMBEDDED_IN_UNREAL is a per-target compile define,
      # not a CMake variable — it gates nothing at configure time), and the
      # Unreal plugin ships AI + MCP off too (SMATCHET_WITH_MCP_UNREAL). The
      # SmatchetCore_DX12 target is gated only by if(WIN32) — not by any feature
      # flag — so it still builds with AI/Whisper/MCP off. Keeping the dual-target
      # compile guard here (off the windows-msvc critical path that bucket-c /
      # bucket-e / sanitizer gate on via `needs:`) shortens the overall pipeline.
      - name: Build SmatchetCore_DX12 (Unreal-embedded dual-target)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetCore_DX12

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  bucket-c-screenshot-diff:
    name: Bucket-C screenshot diff (Mesa headless GL)
    needs: windows-msvc
    runs-on: windows-2022
    # 20 -> 30: the llvmpipe (GALLIUM_DRIVER=llvmpipe) screenshot-diff step alone
    # burned the whole 20-min budget on a slow-runner develop run (run 28289436753:
    # setup ~0.3m, then the diff step ran 19.8m and GitHub cancelled it AT the cap).
    # A healthy run is <1m; 30m gives comfortable headroom for the software-GL slow
    # path without approaching the ~45-50 pipeline ceiling. Coverage unchanged.
    # No job-level continue-on-error (all-gates-blocking flip): infrastructure steps
    # (checkout / artifact download / Mesa install / lane-integrity) red the check
    # for real. The one remaining mask is the per-scenario golden-diff STEP below —
    # advisory BY DESIGN until CI-native goldens exist (goldens are per-developer
    # GPU bootstraps; llvmpipe output diffing against them is not authoritative).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the golden-verdict report dates each golden by the
          # commit that last changed it (`git log -1 --format=%ct`). A default
          # depth-1 checkout has no such commit for an untouched golden, and the
          # filesystem mtime is the CHECKOUT time — which would report a
          # months-old golden as 0 days old, the fresh-looking lie the report
          # exists to kill. Three other jobs already take this cost.
          fetch-depth: 0
          # This job runs branch-controlled code (the driver + the exe artefact)
          # and needs only local `git log` reads — never an authenticated fetch
          # or push — so it keeps no checkout credentials around for that code to
          # reach (zizmor `artipacked`).
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Download Smatchet.exe artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smatchet-exe-${{ github.run_id }}
          path: build/ninja-iter-msvc/

      # Cache + install the Mesa software-GL DLL trio beside the iter-msvc exe.
      # Extracted to a composite action so bucket-C/E + Jira-fixture + launch-smoke
      # share one definition. docs/plans/ci-build-time-reduction.md Phase 2.
      - name: Install Mesa software GL
        uses: ./.github/actions/install-mesa-gl
        with:
          target-dir: build/ninja-iter-msvc

      # Launch-smoke moved OUT of this advisory job into the dedicated, hard-fail
      # `Bucket launch-smoke (Mesa GL)` job (graduated 2026-06-18). The dead-harness
      # boot check now lives in its own blocking check-run; bucket-C stays advisory
      # for its screenshot-diff purpose. The lane-integrity step below still
      # fail-closes this job's broken-lane teeth (Passed==0 && Failed>0).

      # The goldens are 1920x1009 captures, but a top-level Win32 window cannot exceed the
      # virtual desktop (MaxTrackSize clamps it to roughly the desktop size). On the runner's
      # default desktop the scenario's 1920x1009 resize request came back as a 1028x749
      # framebuffer, so EVERY golden diff degraded to `dimension mismatch` (L_inf -1) and the
      # step-level mask below swallowed it — bucket-C reported green while comparing nothing
      # (#2092). Widen the desktop first so the requested geometry is actually reachable.
      #
      # Non-fatal by design: if the cmdlet is unavailable or the mode is refused, the lane is
      # no worse off than before, and the capture-size contract added alongside this now logs
      # a loud ERROR instead of silently emitting an uncomparable PNG. The achieved resolution
      # is echoed either way so the next run attributes a still-clamped capture immediately.
      - name: Widen virtual desktop to fit golden-sized captures
        continue-on-error: true
        shell: pwsh
        run: |
          $before = (Get-CimInstance -ClassName Win32_VideoController |
                     Select-Object -First 1 CurrentHorizontalResolution, CurrentVerticalResolution)
          Write-Host "desktop before: $($before.CurrentHorizontalResolution)x$($before.CurrentVerticalResolution)"
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            try {
              Set-DisplayResolution -Width 1920 -Height 1080 -Force
              Write-Host "Set-DisplayResolution 1920x1080 applied"
            } catch {
              Write-Host "Set-DisplayResolution refused: $($_.Exception.Message)"
            }
          } else {
            Write-Host "Set-DisplayResolution cmdlet unavailable on this image"
          }
          $after = (Get-CimInstance -ClassName Win32_VideoController |
                    Select-Object -First 1 CurrentHorizontalResolution, CurrentVerticalResolution)
          Write-Host "desktop after: $($after.CurrentHorizontalResolution)x$($after.CurrentVerticalResolution)"

      - name: Run bucket-C screenshot diff
        continue-on-error: true
        shell: bash
        env:
          SMATCHET_EXE: build/ninja-iter-msvc/Smatchet.exe
          TMPDIR: ${{ github.workspace }}/build/tmp
          SMATCHET_KEEP_SCREENSHOT_CAPTURES: "1"
          SMATCHET_LANE_STATUS_FILE: ${{ github.workspace }}/build/tmp/bucket-c-lane-status
          SMATCHET_GOLDEN_REPORT_FILE: ${{ github.workspace }}/build/tmp/bucket-c-golden-report.tsv
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "${TMPDIR}"
          bash scripts/dev/test-screenshot-diff.sh

      - name: Lane-integrity — bucket-C did not pass-nothing
        shell: bash
        env:
          SMATCHET_LANE_STATUS_FILE: ${{ github.workspace }}/build/tmp/bucket-c-lane-status
        run: |
          set -euo pipefail
          if [ ! -f "$SMATCHET_LANE_STATUS_FILE" ]; then
            echo "::error::lane-integrity — bucket-C wrote no lane-status sentinel; the driver never reached its summary (dead harness). Fail-closed." >&2
            exit 1
          fi
          status="$(sed -n 's/^status=\([a-z]*\).*/\1/p' "$SMATCHET_LANE_STATUS_FILE")"
          echo "bucket-C lane-status: $(cat "$SMATCHET_LANE_STATUS_FILE")"
          # Fail-closed: only an explicit ok|fail|broken is a valid sentinel.
          # Unknown/empty status means a corrupt or partial sentinel write
          # (itself a dead-harness symptom) — treat it as a broken lane, not OK.
          case "$status" in
            ok|fail|broken) ;;
            *)
              echo "::error::lane-integrity — bucket-C wrote an invalid/empty status sentinel: '$status'. Fail-closed." >&2
              exit 1
              ;;
          esac
          if [ "$status" = "broken" ]; then
            # Machine-readable broken-lane marker (bucket-lane-status-broken-sentinel-
            # auditable, PR-3) — see the bucket-E lane-integrity step for the rationale.
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf 'BROKEN-LANE: %s\n' "Bucket-C screenshot diff (Mesa headless GL)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::error::lane-integrity — bucket-C is BROKEN (Passed:0 Failed>0). Every scenario failed: dead harness, not a regression." >&2
            exit 1
          fi

      # Report the per-scenario verdicts the continue-on-error mask above would
      # otherwise DISCARD (tooling 2026-08-06 bucket-c-golden-mask-hides-stale-
      # goldens). The mask exists because llvmpipe captures are not authoritative
      # against per-developer GPU goldens — but a TOTAL mask makes a golden that
      # is stale for a deterministic reason (a deliberate UI change nobody
      # regenerated for) read exactly like a clean run, so goldens rot unseen
      # (seven stale ones, no signal ever). This step splits REPORTING from
      # BLOCKING: it surfaces every verdict + the golden's age in the job summary
      # so a stale golden is attributable on the PR that changed those pixels,
      # while never failing the job itself (`|| true` on every branch + always()).
      - name: Report bucket-C golden verdicts (advisory)
        if: always()
        # Belt-and-braces: the body already exits 0 on every branch, but the
        # no-blocking-power property should hold structurally, not only because
        # the shell logic is correct.
        continue-on-error: true
        shell: bash
        env:
          REPORT: ${{ github.workspace }}/build/tmp/bucket-c-golden-report.tsv
        run: |
          set -uo pipefail
          if [ ! -s "$REPORT" ]; then
            echo "bucket-C: no golden verdict report at $REPORT (driver never reached a scenario)."
            exit 0
          fi
          {
            echo "### Bucket-C golden verdicts (advisory — this lane cannot block)"
            echo ""
            echo "| scenario | verdict | L_inf | tol | golden date | age (days) |"
            echo "| --- | --- | ---: | ---: | --- | ---: |"
            while IFS=$'\t' read -r scen verdict linf tol mtime age; do
              [ -n "${scen:-}" ] || continue
              mark="$verdict"
              [ "$verdict" = "fail" ] && mark="**fail**"
              [ "$verdict" = "fail-dimension" ] && mark="**fail-dimension**"
              printf '| %s | %s | %s | %s | %s | %s |\n' \
                "$scen" "$mark" "${linf:--}" "${tol:--}" "${mtime:--}" "${age:--}"
            done < "$REPORT"
            echo ""
            echo "A \`fail\` row is EITHER a real pixel regression OR a stale golden — regenerate"
            echo "per docs/agent-rules/golden-image-approval.md, or fix the regression."
            echo ""
            echo "A \`fail-dimension\` row (L_inf \`-1\`) is NEITHER: the capture never reached the"
            echo "golden's geometry, so no pixels were compared. Regenerating goldens would only"
            echo "pin them to whatever size the runner happened to produce — fix the capture"
            echo "geometry instead (the scenario's requested size must be reachable on the"
            echo "runner desktop; the app logs the mismatch at ERROR). See #2092."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          echo "===== bucket-C golden verdicts ====="
          cat "$REPORT" || true
          echo "===== end bucket-C golden verdicts ====="
          exit 0

      - name: Upload bucket-C golden verdict report
        if: always()
        # Reporting must never gain blocking power: `if-no-files-found: ignore`
        # only covers an ABSENT file, so a genuine upload error (timeout, blob
        # storage 5xx) would still red this advisory lane after lane-integrity
        # already passed. continue-on-error keeps the artefact best-effort.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bucket-c-golden-report-${{ github.run_id }}
          path: build/tmp/bucket-c-golden-report.tsv
          if-no-files-found: ignore

      # Lane-integrity (NOT continue-on-error): assert the driver did not finish
      # Passed==0 && Failed>0. The diff step stays advisory for genuine per-
      # scenario REGRESSIONS, but "passed nothing" is a broken lane — this step
      # reads the sentinel the driver wrote and hard-fails OUTSIDE the
      # continue-on-error mask. A missing sentinel (driver never reached the
      # summary — itself a dead-harness symptom) also fails closed.
      # Observability — surface the spawned CHILD's stderr (the bucket-C scenario
      # runs via test-screenshot-diff.sh, which --spawns an ephemeral child whose
      # stdout/stderr CliCommandRunner redirects to %TMP%\Smatchet-spawn-*.log;
      # the bash TMPDIR override does NOT relocate it on Windows — the C++ reads
      # TMP/TEMP). Glob the runner TMP for the newest such log, cat it into the CI
      # log, and stage it for upload. Best-effort: always() + ignore-missing so a
      # green run or a no-log run never reds the job.
      - name: Surface bucket-C spawned-child log
        if: always()
        # Pure observability, and the Actions bash wrapper runs with -e (the body's
        # `set -uo pipefail` does not clear it), so a failing mkdir/cp/cat here
        # would red the advisory lane after lane-integrity already passed.
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${{ github.workspace }}/build/tmp/bucket-c-childlog"
          # Windows runner TMP candidates, in the order CliCommandRunner resolves.
          newest=""
          for d in "${TMP:-}" "${TEMP:-}" "/c/Windows/Temp" "${{ github.workspace }}/build/tmp"; do
            [ -n "$d" ] && [ -d "$d" ] || continue
            cand="$(ls -t "$d"/Smatchet-spawn-*.log 2>/dev/null | head -1 || true)"
            if [ -n "$cand" ]; then newest="$cand"; break; fi
          done
          if [ -n "$newest" ] && [ -f "$newest" ]; then
            cp "$newest" "${{ github.workspace }}/build/tmp/bucket-c-childlog/spawn-child.log"
            echo "===== bucket-C spawned-child log ($newest) ====="
            cat "$newest"
            echo "===== end bucket-C spawned-child log ====="
          else
            echo "bucket-C: no Smatchet-spawn-*.log found in runner TMP (nothing to surface)."
          fi

      - name: Upload captured PNGs (for golden bootstrap)
        if: always()
        # Same rule as the verdict-report upload: a pure-reporting step in this
        # advisory lane must not be able to red it on a transient upload error.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bucket-c-captures-${{ github.run_id }}
          path: |
            build/tmp/smatchet-screenshot-diff-*/*.png
          if-no-files-found: ignore

      - name: Upload bucket-C spawned-child log
        if: always()
        # Same rule as the verdict-report upload: a pure-reporting step in this
        # advisory lane must not be able to red it on a transient upload error.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bucket-c-childlog-${{ github.run_id }}
          path: build/tmp/bucket-c-childlog/spawn-child.log
          if-no-files-found: ignore

  bucket-e-ui-tests:
    name: Bucket-E UI tests (Mesa headless GL)
    needs: windows-msvc
    runs-on: windows-2022
    # 30 -> 45: build (~9.6m) + the retry-on-collapse test step (attempts=3, each
    # `timeout 240` under llvmpipe) can exceed 30m on a slow runner — on develop run
    # 28289436753 the ui_test.run step ran 20.1m on top of the ~9.6m build and hit
    # the 30-min cap (cancelled). 45m lets all 3 retry attempts complete on the
    # software-GL slow path; stays under the ~45-50 ceiling. Coverage unchanged.
    # No job-level continue-on-error (all-gates-blocking flip): infra steps
    # (checkout / build / Mesa install / lane-integrity) red the check for real.
    # The RUN step below keeps its step-level mask BY DESIGN — see its comment.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (ui-test)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-ui-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-ui-test-

      - name: Cache FetchContent _deps (ui-test preset)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-ui-test-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-ui-test-msvc
        run: cmake --preset ninja-ui-test-msvc

      - name: Build SmatchetStandalone (UI tests on)
        run: cmake --build --preset ninja-ui-test-msvc

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      # Cache + install the Mesa software-GL DLL trio beside the ui-test-msvc exe
      # (composite action; shares one cache key with bucket-C / Jira-fixture /
      # launch-smoke so all jobs reuse one cached DLL set across the repo).
      - name: Install Mesa software GL
        uses: ./.github/actions/install-mesa-gl
        with:
          target-dir: build/ninja-ui-test-msvc

      # Launch-smoke moved OUT into the dedicated, hard-fail `Bucket launch-smoke
      # (Mesa GL)` job (graduated 2026-06-18); the dead-harness boot check is its
      # own blocking check-run. The RUN step below keeps a step-level
      # continue-on-error BY DESIGN (a sanctioned survivor of the
      # all-gates-blocking flip, like bucket-C's golden diff): under llvmpipe the
      # ImGui-Test-Engine suite carries render-dependent per-test failures (a good
      # run is ~71/74) plus a stochastic first-frame collapse the retry loop
      # absorbs — per-test `status=fail` therefore informs, never gates, until the
      # Mesa-dependent tests are fixed/skipped. The BROKEN class (passed-nothing /
      # parse-miss / no sentinel) hard-fails via the unmasked lane-integrity step.

      - name: Run bucket-E ImGui Test Engine scenario
        id: run-bucket-e
        continue-on-error: true
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          SMATCHET_LANE_STATUS_FILE: ${{ github.workspace }}/build/tmp/bucket-e-lane-status
        working-directory: build/ninja-ui-test-msvc
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$SMATCHET_LANE_STATUS_FILE")"
          mkdir -p "${{ github.workspace }}/build/tmp/bucket-e-childlog"

          # Retry-on-collapse, fail-closed on persistent collapse.
          #
          # The headless Mesa lane is flaky, not dead: the same exe under the same
          # llvmpipe env intermittently collapses to Passed:0 Failed:73 (a first-
          # frame render race in the ImGui Test Engine path) on one run and passes
          # 71/74 minutes later. A single collapse red-walls every C++ PR. So we
          # retry a COLLAPSE (Passed==0 && Failed>0, OR a JSON-envelope parse-miss)
          # up to 3 attempts total, accepting the first attempt that actually boots
          # + runs (Passed>0). The #923 broken-lane teeth stay intact: 3 consecutive
          # collapses ⇒ status=broken ⇒ the non-advisory lane-integrity step below
          # fails-closed — a genuinely dead harness still reds the lane.
          #
          # Per attempt we OVERWRITE the staged child log, so the upload always
          # carries the LAST attempt's diagnostic (the one whose sentinel we keep).

          # Surface the spawned CHILD's per-test failure reasons. The --spawn parent
          # prints only the JSON pass/fail counts; the actual "Error <file>:<line>
          # '<assertion>'" lines from the ImGui Test Engine (io.ConfigLogToTTY=true
          # in UiTestScenario) go to the CHILD process's stdout/stderr, which
          # CliCommandRunner redirects to a temp file and announces as `[spawn] child
          # stdout/stderr -> <path>`. Pull that path out of the parent output, cat
          # the log into the CI log, and stage it for upload. Best-effort: never
          # fail the step on a missing log — the lane-integrity step owns the teeth.
          # The arrow glyph is unicode; match the stable literal "child stdout/stderr"
          # prefix and take the tail of the line.
          capture_childlog() {
            local out_text="$1" childlog
            childlog="$(printf '%s\n' "$out_text" | grep -a 'child stdout/stderr' | tail -1 | sed 's/.*child stdout\/stderr[^A-Za-z]*//' || true)"
            if [ -n "$childlog" ] && [ -f "$childlog" ]; then
              cp "$childlog" "${{ github.workspace }}/build/tmp/bucket-e-childlog/spawn-child.log"
              echo "===== bucket-E spawned-child log (per-test ImGui Test Engine failure reasons) ====="
              cat "$childlog"
              echo "===== end bucket-E spawned-child log ====="
            else
              echo "::warning::bucket-E: spawned-child log not found ('$childlog'); per-test failure reasons unavailable this attempt." >&2
            fi
          }

          attempts=3
          status=broken; passed=0; failed=1
          for attempt in $(seq 1 "$attempts"); do
            # frames=5400, not 3600. Without an explicit --timeout, --spawn
            # derives its wall-clock budget from the frame count:
            # ScenarioWaitMs (CliArgCoercion.cpp) computes ((frames/60)+30)*1000
            # ms, so 3600 bought 90 s — and the suite outgrew it. It reached 112
            # of 115 tests and then tripped the deadline mid-suite on six
            # consecutive attempts across two runs (PR #1937); develop cleared
            # 115 only by a hair, with its own attempt 1 collapsing. 5400 buys
            # 120 s, ~33% headroom. Since #1943, --timeout=<ms> overrides the
            # derived budget on the --spawn path too and is the direct dial if
            # this lane needs more wall-clock without inflating the suite's
            # frame allowance.
            # The outer `timeout` stays above the derived deadline so the
            # harness, not coreutils, reports the failure.
            echo "bucket-E: attempt ${attempt}/${attempts} — ui_test.run --all --frames=5400 --spawn --yes"
            set +e
            out="$(timeout 300 ./Smatchet.exe cmd ui_test.run --all --frames=5400 --spawn --yes 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$out"
            # Stage THIS attempt's child log (overwrites prior attempts; the last
            # attempt's diagnostic is the one uploaded).
            capture_childlog "$out"
            # Parse the ui_test.run JSON envelope's data.{passed,failed}. The advisory
            # exit code itself is unreliable (a zero-pass run can still return 0), so
            # the signal comes from the counts. A JSON-envelope MISS (no '{...}' in the
            # output, or absent data.passed/data.failed) exits non-zero so we can tell
            # a real "0 0" run apart from a parse miss — defaulting to 0 here would let
            # malformed output sail past the broken guard (Passed==0 && Failed>0 never
            # fires when both are 0-from-parse-miss).
            parsed="$(printf '%s' "$out" | python -c "import sys,json,re; t=sys.stdin.read(); m=re.search(r'\{.*\}',t,re.S); d=(json.loads(m.group(0)).get('data',{}) if m else {}); sys.exit(2) if ('passed' not in d or 'failed' not in d) else print(d['passed'], d['failed'])" 2>/dev/null || true)"
            if [ -z "$parsed" ]; then
              # Parse miss / malformed output / absent results — collapse, fail-closed.
              status=broken; passed=0; failed=1
            else
              # parsed is "<passed> <failed>" (single line); split on the space.
              passed="${parsed%% *}"; failed="${parsed##* }"
              status=ok
              if [ "$passed" = "0" ] && [ "$failed" != "0" ]; then status=broken
              elif [ "$failed" != "0" ]; then status=fail; fi
            fi
            # A COLLAPSE is the transient class: Passed==0 with failures, OR a parse
            # miss (both land on status=broken above). Anything that produced Passed>0
            # (status=ok|fail) booted + ran — accept it and stop retrying.
            if [ "$status" != "broken" ]; then
              echo "bucket-E: attempt ${attempt}/${attempts} accepted (status=${status} passed=${passed} failed=${failed})."
              break
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::bucket-E transient collapse on attempt ${attempt}/${attempts}, retrying"
            fi
          done

          # If every attempt collapsed, status is still 'broken' here (persistent →
          # genuine dead harness). A parse-miss on the FINAL attempt keeps status=broken
          # too — it never silently becomes ok.
          echo "::notice::bucket-E used ${attempt}/${attempts} attempt(s); final status=${status} (passed=${passed} failed=${failed})."
          printf 'status=%s passed=%s failed=%s\n' "$status" "$passed" "$failed" > "$SMATCHET_LANE_STATUS_FILE"
          echo "bucket-E lane-status: $(cat "$SMATCHET_LANE_STATUS_FILE")"
          # The step-level mask above absorbs this exit (per-test failures inform,
          # never gate — see the step comment); the unmasked lane-integrity step
          # below carries the blocking teeth for the broken class.
          exit "$rc"

      # Lane-integrity (NOT continue-on-error): bucket-E broken-lane teeth. Reads
      # the sentinel the run step wrote; hard-fails on broken (Passed:0 Failed>0)
      # or a missing sentinel (the run never produced counts — dead harness).
      - name: Lane-integrity — bucket-E did not pass-nothing
        shell: bash
        env:
          SMATCHET_LANE_STATUS_FILE: ${{ github.workspace }}/build/tmp/bucket-e-lane-status
        run: |
          set -euo pipefail
          if [ ! -f "$SMATCHET_LANE_STATUS_FILE" ]; then
            echo "::error::lane-integrity — bucket-E wrote no lane-status sentinel; the scenario produced no pass/fail counts (dead harness). Fail-closed." >&2
            exit 1
          fi
          status="$(sed -n 's/^status=\([a-z]*\).*/\1/p' "$SMATCHET_LANE_STATUS_FILE")"
          echo "bucket-E lane-status: $(cat "$SMATCHET_LANE_STATUS_FILE")"
          # Fail-closed: only an explicit ok|fail|broken is a valid sentinel.
          # Unknown/empty status means a corrupt or partial sentinel write
          # (itself a dead-harness symptom) — treat it as a broken lane, not OK.
          case "$status" in
            ok|fail|broken) ;;
            *)
              echo "::error::lane-integrity — bucket-E wrote an invalid/empty status sentinel: '$status'. Fail-closed." >&2
              exit 1
              ;;
          esac
          if [ "$status" = "broken" ]; then
            # Machine-readable broken-lane marker (bucket-lane-status-broken-sentinel-
            # auditable, PR-3): surface the broken verdict beyond the log annotation so
            # the audit layer (postmortem-owed.sh broken_lanes registry) can classify a
            # RED-because-BROKEN lane as an auditable WARN, not an owed gate-escape.
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf 'BROKEN-LANE: %s\n' "Bucket-E UI tests (Mesa headless GL)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::error::lane-integrity — bucket-E is BROKEN (Passed:0 Failed>0). Every UI test failed: dead harness, not a regression." >&2
            exit 1
          fi

      - name: Upload bucket-E exe on failure
        if: ${{ steps.run-bucket-e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bucket-e-exe-${{ github.run_id }}
          path: build/ninja-ui-test-msvc/Smatchet.exe
          if-no-files-found: ignore

      # Upload the spawned-child log (per-test ImGui Test Engine failure reasons)
      # staged by the run step. Runs always() so the log survives even when the
      # run step is masked by continue-on-error or the lane-integrity step fails
      # the job — the whole point is post-mortem visibility on a broken lane.
      - name: Upload bucket-E spawned-child log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bucket-e-childlog-${{ github.run_id }}
          path: build/tmp/bucket-e-childlog/spawn-child.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Dedicated, HARD-FAIL deterministic-backend fixture gate.
  # ---------------------------------------------------------------------------
  # The `bucket-e-ui-tests` job above masks only its RUN step (per-test Mesa
  # render-dependent failures inform, never gate — see its comment). The
  # deterministic Jira backend fixture path
  # (tests/ui/jira_deterministic_backend.test.cpp, driven by
  # scripts/dev/test-ui-jira-deterministic-backend.sh) needs stronger teeth:
  # a regression in the fixture-backed sync/grid path is a real product
  # break, not a render flake. So it lives in its own job with NO
  # continue-on-error anywhere — its check-run conclusion blocks merge.
  #
  # Modeled on bucket-launch-smoke-mesa-gl (the dedicated hard gate decoupled
  # from the flaky advisory bucket jobs). Builds the ninja-ui-test-msvc exe (the
  # smatchet-exe artefact windows-msvc uploads is built WITHOUT
  # SMATCHET_BUILD_UI_TESTS, so it cannot be reused here) and installs the Mesa
  # software-GL DLL set. A single retry absorbs the known Mesa first-frame
  # collapse; a persistent failure reds the job (and thus the merge gate).
  bucket-e-jira-fixture-mesa-gl:
    name: Bucket-E Jira fixture-backend (Mesa GL, hard)
    needs: windows-msvc
    runs-on: windows-2022
    # 30 -> 45: this REQUIRED job builds (~9.5m) then runs the fixture-backend test
    # step (attempts=2) under llvmpipe. On develop run 28289436753 the test step ran
    # 20.4m on top of the ~9.5m build and GitHub cancelled the job AT the 30-min cap
    # (conclusion=cancelled) — a repo-wide false-red on a merge-blocking gate. 45m
    # gives the build + both retry attempts room on the software-GL slow path while
    # staying under the ~45-50 pipeline ceiling. No gate weakened; coverage unchanged.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (jira-fixture ui-test)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-ui-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-ui-test-

      - name: Cache FetchContent _deps (ui-test preset)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-ui-test-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-ui-test-msvc
        run: cmake --preset ninja-ui-test-msvc

      - name: Build SmatchetStandalone (UI tests on)
        run: cmake --build --preset ninja-ui-test-msvc

      # Cache + install the Mesa software-GL DLL trio beside the ui-test-msvc exe
      # for the deterministic Jira fixture-backend bucket-E lane (composite action).
      - name: Install Mesa software GL
        uses: ./.github/actions/install-mesa-gl
        with:
          target-dir: build/ninja-ui-test-msvc

      # The HARD gate. NO continue-on-error: a persistent fixture-backend failure
      # reds this job's check-run and blocks merge. SMATCHET_TEST_JIRA_BACKEND_FIXTURE
      # is exported here (the driver also defaults it, but the explicit export is the
      # deliverable's contract). --outLog captures every test's verbose log; on
      # failure we cat it into the CI log for diagnosis. A single retry absorbs the
      # known Mesa first-frame collapse without masking a real regression.
      - name: Run deterministic Jira fixture-backend bucket-E (hard)
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          SMATCHET_EXE: build/ninja-ui-test-msvc/Smatchet.exe
          SMATCHET_TEST_JIRA_BACKEND_FIXTURE: tests/fixtures/jira_backend/basic-grid.json
          SMATCHET_UI_TEST_OUTLOG: ${{ github.workspace }}/build/tmp/jira-fixture-outlog.txt
        run: |
          set -uo pipefail
          mkdir -p "${{ github.workspace }}/build/tmp"
          attempts=2
          rc=1
          for attempt in $(seq 1 "$attempts"); do
            echo "jira-fixture: attempt ${attempt}/${attempts}"
            set +e
            bash scripts/dev/test-ui-jira-deterministic-backend.sh
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "jira-fixture: attempt ${attempt}/${attempts} PASSED."
              break
            fi
            # exit 2 = binary missing / build OFF — a hard config error, never retried.
            if [ "$rc" -eq 2 ]; then
              echo "::error::jira-fixture: exit 2 (binary missing or SMATCHET_BUILD_UI_TESTS=OFF) — config error, not a flake." >&2
              break
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::jira-fixture: attempt ${attempt}/${attempts} failed (rc=$rc), retrying (Mesa first-frame flake absorber)."
            fi
          done
          if [ "$rc" -ne 0 ]; then
            if [ -f "$SMATCHET_UI_TEST_OUTLOG" ]; then
              echo "===== deterministic Jira fixture-backend per-test log ====="
              cat "$SMATCHET_UI_TEST_OUTLOG"
              echo "===== end per-test log ====="
            else
              echo "::warning::jira-fixture: per-test outLog not found at $SMATCHET_UI_TEST_OUTLOG"
            fi
            echo "::error::jira-fixture: deterministic Jira backend bucket-E FAILED after ${attempts} attempt(s). This is a fixture-backend regression, not a render flake." >&2
            exit "$rc"
          fi

      - name: Upload jira-fixture per-test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jira-fixture-outlog-${{ github.run_id }}
          path: build/tmp/jira-fixture-outlog.txt
          if-no-files-found: ignore

  mobile-texture-guard-smoke:
    name: Mobile texture-guard smoke (Mesa headless GL, advisory)
    # Issue #1133 — ADVISORY headless gate for the #1122 dynamic-texture crash class.
    # NOT blocking (the "advisory" name is the merge-gate poller's sanctioned
    # non-gating escape): the all-gates-blocking flip tried to graduate this lane
    # but the first blocking runs proved it is NOT reliably green — the
    # `mobile-texture-guard --spawn` child HANGS under llvmpipe (rc=124 at the inner
    # `timeout 240`, every attempt) on a large fraction of runs (~3/13 green in the
    # pre-flip window; RED on the #1619 + #1620 heads + the first develop push). The
    # hang is a real product/harness deadlock in the forced-fault render path under
    # software GL, not a CI flake a retry can wash out — deep C++ debugging, tracked
    # for a fix + re-graduation in
    # docs/self-improvement/categories/infra/2026-07-05-texture-guard-llvmpipe-spawn-hang.md.
    # Until then it runs advisory (step-level continue-on-error + advisory name) so a
    # hang informs without wedging develop. Builds the standalone exe with
    # SMATCHET_ENABLE_TEXTURE_FAULT_INJECTION=ON (ninja-ui-test-msvc) and drives the
    # scenario (3 forced fault states: atlas-grow orphan, EGL-context-loss re-arm,
    # rearm-disabled negative control) asserting no SIGABRT + a rendered frame after
    # each + the GuardImGuiDynamicTextures recovery log. Re-graduate (drop the mask +
    # ", advisory") once the hang is fixed and the lane is green N consecutive runs.
    needs: windows-msvc
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (texture-guard)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-ui-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-ui-test-

      - name: Cache FetchContent _deps (ui-test preset)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-ui-test-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-ui-test-msvc (texture-fault-injection ON)
        run: cmake --preset ninja-ui-test-msvc

      - name: Build SmatchetStandalone (texture-fault-injection on)
        run: cmake --build --preset ninja-ui-test-msvc --target SmatchetStandalone

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      # Cache + install the Mesa software-GL DLL trio beside the ui-test-msvc exe
      # for the mobile-texture-guard lane (composite action — shares one cache key
      # so all Mesa jobs reuse one cached DLL set across the repo).
      - name: Install Mesa software GL
        uses: ./.github/actions/install-mesa-gl
        with:
          target-dir: build/ninja-ui-test-msvc

      # Launch-smoke moved OUT into the dedicated, hard-fail `Bucket launch-smoke
      # (Mesa GL)` job (graduated 2026-06-18). That job blocks on the iter-msvc
      # artefact exe booting under Mesa GL — the same dead-harness class. The #1122
      # texture-fault scenario below is BLOCKING (all-gates-blocking flip): it is a
      # deterministic forced-fault-injection scenario (not a golden diff), its
      # script hard-asserts both the dead-harness sentinel (`passed==0 && failed>0`)
      # and `ok` (all 3 forced-fault sub-steps), and the lane has been green — a red
      # is a real texture-guard regression.

      - name: Run mobile-texture-guard scenario
        id: run-texture-guard
        shell: bash
        # ADVISORY (step-level continue-on-error): the lane hangs under llvmpipe on
        # a large fraction of runs (see the job header) — a hang informs, never
        # gates, until the deadlock is fixed and the lane re-graduates to blocking.
        continue-on-error: true
        # Inner `timeout 300` (below) bounds a hung child; the 5-min step cap is the
        # backstop. The mask makes both non-gating on this advisory lane.
        timeout-minutes: 6
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        working-directory: build/ninja-ui-test-msvc
        run: |
          set -uo pipefail
          # --spawn launches a hidden ephemeral instance, runs the scenario in its live
          # render loop, waits for the result JSON, quits the child, and emits the result
          # envelope to stdout. (The bare in-process form does NOT auto-terminate.) A SIGABRT
          # in the forced-fault render path kills the child -> --spawn times out -> nonzero.
          # `timeout 300` bounds the known llvmpipe hang so the step ends deterministically
          # (advisory — the outcome does not gate).
          out="$(timeout 300 ./Smatchet.exe scenario.run --name=mobile-texture-guard --frames=8 --spawn --yes 2>&1)"
          echo "$out"
          # Honest pass/fail: the scenario's OnFinish JSON carries passed/failed/ok. A dead
          # harness (no faults logged) reports passed:0 -> hard-fail (the bucket-lane guard).
          # `python` parses the envelope's data.ok; the launch-smoke above already proved the
          # exe starts, so a parse failure here is a real scenario regression, not a dead exe.
          echo "$out" | python -c "import sys,json,re
          raw=sys.stdin.read()
          m=re.search(r'\{.*\}', raw, re.S)
          assert m, 'no JSON envelope in scenario output'
          env=json.loads(m.group(0))
          data=env.get('data', env)
          passed=data.get('passed', 0); failed=data.get('failed', 0); ok=data.get('ok', False)
          print('[texture-guard] passed=%s failed=%s ok=%s' % (passed, failed, ok))
          assert not (passed == 0 and failed > 0), 'dead-harness: passed==0 && failed>0'
          assert ok, 'mobile-texture-guard scenario did not pass all 3 forced-fault sub-steps'"

      - name: Upload texture-guard exe on failure
        # Keys on the STEP outcome, not job status: the scenario step is masked
        # (continue-on-error) so a hang/fail leaves the job green — `always() &&
        # outcome == 'failure'` still captures the exe for the hang investigation.
        if: ${{ always() && steps.run-texture-guard.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-texture-guard-exe-${{ github.run_id }}
          path: build/ninja-ui-test-msvc/Smatchet.exe
          if-no-files-found: ignore

  # Dedicated, HARD-FAIL launch-smoke for the Mesa-software-GL bucket exe.
  # ---------------------------------------------------------------------------
  # This is the graduated, BLOCKING form of the dead-harness smoke that used to
  # live as an advisory STEP inside the continue-on-error bucket-C / bucket-E /
  # mobile-texture-guard jobs (infra.md `bucket-mesa-exe-boot` P1). It exists as
  # its OWN job — with a stable check-run name — so the merge-gate can block on
  # "the provisioned exe cannot boot under Mesa GL" WITHOUT re-coupling to the
  # render-dependent screenshot-diff / per-test UI runs those bucket jobs also
  # carry. Post-flip, the bucket jobs block too (block-on-any-red); only their
  # golden-diff / per-test RUN steps stay masked (see each job's comment) —
  # THIS job remains the dedicated dead-harness gate.
  #
  # Graduated 2026-06-18 after #1370 fixed the `--spawn` teardown exit-code bug:
  # the launch-smoke step has been reliably `success` across the last 6 runs, so
  # the WARN-first advisory calibration (2026-06-15) is over. NO continue-on-error
  # anywhere in this job — its check-run conclusion IS the launch-smoke verdict.
  #
  # Mirrors the bucket-C provisioning path: download the same `Smatchet.exe`
  # artefact windows-msvc uploads, install the 3-DLL Mesa software-GL set beside
  # it, then boot it once via the unified CLI. The Mesa cache+install pair is
  # copied verbatim from bucket-C/E/texture-guard (the composite-action dedup is
  # a separate tracked debt entry: `Mesa software-GL install block duplicated`).
  bucket-launch-smoke-mesa-gl:
    name: Bucket launch-smoke (Mesa GL)
    needs: windows-msvc
    runs-on: windows-2022
    # 15 -> 25: this REQUIRED gate downloads the prebuilt exe (setup ~0.3m) then boots
    # it under llvmpipe. On develop run 28289436753 the boot step alone ran 14.8m and
    # GitHub cancelled the job AT the 15-min cap (conclusion=cancelled), red-walling a
    # merge-blocking gate repo-wide. A healthy boot is <1m; 25m gives generous headroom
    # for a slow software-GL boot without nearing the ~45-50 ceiling. Coverage unchanged.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # runs a PR-built binary; no git creds needed (artipacked / CodeRabbit #1375)

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Download Smatchet.exe artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smatchet-exe-${{ github.run_id }}
          path: build/ninja-iter-msvc/

      # Cache + install the Mesa software-GL DLL trio beside the iter-msvc exe for
      # the launch-smoke gate (composite action — same cache key as bucket-C/E/
      # texture-guard so all jobs share one cached DLL set).
      - name: Install Mesa software GL
        uses: ./.github/actions/install-mesa-gl
        with:
          target-dir: build/ninja-iter-msvc

      # The blocking smoke. NO continue-on-error: a launch failure REDS this job,
      # and the `Bucket launch-smoke (Mesa GL)` check-run conclusion reflects it.
      # `--spawn` boots the full GUI+MCP under Mesa GL; SMATCHET_SPAWN_READY_MS
      # (30 s) is the app's ready window and the outer `timeout 45` is a hang-guard
      # a margin above it. The teardown false-red guard (folded in from bucket-E /
      # texture-guard) tolerates the historical case where app.version returns
      # ok:true but the spawn wrapper exits nonzero on teardown — now fixed by
      # #1370, but kept as defence-in-depth so a teardown regression does not red
      # this blocking gate on an otherwise-healthy boot.
      - name: Launch-smoke — provisioned exe must boot (Mesa GL)
        shell: bash
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          SMATCHET_SPAWN_READY_MS: "30000"
        run: |
          set -euo pipefail
          EXE=build/ninja-iter-msvc/Smatchet.exe
          echo "launch-smoke: $EXE cmd app.version --spawn --yes (ready<=30s, hang-guard 45s)"
          set +e
          out="$(timeout 45 "$EXE" cmd app.version --spawn --yes 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            if printf '%s\n' "$out" | grep -Eq '^\{.*"command"[[:space:]]*:[[:space:]]*"app\.version".*"ok"[[:space:]]*:[[:space:]]*true.*\}$'; then
              echo "::warning::launch-smoke saw app.version ok:true but the spawn wrapper exited $rc; treating as teardown false-red (defence-in-depth; #1370 fixed the root cause)."
            else
              echo "::error::launch-smoke FAILED — $EXE could not boot+become-reachable under Mesa GL within the spawn-ready window." >&2
              echo "  This is the dead-harness class (thin opengl32.dll loader / missing GL dep), NOT a flaky test." >&2
              exit "$rc"
            fi
          fi
          echo "launch-smoke: OK — exe booted."

  sanitizer-asan:
    name: Sanitizer (ASAN via MSVC)
    # Core-delta gate (docs/plans/ci-build-time-reduction.md Q5): run
    # pre-merge ONLY when Source/Core|Plugins C++ changed (the `changes` job's
    # source_core_cpp output). Standalone-only / docs / yaml PRs skip it here;
    # sanitizer-nightly (cron) still covers them. asan builds Debug — uncacheable
    # by sccache — so skipping it on non-Core PRs is the only real per-PR lever.
    # `needs: changes` so the output is available; still after windows-msvc to
    # avoid spending a runner when the main build is already broken.
    needs: [changes, windows-msvc]
    if: ${{ needs.changes.outputs.source_core_cpp == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (msvc-asan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-msvc-asan-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-msvc-asan-

      - name: Cache FetchContent _deps (msvc-asan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-asan-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # The ninja-msvc-asan preset now sets SMATCHET_BUILD_TESTS=ON +
      # SMATCHET_SANITIZE_TESTS=ON by default, so the SmatchetTests doctest rig is
      # built AND instrumented with /fsanitize=address (closing the Pillar-3
      # blind-spot: infra asan-doctest-rig-not-instrumented). /RTC1 is stripped
      # tree-wide by smatchet_strip_msvc_rtc_for_asan() (it is mutually exclusive
      # with ASan and SIGABRTs the exception-unwind path otherwise).
      - name: Configure ninja-msvc-asan
        run: cmake --preset ninja-msvc-asan -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_LUA_AUTOMATION=OFF

      - name: Build (ASAN via MSVC)
        run: cmake --build --preset ninja-msvc-asan

      # Escape hatch: a PR carrying the `sanitizer-out-of-band` label downgrades a
      # non-clean ASan run from blocking to a ::warning:: — a merge-time valve for a
      # KNOWN flake while the recovery follow-up is queued (label off post-merge, same
      # discipline as tests-out-of-band). Once this check is branch-protection REQUIRED
      # (Slice C), a merge-gates label can no longer waive a red run, so the valve must
      # live in the workflow. On push/merge_group there is no PR -> PR_LABELS is empty
      # -> oob=0 -> the check blocks normally.
      - name: Resolve sanitizer-out-of-band label
        id: oob
        shell: bash
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          oob=0
          if printf '%s' "$PR_LABELS" | grep -q '"sanitizer-out-of-band"'; then oob=1; fi
          echo "oob=$oob" >> "$GITHUB_OUTPUT"

      # ctest here runs the cmake-only android-openssl fail-fast probes. The full
      # smatchet_tests doctest rig is EXCLUDED (`-E '^smatchet_tests$'`): the next step
      # (`Run sanitized doctest rig`) runs that same exe directly and IS the genuine
      # instrumented ASan surface. The android probes keep ctest non-empty.
      # abort_on_error=0 so a stray abort() surfaces with a stack, not an opaque SIGABRT.
      - name: Run ctest under ASAN
        id: ctest_asan
        continue-on-error: ${{ steps.oob.outputs.oob == '1' }}
        working-directory: build/ninja-msvc-asan
        env:
          ASAN_OPTIONS: abort_on_error=0
        run: ctest --output-on-failure -E '^smatchet_tests$'

      # Sanitized doctest rig — the genuine ASan surface across the whole unit-test
      # tree (~15k assertions), run with NO test-case exclusions. The previously
      # excluded "CallstackParser::ParseCallstackText survives adversarial inputs"
      # case is now fully ASan-clean: the INT_MAX-clamp subcase no longer relies on
      # std::stoi's Debug-CRT overflow behaviour (range-checked via std::stoll in
      # CallstackParser.cpp), and the ReDoS-timing subcase widens its budget under
      # __SANITIZE_ADDRESS__ (#1215). A real heap-use-after-free / leak / overflow in
      # any covered TU now reds this step (it could not before — the rig compiled
      # uninstrumented).
      - name: Run sanitized doctest rig (ASan)
        id: rig_asan
        continue-on-error: ${{ steps.oob.outputs.oob == '1' }}
        shell: bash
        working-directory: build/ninja-msvc-asan
        env:
          ASAN_OPTIONS: abort_on_error=0
        run: |
          ./tests/SmatchetTests.exe

      - name: Warn on downgraded ASan failure
        if: ${{ (steps.ctest_asan.outcome == 'failure' || steps.rig_asan.outcome == 'failure') && steps.oob.outputs.oob == '1' }}
        shell: bash
        run: echo "::warning::Sanitizer (ASAN via MSVC) failed but the sanitizer-out-of-band label downgraded it to a warning. Remove the label and fix the finding post-merge."

      - name: Surface sanitized-rig ASan report
        if: failure()
        shell: bash
        run: |
          echo "## Sanitized doctest rig (MSVC ASan)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/ninja-msvc-asan/Testing/Temporary/LastTest.log ]; then
            grep -A 30 'ERROR: AddressSanitizer' \
              build/ninja-msvc-asan/Testing/Temporary/LastTest.log \
              | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      - name: Surface sanitizer report in job summary
        if: failure()
        shell: bash
        run: |
          echo "## ASAN failure (MSVC)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/ninja-msvc-asan/Testing/Temporary/LastTest.log ]; then
            grep -A 30 'ERROR: AddressSanitizer' \
              build/ninja-msvc-asan/Testing/Temporary/LastTest.log \
              | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  sanitizer-ubsan-pr:
    name: Sanitizer (UBSan via Clang)
    # Per-PR UBSan using ninja-clang-asan (Clang -fsanitize=address,undefined).
    # MSVC has no UBSan; clang-cl (present on windows-2022) delivers both ASan
    # and UBSan via Sanitizers.cmake's "asan" branch for Clang.
    # docs/plans/active/build-quality-velocity-hardening.md #11.
    #
    # Core-delta gate: mirrors sanitizer-asan — skip on Standalone-only / docs /
    # yaml PRs (source_core_cpp=false); sanitizer-nightly still covers those paths
    # nightly. Promoted to a REQUIRED branch-protection check in Slice C (it gates
    # every Core PR); the ubsan-out-of-band label is its in-workflow escape.
    needs: [changes, windows-msvc]
    if: ${{ needs.changes.outputs.source_core_cpp == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Put LLVM (clang-cl) on PATH
        shell: bash
        run: |
          # windows-2022 ships LLVM at C:\Program Files\LLVM; ensure clang-cl is
          # reachable for the ninja-clang-asan preset. Mirrors sanitizer-nightly.yml.
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"

      - name: Verify clang-cl
        shell: bash
        run: clang-cl --version

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (clang-ubsan-pr)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-clang-ubsan-pr-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-clang-ubsan-pr-

      - name: Cache FetchContent _deps (clang-ubsan-pr)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-clang-ubsan-pr-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # Configure with Whisper + LuaAutomation off — fast/portable subset matching
      # the ASAN per-PR job. Add SMATCHET_BUILD_TESTS so ctest actually exercises
      # code under the sanitizer (not just a "no tests" green). UBSan halt-on-error
      # is not a separate flag here — Clang's -fno-sanitize-recover=all (set by
      # Sanitizers.cmake for the non-MSVC Clang path) already terminates on the
      # first UB violation rather than continuing, which is the correct behaviour
      # for a CI gate: a UB finding must fail the job, not be logged and ignored.
      - name: Configure ninja-clang-asan (ASan+UBSan, tests on)
        run: cmake --preset ninja-clang-asan -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_LUA_AUTOMATION=OFF -DSMATCHET_BUILD_TESTS=ON

      - name: Build (Clang ASan+UBSan)
        run: cmake --build --preset ninja-clang-asan --target SmatchetStandalone SmatchetTests

      # Escape hatch (mirrors sanitizer-asan): the `ubsan-out-of-band` label downgrades
      # a non-clean ASan/UBSan run to a ::warning::. Required-check valve for a KNOWN
      # flake (label off post-merge). No PR on push/merge_group -> oob=0 -> blocks.
      - name: Resolve ubsan-out-of-band label
        id: oob
        shell: bash
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          oob=0
          if printf '%s' "$PR_LABELS" | grep -q '"ubsan-out-of-band"'; then oob=1; fi
          echo "oob=$oob" >> "$GITHUB_OUTPUT"

      - name: Run ctest under ASan+UBSan
        id: ctest_ubsan
        continue-on-error: ${{ steps.oob.outputs.oob == '1' }}
        working-directory: build/ninja-clang-asan
        run: ctest --output-on-failure

      - name: Warn on downgraded UBSan failure
        if: ${{ steps.ctest_ubsan.outcome == 'failure' && steps.oob.outputs.oob == '1' }}
        shell: bash
        run: echo "::warning::Sanitizer (UBSan via Clang) failed but the ubsan-out-of-band label downgraded it to a warning. Remove the label and fix the finding post-merge."

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      - name: Surface sanitizer report in job summary
        if: failure()
        shell: bash
        run: |
          echo "## UBSan failure (Clang, per-PR)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          log=build/ninja-clang-asan/Testing/Temporary/LastTest.log
          if [ -f "$log" ]; then
            grep -A 30 -E 'ERROR: AddressSanitizer|runtime error:|UndefinedBehaviorSanitizer' "$log" \
              | head -120 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  packaging-graph-smoke:
    name: Packaging graph smoke (SmatchetPackageUnrealLibs_DX12)
    # CI smoke for the SmatchetPackageUnrealLibs_DX12 packaging graph
    # (docs/plans/active/build-quality-velocity-hardening.md #25).
    # The packaging target is EXCLUDE_FROM_ALL and is never exercised by the
    # normal per-PR build — it can silently diverge from a valid build graph.
    # This job configures ninja-iter-unreal-msvc (which sets
    # SMATCHET_UNREAL_THIRDPARTY_DIR) and then does a Ninja dry-run
    # (cmake --build -- -n) to validate the dependency graph WITHOUT compiling
    # the full set of static libraries (which would be ~15+ min, too heavy for
    # per-PR). A dry-run resolves all targets + dependency edges; a broken graph
    # (missing target, wrong dep) fails here. Actual library output is NOT
    # produced — this is a graph-resolution smoke only.
    #
    # NOT a required branch-protection check (branch-protection changes are
    # out-of-scope); it runs as a non-required advisory PR check.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.android_only != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (packaging-smoke)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-packaging-smoke-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-packaging-smoke-

      - name: Cache FetchContent _deps (packaging-smoke)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-packaging-smoke-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # Configure with the Unreal-iteration preset. SMATCHET_UNREAL_THIRDPARTY_DIR
      # is already baked into the preset (pointing to the plugin ThirdParty dir);
      # the dir does not need to exist for configure to succeed — the packaging
      # target's file-copy COMMANDs are generator expressions evaluated at build
      # time. Whisper off (not relevant to the DX12 packaging target; skips a
      # large FetchContent download).
      - name: Configure ninja-iter-unreal-msvc
        run: cmake --preset ninja-iter-unreal-msvc -DSMATCHET_WITH_WHISPER=OFF

      # Ninja dry-run (-n): Ninja resolves the full build graph for
      # SmatchetPackageUnrealLibs_DX12 (all transitive deps: SmatchetCore_DX12,
      # SmatchetImGuiHost_DX12, ImGuiLib_DX12, cpr, SQLiteCpp, etc.) and prints
      # the commands it WOULD execute — but does not run any compiler. A missing
      # target, a broken dependency edge, or a bad generator expression causes
      # Ninja to exit non-zero, failing this job. This is the "graph resolves"
      # invariant we care about per-PR.
      #
      # Limitation: a dry-run validates the build graph but does NOT verify that
      # the compiled output links correctly or that the packaged .lib files are
      # byte-valid. A full packaging build (SmatchetCore_DX12 + all deps) would
      # provide that guarantee but takes ~15+ min and would double CI cost per PR.
      # The nightly sanitizer run and the publish preset provide the deeper gate
      # on develop-post-merge; this per-PR smoke closes the "graph silently broken"
      # gap at low cost.
      - name: Validate packaging graph (Ninja dry-run)
        shell: bash
        run: cmake --build --preset ninja-iter-unreal-msvc -- -n 2>&1 | head -200

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  high-integrity-baseline-drift:
    name: High-integrity baseline (develop drift)
    # develop post-merge only: regenerate the grandfathered baseline and fail if
    # the committed snapshot diverged. CI stays read-only against develop — it
    # never auto-commits; the remediation is for a contributor to refresh + commit.
    # See docs/plans/shipped/high-integrity-cpp-enforcement.md § CI baseline-refresh policy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh baseline + assert no drift
        shell: bash
        run: |
          bash agents/scripts/project/test-lint-rules.sh --catalog --refresh
          if ! git diff --exit-code docs/high-integrity/baseline.md; then
            echo "::error::baseline stale — run 'bash agents/scripts/project/test-lint-rules.sh --catalog --refresh' locally and commit"
            exit 1
          fi
          echo "high-integrity baseline in sync"

  high-integrity-narrowing:
    name: High-integrity narrowing (clang)
    # develop post-merge only: cppcoreguidelines-narrowing-conversions needs a
    # *clang* compile-DB with the PCH disabled — clang-tidy can't load the project
    # PCH (cmake_pch.cxx.pch) and clang-cl targets the MSVC ABI, so this is
    # Windows-only. Mirrors high-integrity-baseline-drift: develop-push gated,
    # read-only, fails forward post-merge rather than blocking every PR on a clang
    # configure. See docs/plans/shipped/high-integrity-cpp-enforcement.md § Deviations.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure ninja-iter-clang (PCH-free, compile-DB only)
        # No build: clang-tidy parses each strict TU straight from compile_commands.json.
        # PCH disabled so there is no unbuilt cmake_pch.cxx.pch to load. Whisper off
        # (not in the strict zone; skips a large FetchContent pull).
        run: cmake --preset ninja-iter-clang -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DSMATCHET_WITH_WHISPER=OFF

      - name: Verify clang toolchain + compile-DB present
        # Fail CLOSED: a missing clang-tidy / db would make scan_narrowing warn-skip
        # and the gate would pass without checking anything (silent false-clean).
        shell: bash
        run: |
          command -v clang-tidy >/dev/null 2>&1 || { echo "::error::clang-tidy not on PATH"; exit 1; }
          test -f build/ninja-iter-clang/compile_commands.json || { echo "::error::clang compile_commands.json missing"; exit 1; }

      - name: Enforce zero first-party strict-zone narrowing
        # --catalog (not --full): runs the per-TU clang-tidy sweep ONCE. --full
        # computes the triple set twice (display + count) — a needless second
        # serial clang-tidy pass over the whole strict zone.
        shell: bash
        run: |
          set -uo pipefail
          out="$(SMATCHET_LINT_NARROWING=1 bash agents/scripts/project/test-lint-rules.sh --catalog)"
          printf '%s\n' "$out"
          n="$(printf '%s\n' "$out" | grep -oE 'narrowing-conversions \([0-9]+ entries\)' | grep -oE '[0-9]+' | head -1 || true)"
          if [ "${n:-1}" != "0" ]; then
            echo "::error::first-party strict-zone narrowing-conversions found (${n:-unknown}) — fix the cast (static_cast<std::ptrdiff_t> / std::next); do not grandfather:"
            printf '%s\n' "$out" | sed -n '/narrowing-conversions (/,/^## /p'
            exit 1
          fi
          echo "strict-zone narrowing-conversions: clean (0 first-party)"

  # ===========================================================================
  # Phase-0 mobile triple-target spike (docs/plans/mobile-app-jql-mvp.md)
  # ---------------------------------------------------------------------------
  # Both jobs below are ADVISORY — NOT on the develop merge-gate required-check
  # list (only "Windows + MSVC" and "Windows + MSVC light" are required) and NOT
  # on the merge-gate poller's meant-to-block allow-list (Coverage/Sanitizer/
  # Bucket-). A red here surfaces a mobile-port regression without wedging the
  # ship-line. They gate on `changes.code` so docs-only PRs skip them.
  # ===========================================================================

  mobile-posix-core-check:
    name: Mobile — POSIX core compile gate (Linux clang)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.android_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang + X11/GL dev headers (glfw configure-time deps)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # clang/lld: the host Linux toolchain (Slice 0b — this is the #else side
          # of every platform #ifdef). xorg-dev + libgl1-mesa-dev: GLFW 3.3.8's
          # add_subdirectory runs find_package(X11 REQUIRED) at CONFIGURE time and
          # FATALs without them (3.3.8 predates GLFW_BUILD_X11=OFF, added in 3.4).
          # glfw IS fetched on Linux (its guard is `NOT ANDROID AND NOT IOS`) but is
          # never BUILT: the build step targets only SmatchetCore_PosixCheck + its
          # non-glfw deps (cpr/sqlite/md4c), none of which pull glfw.
          sudo apt-get install -y clang lld xorg-dev libgl1-mesa-dev

      - name: Cache FetchContent _deps (posix-core-check)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-posixcheck-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure posix-core-check
        # SMATCHET_BUILD_POSIX_CORE_CHECK=ON (via the preset) declares the
        # SmatchetCore_PosixCheck STATIC EXCLUDE_FROM_ALL lib over CORE_SOURCES.
        # cpr auto-detects the host's system OpenSSL here (no NDK cross-TLS yet).
        # SMATCHET_BUILD_TESTS=ON additionally declares SmatchetCommandsTests (the
        # Tier-3 builtin-command dispatch harness), which LINKS the archive — the
        # only lane where the full core links on Linux. It does NOT build the
        # SmatchetTests rig (only the explicitly named targets below are built).
        run: cmake --preset posix-core-check -DSMATCHET_BUILD_TESTS=ON

      - name: Compile CORE_SOURCES (host Linux clang, compile-only)
        # A static archive only compiles its objects; it never links, so there is
        # zero GLFW/GL/X11 link surface. Green == every #else branch in the
        # engine-agnostic core compiles under a non-_WIN32 clang.
        # `-- -k 0` (ninja keep-going) surfaces EVERY failing TU in one run instead
        # of stopping at the first — so a fresh portability sweep enumerates all
        # LP64/#else errors at once rather than one CI round-trip per fix.
        run: cmake --build --preset posix-core-check --target SmatchetCore_PosixCheck -- -k 0

      - name: Build + run the builtin-command dispatch harness
        # commands-invocation-harness.md Slice 1 — links the archive just built,
        # constructs a headless AppController, registers all builtins, and drives
        # CommandRegistry::Dispatch through the pre-handler pipeline (registration
        # inventory, missing/wrong-typed-arg matrices, destructive-confirm gate).
        # Advisory like the rest of this lane (not on the develop merge gate).
        run: |
          cmake --build --preset posix-core-check --target SmatchetCommandsTests
          ./build/posix-core-check/tests/SmatchetCommandsTests

      - name: Build + smoke the command-registry monkey (fixed seed)
        # nightly-monkey-tester.md Layer 1a — bounded, fixed-seed run so the seeded
        # fuzz driver never bit-rots and stays reproducible on every PR. The nightly
        # (.github/workflows/monkey-nightly.yml) runs it under ASan+UBSan with a large
        # budget; here it is a plain smoke (no sanitizer). Advisory like this lane.
        run: |
          cmake --build --preset posix-core-check --target SmatchetMonkeyCli
          ./build/posix-core-check/tests/SmatchetMonkeyCli --mode=prehandler --seed=1 --steps=2000
          # Layer 1b — boot a fully-initialized headless AppController vs the fake Jira
          # backend and run the read-only handler allow-list (fixture path is repo-relative;
          # the job's working dir is the repo root).
          ./build/posix-core-check/tests/SmatchetMonkeyCli --mode=handlers --seed=1 --steps=500 \
            --fixture=tests/fixtures/jira_backend/basic-grid.json

  mobile-android-ndk:
    name: Mobile — Android NDK arm64-v8a (.so configure+link)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Pin the toolchain + TLS source. Bump OPENSSL_SHA256 in lockstep with
      # OPENSSL_VERSION (sha256 of openssl-<ver>.tar.gz from the official release
      # asset openssl-<ver>.tar.gz.sha256 — mirrors the Font Awesome pin pattern
      # in the windows-msvc job). NDK_VERSION drift intentionally poisons the
      # OpenSSL cache key (a new NDK ABI/sysroot needs a fresh OpenSSL build).
      OPENSSL_VERSION: "3.5.6"
      OPENSSL_SHA256: "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736"
      NDK_VERSION: "26.3.11579264"
      ANDROID_API: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenSSL build prereqs (make + perl)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y make perl

      - name: Install + pin Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK" || { echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME unset on runner"; exit 1; }
          SDKMANAGER="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          # Accept licenses without tripping pipefail: `yes` takes EPIPE when sdkmanager
          # closes stdin and exits non-zero (the "yes: standard output: Broken pipe" that
          # `set -o pipefail` turns into a step failure) — guard the whole pipeline with
          # `|| true`. The install needs no stdin once licenses are accepted, so it runs
          # pipe-free and its real exit code surfaces; `test -d` below is the authoritative
          # success gate either way.
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" >/dev/null
          NDK="${SDK}/ndk/${NDK_VERSION}"
          test -d "$NDK" || { echo "::error::NDK ${NDK_VERSION} not found at $NDK"; exit 1; }
          # Export for every subsequent step: the android.toolchain.cmake path in the
          # preset reads $env{ANDROID_NDK_ROOT}; OpenSSL's Configure reads it too.
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "OPENSSL_PREFIX=${RUNNER_TEMP}/openssl-android/arm64-v8a" >> "$GITHUB_ENV"

      - name: Cache prebuilt OpenSSL (arm64-v8a)
        id: openssl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-android/arm64-v8a
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-arm64-v8a-api${{ env.ANDROID_API }}

      - name: Build static OpenSSL for arm64-v8a (NDK clang)
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 10 --retry-delay 30 --retry-max-time 600 --retry-all-errors \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o openssl.tar.gz
          # Pinned-checksum gate (fail-closed): a hijacked/changed tarball aborts here.
          echo "${OPENSSL_SHA256}  openssl.tar.gz" | sha256sum -c -
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          export PATH="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          # --libdir=lib pins the install layout (some hosts default to lib64, which
          # would desync the explicit OPENSSL_*_LIBRARY paths passed at configure).
          # __ANDROID_API__ MUST equal ANDROID_PLATFORM (android-24) in the preset.
          ./Configure android-arm64 -D__ANDROID_API__="${ANDROID_API}" \
            no-shared no-tests no-apps no-docs --libdir=lib --prefix="${OPENSSL_PREFIX}"
          make -j"$(nproc)"
          make install_sw

      - name: Verify OpenSSL static libs present
        shell: bash
        run: |
          set -euo pipefail
          test -f "${OPENSSL_PREFIX}/lib/libssl.a"               || { echo "::error::libssl.a missing"; exit 1; }
          test -f "${OPENSSL_PREFIX}/lib/libcrypto.a"            || { echo "::error::libcrypto.a missing"; exit 1; }
          test -f "${OPENSSL_PREFIX}/include/openssl/opensslv.h" || { echo "::error::opensslv.h missing"; exit 1; }
          ls -l "${OPENSSL_PREFIX}/lib"

      - name: Cache FetchContent _deps (android-ndk)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-android-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure android-ndk-arm64 (validates Slice 1 — TLS backend)
        # The preset forces CPR_FORCE_OPENSSL_BACKEND + widens CMAKE_FIND_ROOT_PATH_MODE_*
        # to BOTH so find_package(OpenSSL) sees the prebuilt outside the NDK sysroot.
        # The absolute OpenSSL paths are runtime-dependent ($RUNNER_TEMP) so they are
        # passed here, not baked into the preset.
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset android-ndk-arm64 \
            -DOPENSSL_ROOT_DIR="${OPENSSL_PREFIX}" \
            -DOPENSSL_INCLUDE_DIR="${OPENSSL_PREFIX}/include" \
            -DOPENSSL_SSL_LIBRARY="${OPENSSL_PREFIX}/lib/libssl.a" \
            -DOPENSSL_CRYPTO_LIBRARY="${OPENSSL_PREFIX}/lib/libcrypto.a" \
            -DCMAKE_FIND_ROOT_PATH="${OPENSSL_PREFIX}"

      - name: Compile + link SmatchetMobile .so (validates Slice 2 — empty .so link)
        # Builds CORE_SOURCES through the NDK (#else side) and links the SHARED object.
        # -Wl,-z,undefs (set on the target) permits the host symbols Slice 3 resolves.
        # `-- -k 0` (ninja keep-going) enumerates every failing TU in one run.
        run: cmake --build --preset android-ndk-arm64 --target SmatchetMobile -- -k 0

  mobile-android-apk:
    name: Mobile — Android APK (Gradle assembleDebug arm64-v8a)
    # Validates Slice 4 — the full Gradle externalNativeBuild path that the .so-only
    # mobile-android-ndk job stops short of: it drives the same root CMakeLists through
    # AGP, links the SHARED .so into an installable debug APK, and uploads it. BLOCKING
    # via the merge-gate poller (all-gates-blocking flip) — same pins as
    # mobile-android-ndk; restored OpenSSL cache wins.
    needs: [changes, mobile-android-ndk]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Keep these in lockstep with mobile-android-ndk (same OpenSSL/NDK pins so the
      # arm64-v8a OpenSSL cache key matches and the restore hits the prior job's build).
      OPENSSL_VERSION: "3.5.6"
      OPENSSL_SHA256: "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736"
      NDK_VERSION: "26.3.11579264"
      ANDROID_API: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17 (AGP 8.5 toolchain)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install OpenSSL build prereqs + ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y make perl ninja-build

      - name: Install + pin Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK" || { echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME unset on runner"; exit 1; }
          SDKMANAGER="${SDK}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" >/dev/null
          NDK="${SDK}/ndk/${NDK_VERSION}"
          test -d "$NDK" || { echo "::error::NDK ${NDK_VERSION} not found at $NDK"; exit 1; }
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "OPENSSL_BASE=${RUNNER_TEMP}/openssl-android" >> "$GITHUB_ENV"
          echo "OPENSSL_PREFIX=${RUNNER_TEMP}/openssl-android/arm64-v8a" >> "$GITHUB_ENV"

      - name: Cache prebuilt OpenSSL (arm64-v8a)
        id: openssl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openssl-android/arm64-v8a
          # Same key as mobile-android-ndk → this restores that job's build (needs: orders it first).
          key: openssl-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}-arm64-v8a-api${{ env.ANDROID_API }}

      - name: Build static OpenSSL for arm64-v8a (NDK clang) — fallback on cache miss
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 10 --retry-delay 30 --retry-max-time 600 --retry-all-errors \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o openssl.tar.gz
          echo "${OPENSSL_SHA256}  openssl.tar.gz" | sha256sum -c -
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          export PATH="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          ./Configure android-arm64 -D__ANDROID_API__="${ANDROID_API}" \
            no-shared no-tests no-apps no-docs --libdir=lib --prefix="${OPENSSL_PREFIX}"
          make -j"$(nproc)"
          make install_sw

      - name: Verify OpenSSL static libs present
        shell: bash
        run: |
          set -euo pipefail
          test -f "${OPENSSL_PREFIX}/lib/libssl.a"    || { echo "::error::libssl.a missing"; exit 1; }
          test -f "${OPENSSL_PREFIX}/lib/libcrypto.a" || { echo "::error::libcrypto.a missing"; exit 1; }

      - name: Cache FetchContent _deps (android-ndk)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-android-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Write local.properties (sdk.dir + cmake.dir ≥ 3.24)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Root CMakeLists requires CMake >= 3.24; the SDK bundles only 3.22.1, so point
          # AGP (build.gradle requests version '3.24.0+') at the runner's system cmake.
          CMAKE_BIN="$(command -v cmake)"
          CMAKE_DIR="$(dirname "$(dirname "$CMAKE_BIN")")"
          cmake --version | head -1
          {
            echo "sdk.dir=${SDK}"
            echo "cmake.dir=${CMAKE_DIR}"
          } > Source/Mobile/AndroidApp/local.properties
          cat Source/Mobile/AndroidApp/local.properties

      - name: Gradle assembleDebug (arm64-v8a only)
        shell: bash
        env:
          # build.gradle derives <base>/${ANDROID_ABI} per ABI when OPENSSL_ROOT_DIR is unset.
          SMATCHET_ANDROID_OPENSSL_BASE: ${{ env.OPENSSL_BASE }}
        run: |
          set -euo pipefail
          cd Source/Mobile/AndroidApp
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Gradle testDebugUnitTest (Robolectric JVM, WS5 item 17)
        shell: bash
        env:
          # testDebugUnitTest does NOT drive externalNativeBuild, but pass the same
          # OpenSSL base so any incidental configure of the native path resolves exactly
          # as assembleDebug did above (the heavy build is already cached/done here).
          SMATCHET_ANDROID_OPENSSL_BASE: ${{ env.OPENSSL_BASE }}
        run: |
          set -euo pipefail
          cd Source/Mobile/AndroidApp
          # JVM/Robolectric harness for SmatchetActivity's IME/Unicode-queue bridge
          # (docs/plans/mobile-mvp-completion.md WS5 item 17). Pure-Java; no device,
          # no .so load. Robolectric pulls its android-all jar (sdk=34, pinned in
          # robolectric.properties) from mavenCentral at test time.
          ./gradlew --no-daemon testDebugUnitTest

      - name: Upload JVM unit-test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smatchet-mobile-jvm-unit-test-report
          path: Source/Mobile/AndroidApp/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK produced
        shell: bash
        run: |
          set -euo pipefail
          # A single-ABI injected build (-Pandroid.injected.build.abi=arm64-v8a) is an
          # IDE-style deploy build: AGP redirects the APK to intermediates/apk/debug/
          # (app-debug.apk), NOT the usual outputs/apk/debug/. Search the whole app/build
          # tree, constrained to the canonical debug-APK names (app-debug.apk universal or
          # app-<abi>-debug.apk split), and sort so selection is deterministic if a future
          # ABI split ever produces more than one. readarray + process-substitution keeps
          # this pipefail-safe (a `find | sort | head` pipe would SIGPIPE under pipefail).
          readarray -t APKS < <(
            find Source/Mobile/AndroidApp/app/build -type f \
              \( -name 'app-debug.apk' -o -name 'app-*-debug.apk' \) | sort
          )
          APK="${APKS[0]:-}"
          if [ -z "$APK" ]; then
            echo "::error::no debug APK produced under Source/Mobile/AndroidApp/app/build"
            find Source/Mobile/AndroidApp/app/build -type d -name apk -exec ls -lR {} + 2>/dev/null || true
            exit 1
          fi
          ls -l "$APK"
          echo "SMATCHET_APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smatchet-mobile-debug-apk-arm64-v8a
          path: ${{ env.SMATCHET_APK_PATH }}
          if-no-files-found: error
          retention-days: 14

  cpp-lint-advisory:
    name: C++ lint (catch-all + cppcheck)
    # The C++ lint gate that previously ran ONLY as a local Claude-Code hook
    # (tooling.md P2: "C++ lint runs only as local hooks, never in CI"). Two
    # checks over the PR diff's first-party C++:
    #   1. lint-catch-all.py — unmarked empty `catch(...){}` (Pillar-3 never-crash:
    #      a silent catch-all swallows the failure with no log). BLOCKS on the
    #      `[error]` tier (empty body); the `[warning]` tier (catch without LOG_)
    #      is reported but never blocks. Mirrors the local hook's rc=2-on-error.
    #   2. cppcheck — a curated, compile-DB-free pass over the same diff files
    #      (warning/portability families). cppcheck carries the real static-analysis
    #      weight here; clang-tidy stays cppcheck-primary per .clang-tidy (only 3
    #      dead-code checks enabled) and is intentionally NOT run in this job.
    #
    # BLOCKING (all-gates-blocking flip — the follow-up promotion the old header
    # deferred): the job-level continue-on-error is gone, so the lint-catch-all
    # `[error]` tier (unmarked empty catch(...) bodies — Pillar-3) reds the check
    # and gates the merge; the check is also on branch_protection.required_contexts.
    # The cppcheck STEP below stays report-only BY DESIGN (a sanctioned step-level
    # survivor like fuzz-smoke's stochastic step): compile-DB-free cppcheck over a
    # bare diff file list has unavoidable false positives (no include paths), so
    # its findings inform rather than gate. Gates on `changes.code` so docs-only
    # PRs skip it; diffs against origin/develop so only NEW C++ is scanned.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cppcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Resolve diff range (first-party C++ only)
        id: range
        shell: bash
        run: |
          set -uo pipefail
          # Mirror the `changes` job's range logic so the lint scans exactly the
          # PR's (or push's) new C++. merge_group/push fall back to HEAD~1...HEAD.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # NO --depth: a shallow base-ref fetch re-shallows develop after the
            # fetch-depth:0 checkout and breaks merge-base for the three-dot range
            # below (#1227(b)). Masked here (diff is `2>/dev/null || true` + a
            # fail-safe default) but kept correct so the diff scans the true range.
            git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1...HEAD"
            else
              range="${before}...HEAD"
            fi
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          # First-party C++ in the diff (added/modified; deletions excluded via
          # --diff-filter=d). ThirdParty / build / _deps are out of scope.
          files="$(git diff --name-only --diff-filter=d "$range" 2>/dev/null \
            | grep -E '^Source/.*\.(cpp|h|hpp|cc|cxx|hh)$' \
            | grep -vE '(ThirdParty|/_deps/)' || true)"
          # Persist the newline list to a file (GITHUB_OUTPUT can't hold newlines cleanly).
          printf '%s\n' "$files" | sed '/^$/d' > /tmp/cpp-lint-files.txt
          echo "Diff range: ${range}"
          echo "First-party C++ files in diff:"
          sed 's/^/  /' /tmp/cpp-lint-files.txt || true
          echo "count=$(wc -l < /tmp/cpp-lint-files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: lint-catch-all (block on [error]-tier empty catch)
        if: ${{ steps.range.outputs.count != '0' }}
        shell: bash
        run: |
          set -uo pipefail
          script="docs/harness/claude-code/hooks/lint-catch-all.py"
          test -f "$script" || { echo "::error::lint-catch-all.py not found at $script"; exit 1; }
          out=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            # Per-file rc: 0 clean, 2 findings (stderr). Capture stderr; don't let
            # rc=2 abort the loop (set +e around the call).
            set +e
            finding="$(python3 "$script" "$f" 2>&1)"
            set -e 2>/dev/null || true
            [ -n "$finding" ] && out="${out}${finding}"$'\n'
          done < /tmp/cpp-lint-files.txt
          if [ -n "${out//[$'\n']/}" ]; then
            echo "lint-catch-all findings:"
            printf '%s\n' "$out"
          else
            echo "lint-catch-all: clean (no catch(...) findings in diff)"
          fi
          # Block ONLY on the [error] tier (empty catch). [warning] (catch without
          # LOG_) is surfaced above but never fails the job.
          if printf '%s\n' "$out" | grep -q '\[error\]'; then
            echo "::error::unmarked empty catch(...) block in diff — add LOG_ or // catch-all-ok: <reason>"
            exit 1
          fi

      - name: cppcheck (curated, compile-DB-free) over diff
        if: ${{ steps.range.outputs.count != '0' }}
        shell: bash
        run: |
          set -uo pipefail
          # Compile-DB-free pass: no configure/build needed — cppcheck parses the
          # changed TUs directly. --enable subset mirrors the local run_cppcheck.py
          # curation (warning/style/performance/portability minus the noisy
          # missingInclude families that need full include paths cppcheck lacks here).
          mapfile -t FILES < /tmp/cpp-lint-files.txt
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "cppcheck: no first-party C++ in diff; skipping"
            exit 0
          fi
          # --error-exitcode=0 keeps this STEP report-only BY DESIGN (sanctioned
          # step-level survivor of the all-gates-blocking flip): compile-DB-free
          # cppcheck over a bare diff file list lacks include paths and carries
          # unavoidable false positives, so its findings inform, never gate. The
          # JOB blocks via the lint-catch-all [error] tier above. Flip
          # --error-exitcode=2 only with a compile-DB-backed invocation.
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress='*:*ThirdParty*' \
            --suppress='*:*_deps*' \
            --error-exitcode=0 \
            --template='{file}:{line}: [{severity}] {id}: {message}' \
            "${FILES[@]}" 2>&1 | tee /tmp/cppcheck-out.txt || true
          if [ -s /tmp/cppcheck-out.txt ]; then
            echo "cppcheck reported findings above (advisory — not blocking)."
          else
            echo "cppcheck: clean over diff."
          fi

      - name: No first-party C++ in diff
        if: ${{ steps.range.outputs.count == '0' }}
        run: echo "No first-party C++ changed in this diff — C++ lint advisory is a no-op."
