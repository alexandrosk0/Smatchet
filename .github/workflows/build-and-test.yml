name: Build and test

# Primary CI: MSVC + Clang (equal-citizen toolchains).
# See docs/plans/shipped/generic-cmake-cross-platform.md.

# Least-privilege default for GITHUB_TOKEN: every job here only checks out,
# builds, and uploads run-scoped artifacts — none writes to the repo. Jobs that
# need more elevate per-job (none currently do).
permissions:
  contents: read

# sccache (local-dir backend) — docs/plans/ci-build-time-reduction.md Phase 1.
# CMakeLists.txt auto-wraps sccache off PATH (find_program NAMES ccache sccache).
# We deliberately use the LOCAL-DISK backend (SCCACHE_DIR) + actions/cache rather
# than SCCACHE_GHA_ENABLED: the GHA-native backend makes sccache talk to the GH
# cache *service* on every compile, and a service hiccup fails server startup =>
# fatal build failure on a REQUIRED check (observed on the first attempt). Local
# disk decouples build success from cache-service uptime — an outage just yields a
# cold cache, never a broken build. Each MSVC build job installs the sccache binary
# (mozilla-actions/sccache-action) + caches $SCCACHE_DIR. Disable with
# SMATCHET_NO_CCACHE=1.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SCCACHE_DIR: ${{ github.workspace }}\.sccache
  # Pin the standalone renderer to OpenGL workflow-wide so EVERY headless exe
  # launch renders through Mesa software GL — bucket-C screenshot-diff (incl. the
  # scenario.run buried in scripts/dev/test-screenshot-diff.sh), bucket-E,
  # mobile-texture-guard, and the perf headless runs — keeping the committed Mesa
  # goldens byte-stable. The Windows default is now DX12 (WARP on CI runners),
  # whose output would diverge from those goldens. ResolveStandaloneRenderer reads
  # this env; an explicit `--renderer=dx12` flag still overrides it for any future
  # DX12-specific job (flag > env > platform default).
  SMATCHET_RENDERER: "gl"
  # NOTE: the workflow-wide SMATCHET_MCP_REQUIRE_TOKEN_ON_LOOPBACK=false opt-out
  # (PR A / #1574, the #1566 fast-unblock) was REMOVED once the real product fix
  # landed (PR B / #1576: the --spawn parent auto-provisions a per-spawn MCP token
  # and sends it on the wire). Every --spawn CI gate below now runs under the
  # SECURE default (require-token-on-loopback ON) and must stay green on PR B's
  # handshake alone — that is the standing regression guard for #1566.

on:
  # NO paths-ignore: required status checks (Windows + MSVC, Windows + MSVC
  # light) must report on EVERY PR or branch protection wedges docs-only PRs
  # ("Expected — Waiting for status," unmergeable). Instead the `changes` job
  # below detects whether any non-docs path changed and the build jobs skip
  # when it is docs-only — a skipped required job is treated as success by
  # branch protection, while a path-skipped workflow never reports at all.
  # See docs/agent-rules/ci-required-check-pattern.md (Pattern C).
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # Merge-queue readiness (docs/plans/active/build-quality-velocity-hardening.md
  # finding #14 path B): when develop is put behind a GitHub merge queue, the
  # required checks run on the synthetic `merge_group` ref. A required check that
  # never reports on `merge_group` deadlocks the queue forever (same class as the
  # #880/#881/#882 path-filtered-required-check deadlock). The `changes` detect
  # step below forces code=true on merge_group so BOTH MSVC required contexts
  # always run + report a terminal status on the queued merge.
  merge_group:
  # Manual dispatch: lets the push-only, runner-gated Windows-on-ARM legs run on
  # a topic branch BEFORE merging (they skip on pull_request by design, so the
  # only pre-dispatch way to test an ARM64 bring-up fix was merging to develop
  # and watching the push run — a slow, merge-noisy loop the all-gates-blocking
  # WoA whisper fix hit first). `github.event_name != 'pull_request'` in the WoA
  # job `if:` admits dispatch runs.
  workflow_dispatch:

# Cancel in-flight runs for the same branch on a new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: did any NON-docs path change? Build jobs key off this so a
  # docs-only PR skips the expensive Windows builds while the required check
  # contexts still report (skipped == success for branch protection).
  # Fail-safe: any detection uncertainty (empty/failed diff) defaults to
  # code=true, so a code PR can never be wrongly skipped — the worst case is
  # running a build that wasn't strictly needed, never skipping one that was.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      source_core_cpp: ${{ steps.detect.outputs.source_core_cpp }}
      android_only: ${{ steps.detect.outputs.android_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect non-docs changes
        id: detect
        shell: bash
        run: |
          set -uo pipefail
          # Merge-queue: a queued merge MUST report both MSVC required contexts
          # green (a skipped/never-reporting required check deadlocks the queue).
          # The merge_group ref IS the to-be-merged result, so building it is both
          # correct and the safety the queue exists for — force the full build.
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "merge_group event — forcing full build (code=true, asan=true)."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "source_core_cpp=true" >> "$GITHUB_OUTPUT"
            echo "android_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # NO --depth: a shallow base-ref fetch re-shallows develop after the
            # fetch-depth:0 checkout and breaks merge-base for the three-dot range
            # below (#1227(b)). Masked here (diff is `2>/dev/null || true` + a
            # fail-safe default) but kept correct so the diff scans the true range.
            git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1...HEAD"
            else
              range="${before}...HEAD"
            fi
          fi
          files=$(git diff --name-only $range 2>/dev/null || true)
          echo "Changed files in ${range}:"; printf '  %s\n' $files
          # Default code=true (fail-safe). Only flip to false when we have a
          # non-empty file list AND every entry is a docs-class path.
          code=true
          if [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # Build-invoked exception: test-lint-rules.sh is the strict-zone
                # delta gate run INSIDE the windows-msvc job (steps below at the
                # "--diff origin/develop" + develop "--catalog --refresh" lines).
                # It lives in the agentic tree but a change to it MUST trigger the
                # build so the gate is re-validated — otherwise a PR touching only
                # the gate skips the build and the gate never runs. Keep before the
                # agents/* docs-class arm (case matches first pattern). lint-rules.d/
                # holds the gate's sourced per-rule modules — same rule.
                agents/scripts/project/test-lint-rules.sh|agents/scripts/project/lint-rules.d/*) code=true; break ;;
                # Docs-class scripts: test-docs.sh is the local mirror of
                # .github/workflows/doc-validation.yml (anchors / agent-contract /
                # plan-index / ...). It runs no compiler and touches no product
                # code, so a change to it alone must NOT trigger the expensive
                # Windows builds — doc-validation.yml re-validates it on its own.
                # (Other scripts/dev/*.sh — doctor.sh, test-build-warnings.sh, etc.
                # — DO affect the build and stay non-docs via the *) arm below.)
                scripts/dev/test-docs.sh) ;;
                *.md|docs/*|agents/*|scripts/dev/local/*|.gitignore|.gitattributes|.coderabbit.yaml|.github/CODEOWNERS|.github/pull_request_template.md) ;;
                *) code=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "non-docs changes present: ${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          # ASAN Core-delta gate (docs/plans/ci-build-time-reduction.md Q5):
          # the sanitizer-asan job builds Debug (uncacheable by sccache) and is the
          # only real per-PR asan lever, so run it pre-merge ONLY when first-party
          # shared C++ that can introduce UB changed — Source/Core or Source/Plugins
          # (.cpp/.h/.hpp/.cc). Standalone-only / docs / yaml PRs skip asan pre-merge;
          # sanitizer-nightly still covers them. **Fail-safe = TRUE on uncertainty**:
          # an empty/failed `$files` means we could NOT classify the diff, so we must
          # NOT skip the pre-merge sanitizer safety gate — default to running asan
          # (mirrors the `code=true` fail-safe above). Only a *non-empty* file list
          # with no Core/Plugins C++ match yields false (the intended skip on
          # docs/yaml/Standalone-only PRs). In `case`, * spans '/', so nested paths match.
          if [ -z "$files" ]; then
            source_core_cpp=true
          else
            source_core_cpp=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                Source/Core/*.cpp|Source/Core/*.h|Source/Core/*.hpp|Source/Core/*.cc|Source/Core/*.cxx|Source/Core/*.hh|Source/Plugins/*.cpp|Source/Plugins/*.h|Source/Plugins/*.hpp|Source/Plugins/*.cc|Source/Plugins/*.cxx|Source/Plugins/*.hh)
                  source_core_cpp=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "Source/Core|Plugins C++ changed (asan gate): ${source_core_cpp}"
          echo "source_core_cpp=${source_core_cpp}" >> "$GITHUB_OUTPUT"
          # Android-only diff gate: skip the desktop standalone builds + their
          # downstream tests when the diff touches ONLY android/mobile paths —
          # Source/Mobile/** (the mobile source tree, compiled by NO desktop job)
          # and cmake/toolchains/** (the NDK toolchain wrapper, consumed only by
          # the android-ndk preset). The mobile-android-ndk job — the ONLY job
          # that compiles Source/Mobile — gates on `code`, not this, so it still
          # runs; mobile-posix-core-check (CORE-only, host clang) is skipped since
          # a Source/Mobile change can't affect CORE_SOURCES and android-ndk
          # already cross-compiles CORE for the android-only case.
          # Set true ONLY when code==true AND every changed file is an android-only
          # path OR a docs-class path the `code` gate above already treats as
          # non-compiling (so a mobile change + its plan-doc update still skips
          # desktop). The two build-invoked arms (test-lint-rules.sh / test-docs.sh)
          # MIRROR the `code` arms above so a gate-script change can't be mis-skipped.
          # **Fail-safe = FALSE** (run the full desktop suite) on ANY uncertainty:
          # empty/failed diff or code==false leaves it false; any non-android,
          # non-docs file flips it false. A skipped REQUIRED check (windows-msvc /
          # -light) counts as success for branch protection — same as docs-only.
          android_only=false
          if [ "$code" = "true" ] && [ -n "$files" ]; then
            android_only=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                agents/scripts/project/test-lint-rules.sh|agents/scripts/project/lint-rules.d/*) android_only=false; break ;;
                Source/Mobile/*|cmake/toolchains/*) ;;
                scripts/dev/test-docs.sh) ;;
                *.md|docs/*|agents/*|scripts/dev/local/*|.gitignore|.gitattributes|.coderabbit.yaml|.github/CODEOWNERS|.github/pull_request_template.md) ;;
                *) android_only=false; break ;;
              esac
            done <<< "$files"
          fi
          echo "android-only diff (skip desktop builds): ${android_only}"
          echo "android_only=${android_only}" >> "$GITHUB_OUTPUT"

  # High-integrity C++ delta gate (docs/plans/shipped/high-integrity-cpp-enforcement.md),
  # broken out of the windows-msvc build job into its OWN required lane. WHY: the
  # gate ran inside windows-msvc's "Run non-UI bucket-A tests" step, so a trivial
  # comment-noise / style nit reds the REQUIRED windows-msvc job AND — because every
  # downstream bucket job `needs: windows-msvc` (bucket-c-screenshot-diff,
  # bucket-e-ui-tests, mobile-texture-guard-smoke, the hard-fail
  # bucket-launch-smoke-mesa-gl) — SKIPS the entire real verification surface on a
  # style nit. Decoupling it keeps windows-msvc green (so the buckets RUN) while the
  # nit reds only THIS check. It stays a HARD GATE: NO continue-on-error — this is a
  # required branch-protection context (project.config.json §
  # branch_protection.required_contexts entry "Comment-noise + high-integrity gate")
  # and the merge-gates poller's required-context ground truth, so a red here still
  # blocks merge. We are NOT loosening merge policy, only stopping the nit from
  # skipping the buckets.
  #
  # Runner: ubuntu-latest. test-lint-rules.sh is OS-portable — pure bash + git text
  # analysis + python helpers (comment_audit.py / function_size_audit.py /
  # agent_size_audit.py), no cl.exe / MSVC / PowerShell / Windows-path dependency
  # (the only compiler-touching rule, narrowing-conversions, is OPT-IN behind
  # SMATCHET_LINT_NARROWING and warn-skips without a clang compile_commands.json, so
  # it is inert here). Ubuntu is cheaper + faster than a windows-2022 runner.
  #
  # Needs FULL HISTORY for `--diff origin/develop` (merge-base resolution), mirroring
  # the unshallow + fetch-develop setup the build job used to carry.
  comment-noise-gate:
    name: Comment-noise + high-integrity gate
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: High-integrity C++ delta gate (test-lint-rules.sh --diff)
        shell: bash
        run: |
          # The gate (function_size_audit / comment_audit --diff) diffs HEAD against
          # `git merge-base origin/develop HEAD`, so it needs REAL HISTORY on both
          # sides. fetch-depth:0 above gives full HEAD history; fetch develop with
          # full history so merge-base resolves the real branch point (a depth-1
          # develop fetch leaves merge-base empty → the script falls back to develop's
          # TIP and false-flags any PR branched before a sibling change landed —
          # tooling.md P1).
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin develop
          git rev-parse --verify --quiet origin/develop >/dev/null || {
            echo "::error::origin/develop unavailable — cannot run high-integrity delta gate"; exit 1; }
          bash agents/scripts/project/test-lint-rules.sh --diff origin/develop
          # NB: the gate's bats (tests/bats/lint_rules.bats via test-lint-rules-bats.sh)
          # run at the pre-push gate (test-all.sh, where bats is installed), NOT here.
          # CI enforces the gate itself (--diff above); the bats are the gate's unit tests.

  windows-msvc:
    name: Windows + MSVC
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.android_only != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (msvc)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-msvc-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-msvc-

      - name: Cache FetchContent _deps (msvc)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Toolchain pre-flight (doctor.sh)
        shell: bash
        run: |
          set +e
          bash scripts/dev/doctor.sh
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error::doctor.sh failed (required toolchain check)"
            exit 1
          fi
          echo "doctor.sh rc=$rc (0=GREEN, 2=YELLOW acceptable in CI)"

      - name: Configure ninja-test-msvc
        run: cmake --preset ninja-test-msvc

      - name: Build test binaries (MSVC)
        run: cmake --build --preset ninja-test-msvc

      - name: Run ctest (MSVC)
        working-directory: build/ninja-test-msvc
        run: ctest --output-on-failure

      - name: Fetch Font Awesome 6 Solid TTF (pinned + checksum-verified)
        uses: ./.github/actions/fetch-fontawesome

      - name: Configure ninja-iter-msvc
        run: cmake --preset ninja-iter-msvc

      - name: Build SmatchetStandalone (MSVC)
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

      - name: Run non-UI bucket-A tests
        shell: bash
        run: |
          bash scripts/dev/test-cppcheck-path-detection.sh
          bash scripts/dev/test-build-warnings.sh
          bash scripts/dev/test-markdown-lang-tag.sh
          # Keep the CI FetchContent cache `path:` values in lockstep with the
          # FETCHCONTENT_BASE_DIR default in CMakeLists.txt (PR-15). A silent drift
          # makes every CI run a cold clone (cache never populated). Cheap text gate.
          bash scripts/dev/test-fetchcontent-cache-path-drift.sh
          # NB: the high-integrity C++ delta gate (test-lint-rules.sh --diff
          # origin/develop) used to run HERE, inside this required build job. It was
          # decoupled into its own required lane — the `comment-noise-gate` job below
          # — so that a pure style/comment-noise nit reds ITS OWN check without
          # red-walling this build job (which every downstream bucket job
          # `needs: windows-msvc`). A nit here used to SKIP every bucket (the real
          # verification: screenshot-diff, bucket-E, texture-guard, launch-smoke).
          # The gate stays REQUIRED + BLOCKING (project.config.json §
          # branch_protection.required_contexts), it just no longer gates the build.
          # See docs/plans/shipped/high-integrity-cpp-enforcement.md.

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload Smatchet.exe artefact (for bucket-C / bucket-E jobs)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smatchet-exe-${{ github.run_id }}
          path: |
            build/ninja-iter-msvc/Smatchet.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload Smatchet.exe on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Smatchet-failure-${{ github.run_id }}
          path: build/ninja-iter-msvc/Smatchet.exe
          if-no-files-found: ignore

  windows-msvc-arm64:
    name: Windows + MSVC (ARM64 cross-compile)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.android_only != 'true' }}
    runs-on: windows-2022
    # BLOCKING compile-only ARM64 cross leg (docs/plans/dx12-standalone-win-arm64.md
    # Phase 4 row 11; graduated from advisory in the all-gates-blocking flip — the
    # lane had been genuinely green, so an ARM64 compile/link break is a real
    # regression signal, gated like every other check). msvc-dev-cmd
    # `arch: amd64_arm64` sources the cross vcvars so cl.exe targets ARM64;
    # ninja-iter-msvc-arm64 then builds SmatchetStandalone. The ARM64 binary cannot
    # execute on the x64 runner, so this gate is compile + link only — test
    # execution + runtime validation ride the windows-11-arm native legs below.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment (ARM64 cross)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64_arm64

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (msvc-arm64)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-msvc-arm64-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-msvc-arm64-

      - name: Cache FetchContent _deps (msvc-arm64)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          # Sources are arch-independent; fall back to the shared prefix so this
          # leg can restore the x64 job's already-fetched dependency sources.
          key: ${{ runner.os }}-fetchcontent-msvc-arm64-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Fetch Font Awesome 6 Solid TTF (pinned + checksum-verified)
        uses: ./.github/actions/fetch-fontawesome

      - name: Configure ninja-iter-msvc-arm64
        run: cmake --preset ninja-iter-msvc-arm64

      - name: Build SmatchetStandalone (ARM64 cross-compile)
        run: cmake --build --preset ninja-iter-msvc-arm64 --target SmatchetStandalone

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  windows-arm64-native:
    name: Windows-on-ARM native build + ctest (atomics gate, runner-gated)
    needs: changes
    # Phase 3 of docs/plans/dx12-standalone-win-arm64.md. The plan's
    # headline ARM64 risk is std::atomic memory-ordering: ~310 memory_order sites
    # (~73 relaxed) written under x86-TSO, where loads are implicitly acquire and
    # stores implicitly release — guarantees ARM64's weak model does NOT provide.
    # The Phase 4 cross leg above proves ARM64 compile+link on windows-2022 but
    # cannot EXECUTE the binary, so the bucket-A doctest rig (which is exactly the
    # atomics surface) has never run on an ARM core for Windows-only TUs. This leg
    # builds NATIVELY on a windows-11-arm runner and runs ctest there.
    #
    # Dormant by default. windows-11-arm GitHub-hosted runners are free for public
    # repos but may be absent on some private tiers, and a job pinned to an
    # unschedulable runner queues until timeout. Activate by setting the repository
    # variable ENABLE_WIN_ARM64_RUNNER=true (Settings → Secrets and variables →
    # Actions → Variables) once a windows-11-arm runner is confirmed available.
    # BLOCKING (all-gates-blocking flip): bring-up completed — the lane runs green
    # end-to-end on the windows-11-arm runner, so every continue-on-error mask
    # (job + per-step "green-with-annotation") is removed. A red here is a real
    # ARM64 regression (the atomics surface this leg exists for) and reds the
    # develop-push check like any other gate.
    # Follow-on steps for the live leg (tracked in tooling.md): DX12-on-WARP launch
    # smoke and the -Arch arm64 Inno installer smoke.
    # Skip on pull_request: these runner-gated ARM legs run on develop push +
    # merge_group only (the post-merge backstop model — PR wall-clock stays flat and
    # an unschedulable runner can never wedge a PR). Post-merge reds are triaged as
    # develop breakage per the strict-off backstop contract.
    if: ${{ vars.ENABLE_WIN_ARM64_RUNNER == 'true' && needs.changes.outputs.code == 'true' && needs.changes.outputs.android_only != 'true' && github.event_name != 'pull_request' }}
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment (ARM64 native)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (msvc-arm64-native)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-msvc-arm64-native-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-msvc-arm64-native-

      - name: Cache FetchContent _deps (msvc-arm64-native)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          # Drive-isolated namespace: `runner.os` is "Windows" for BOTH the
          # windows-2022 lanes (workspace on D:) and this windows-11-arm runner
          # (workspace on C:). A shared `${{ runner.os }}-fetchcontent-` restore
          # prefix would pull a D:-drive cache whose FetchContent subbuild
          # CMakeCache.txt has absolute `d:/...` paths baked in, failing configure
          # on the C:-drive ARM runner with "CMakeCache.txt directory is different".
          # Keep this cache in a `winarm64native` namespace that no D:-drive lane
          # restores from (and that never restores a D:-drive cache).
          key: ${{ runner.os }}-winarm64native-fetchcontent-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-winarm64native-fetchcontent-

      - name: Fetch Font Awesome 6 Solid TTF (pinned + checksum-verified)
        uses: ./.github/actions/fetch-fontawesome

      - name: Confirm native ARM64 host (guard against an x64 fallback runner)
        shell: pwsh
        run: |
          # Assert the leg is on a real ARM core before the expensive build —
          # otherwise a misprovisioned/x64 runner would silently build+ctest as x64
          # and green-wash the atomics validation. Resolve the *host* arch the way
          # the repo's MSVC wrapper does (scripts/dev/with-msvc-env.sh): prefer
          # PROCESSOR_ARCHITEW6432 (the native arch when the shell is emulated — e.g.
          # x64 pwsh under Prism on ARM64) and fall back to PROCESSOR_ARCHITECTURE; a
          # bare PROCESSOR_ARCHITECTURE check would false-fail on an emulated shell.
          $hostArch = $env:PROCESSOR_ARCHITEW6432
          if ([string]::IsNullOrWhiteSpace($hostArch)) { $hostArch = $env:PROCESSOR_ARCHITECTURE }
          Write-Host "host arch=$hostArch (PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE, PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432)"
          if (-not ($hostArch -and $hostArch -match '^(?i)arm64$')) {
            Write-Error "Expected a native ARM64 host but detected host arch='$hostArch'."
            exit 1
          }
          Write-Host 'Confirmed: native ARM64 host.'

      - name: Configure ninja-publish-msvc-arm64 (native)
        run: cmake --preset ninja-publish-msvc-arm64

      - name: Build SmatchetStandalone + SmatchetTests (ARM64 native)
        run: cmake --build --preset ninja-publish-msvc-arm64

      - name: Run ctest — bucket-A doctest rig on native ARM64 (atomics gate)
        working-directory: build/ninja-publish-msvc-arm64
        run: ctest --output-on-failure

      # DX12-on-WARP launch smoke (dx12-standalone-win-arm64 Phase 3 follow-on).
      # The Mesa-GL "Bucket launch-smoke" proves the GL path boots; this proves the
      # Windows-default DX12 renderer opens a D3D12 device and presents under WARP
      # (in-box software D3D12) on a no-GPU ARM64 runner. SMATCHET_RENDERER=dx12
      # overrides the workflow-level `gl` pin — the `--spawn` child inherits this env
      # (CliCommandRunner CreateProcessA) and ResolveStandaloneRenderer selects DX12;
      # a `--renderer` FLAG would NOT reach the child (spawned with only --ephemeral
      # --mcp-port). DX12 falls back to the WARP adapter when no hardware D3D12 exists
      # (Dx12Bootstrap SelectAdapterAndCreateDevice -> EnumWarpAdapter).
      - name: DX12-on-WARP launch smoke (ARM64)
        shell: bash
        env:
          SMATCHET_RENDERER: "dx12"
          SMATCHET_SPAWN_READY_MS: "30000"
        run: |
          set -uo pipefail
          EXE=build/ninja-publish-msvc-arm64/Smatchet.exe
          echo "dx12-smoke: $EXE cmd app.version --spawn --yes (SMATCHET_RENDERER=dx12, hang-guard 60s)"
          set +e
          out="$(timeout 60 "$EXE" cmd app.version --spawn --yes 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          # The DX12 init line ("DX12 renderer initialised (adapter: ..., WARP
          # software)") goes to the spawned child's log, not the parent CLI stdout;
          # the parent announces its path as "[spawn] child stdout/stderr -> <path>".
          childlog="$(printf '%s\n' "$out" | grep -a 'child stdout/stderr' | tail -1 | sed 's/.*child stdout\/stderr[^A-Za-z]*//' || true)"
          if [ -n "$childlog" ] && [ -f "$childlog" ]; then
            echo "===== DX12 spawned-child log ====="; cat "$childlog"; echo "===== end DX12 child log ====="
            grep -aiE 'DX12 renderer initialised|WARP software' "$childlog" \
              && echo "dx12-smoke: confirmed DX12 device-init line present." \
              || echo "::warning::dx12-smoke: DX12 init line not found in child log (see above)."
          else
            echo "::warning::dx12-smoke: no spawned-child log path found in output."
          fi
          if [ "$rc" -ne 0 ]; then
            if printf '%s\n' "$out" | grep -Eq '"command"[[:space:]]*:[[:space:]]*"app\.version".*"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "::warning::dx12-smoke: app.version ok:true but the spawn wrapper exited $rc (teardown false-red)."
            else
              echo "::error::dx12-smoke FAILED — DX12/WARP renderer could not boot+become-reachable on ARM64." >&2
              exit "$rc"
            fi
          fi
          echo "dx12-smoke: OK — DX12/WARP renderer booted."

      # Perf PR-fast bootstrap (Phase 3 follow-on). First ARM64 perf run: bootstrap
      # FRESH arch-keyed baselines docs/perf/baselines/<scen>.ci-windows-arm64.json —
      # NEVER compared to the x64 ci-windows-latest set (a different host key means
      # perf-compare.py is never invoked against them). Renders under DX12/WARP, NOT
      # Mesa GL: the pinned Mesa archive ships only an x64 opengl32.dll, so the GL
      # path has no ARM64 ICD; perf markers are CPU-side so WARP is fine. Baselines
      # are produced as an ARTEFACT for a human to commit in a follow-up bootstrap PR
      # (same flow as the ci-windows-latest set) — NOT auto-committed here.
      - name: Perf PR-fast bootstrap (ci-windows-arm64, DX12/WARP)
        shell: bash
        env:
          SMATCHET_RENDERER: "dx12"
          SMATCHET_SPAWN_READY_MS: "30000"
          SMATCHET_EXE: build/ninja-publish-msvc-arm64/Smatchet.exe
        run: |
          set -uo pipefail
          host=ci-windows-arm64
          mkdir -p docs/perf/baselines
          scens=$(python -c "import json;print(' '.join(json.load(open('scripts/dev/perf-pr-fast-set.json'))['scenarios']))")
          for scen in $scens; do
            echo "::group::perf $scen (ARM64/WARP)"
            result=$(bash scripts/dev/perf-run.sh "$scen" 2>&1 | tail -1 || true)
            if [ -f "$result" ]; then
              python scripts/dev/perf-baseline-bootstrap.py "$result" \
                "docs/perf/baselines/${scen}.${host}.json" "$scen" \
                --host "$host" --runner-os "windows-arm64" \
                --hardware-note "GitHub Actions windows-11-arm runner (DX12/WARP)" \
                && echo "perf: bootstrapped ${scen}.${host}.json" \
                || echo "::warning::perf: bootstrap step failed for $scen"
            else
              echo "::warning::perf: $scen produced no snapshot on ARM64 (first-run plumbing may need iteration)."
            fi
            echo "::endgroup::"
          done

      - name: Upload ARM64 perf baselines (for human bootstrap commit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-arm64-baselines-${{ github.run_id }}
          path: docs/perf/baselines/*.ci-windows-arm64.json
          if-no-files-found: ignore

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

  windows-arm64-installer:
    name: Windows-on-ARM ARM64 installer smoke (runner-gated)
    needs: changes
    # Phase 3 follow-on (dx12-standalone-win-arm64): build the NATIVE ARM64 Inno
    # installer (release-github.sh --arch arm64 -> ninja-publish-msvc-arm64 LTO
    # publish + iscc with ArchitecturesAllowed=arm64) and smoke it (silent install
    # + launch under DX12/WARP). Kept SEPARATE from windows-arm64-native because it
    # needs Inno Setup provisioning (choco) and a heavier LTO publish build; the
    # atomics-gate job shouldn't carry that. BLOCKING (all-gates-blocking flip:
    # bring-up completed, the lane runs green — masks removed so a red is a real
    # installer/DX12-WARP regression); dormant behind ENABLE_WIN_ARM64_RUNNER like
    # the other ARM64 legs.
    # Skip on pull_request: these runner-gated ARM legs run on develop push +
    # merge_group only (the post-merge backstop model — PR wall-clock stays flat and
    # an unschedulable runner can never wedge a PR). Post-merge reds are triaged as
    # develop breakage per the strict-off backstop contract.
    if: ${{ vars.ENABLE_WIN_ARM64_RUNNER == 'true' && needs.changes.outputs.code == 'true' && needs.changes.outputs.android_only != 'true' && github.event_name != 'pull_request' }}
    runs-on: windows-11-arm
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment (ARM64 native)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: arm64

      - name: Confirm native ARM64 host
        shell: pwsh
        run: |
          $hostArch = $env:PROCESSOR_ARCHITEW6432
          if ([string]::IsNullOrWhiteSpace($hostArch)) { $hostArch = $env:PROCESSOR_ARCHITECTURE }
          Write-Host "host arch=$hostArch (PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE, PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432)"
          if (-not ($hostArch -and $hostArch -match '^(?i)arm64$')) {
            Write-Error "Expected a native ARM64 host but detected host arch='$hostArch'."
            exit 1
          }

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (msvc-arm64-installer)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          # Share the native leg's object cache (same ninja-publish-msvc-arm64
          # preset) so the LTO publish build is mostly cache hits.
          key: ${{ runner.os }}-sccache-msvc-arm64-native-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-msvc-arm64-native-

      - name: Cache FetchContent _deps (msvc-arm64-installer)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          # Same drive-isolated `winarm64native` namespace as the native build leg
          # above — both run on windows-11-arm (C: drive) and must never restore a
          # D:-drive windows-2022 FetchContent cache (baked-in absolute subbuild
          # paths fail cmake configure). Shared with the native leg so the two
          # ARM64 legs reuse each other's already-fetched sources.
          key: ${{ runner.os }}-winarm64native-fetchcontent-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-winarm64native-fetchcontent-

      - name: Fetch Font Awesome 6 Solid TTF (pinned + checksum-verified)
        uses: ./.github/actions/fetch-fontawesome

      - name: Install Inno Setup 6 (ISCC.exe)
        shell: pwsh
        run: |
          # release-github.sh requires Inno Setup's ISCC.exe (x86 binary, runs under
          # emulation on ARM64). Not present on the windows-11-arm image by default.
          choco install innosetup -y --no-progress
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { Write-Host "iscc: $($iscc.Source)" }
          else { Write-Host "::warning::ISCC.exe not on PATH after choco; release-github.sh also searches fixed install dirs + the uninstall registry." }

      - name: Build ARM64 installer (release-github.sh --arch arm64)
        shell: bash
        run: |
          # No --publish (no gh/secrets) and no --sign (no signing cert in CI).
          # --arch arm64 selects the ninja-publish-msvc-arm64 LTO preset, tags
          # artifacts -arm64, sets the Inno arch to arm64, and force-skips Unreal +
          # light. --allow-dirty: the Font Awesome fetch above dirties the worktree,
          # which the script's clean-tree assert would otherwise reject.
          bash scripts/publish/release-github.sh \
            --arch arm64 --tag arm64-installer-smoke --allow-dirty --skip-source-zip \
            --out-dir out/arm64-installer

      - name: Silent-install + launch smoke (DX12/WARP)
        shell: pwsh
        env:
          SMATCHET_RENDERER: "dx12"
          SMATCHET_SPAWN_READY_MS: "30000"
        run: |
          $setup = Get-ChildItem -Recurse -Path out/arm64-installer -Filter '*windows-arm64-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Error "ARM64 installer .exe not produced under out/arm64-installer."; exit 1 }
          Write-Host "Installing $($setup.FullName) /VERYSILENT ..."
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Silent install failed (exit $($p.ExitCode))."; exit 1 }
          # DefaultDirName={localappdata}\Programs\Smatchet, PrivilegesRequired=lowest
          # (SmatchetStandalone.iss) — no admin needed in CI.
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Smatchet\Smatchet.exe'
          if (-not (Test-Path $exe)) { Write-Error "Installed exe missing: $exe"; exit 1 }
          Write-Host "Launch smoke: $exe cmd app.version --spawn --yes (SMATCHET_RENDERER=dx12)"
          # Watchdog: run the launch under a 60s cap (mirrors item 1's bash
          # `timeout 60`) so a hung spawn fails fast instead of burning the job
          # timeout. The Start-Job child inherits this step's env, so
          # SMATCHET_RENDERER=dx12 still applies to the spawned exe.
          $job = Start-Job -ScriptBlock {
            param($exePath)
            & $exePath cmd app.version --spawn --yes 2>&1 | Out-String
          } -ArgumentList $exe
          if (-not (Wait-Job -Job $job -Timeout 60)) {
            Stop-Job -Job $job -Force; Remove-Job -Job $job -Force
            Write-Error "Installed ARM64 exe smoke timed out after 60s (hang watchdog)."
            exit 1
          }
          $out = Receive-Job -Job $job
          Remove-Job -Job $job
          Write-Host $out
          if ($out -notmatch '"ok"\s*:\s*true') { Write-Error "Installed ARM64 exe launch smoke failed."; exit 1 }
          Write-Host "ARM64 installer smoke OK — installed + launched the native arm64 build."

      - name: Upload ARM64 installer (for inspection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smatchet-arm64-installer-${{ github.run_id }}
          path: out/arm64-installer/assets/*windows-arm64-setup.exe
          if-no-files-found: ignore

  windows-x64-installer:
    name: Windows x64 installer smoke
    needs: changes
    # Build the x64 Inno installer (release-github.sh -> ninja-publish-msvc LTO
    # publish + iscc with the default x64 arch) and smoke it (silent install +
    # launch under DX12/WARP). Closes the release gap where only the (dormant,
    # runner-gated) ARM64 installer was CI-validated while the x64 installer that
    # most users get was validated only by the manual INSTALLER_SMOKE_TEST.md.
    #
    # POST-MERGE BACKSTOP (push to develop + workflow_dispatch only, never on
    # pull_request or in merge_group): an LTO publish build is ~20-30 min, so
    # running it per-PR / per-merge would inflate wall-clock and risk wedging the
    # merge queue on a flake. Instead it runs on every develop update, and a red
    # is triaged as develop breakage (same model as the ARM64 legs above). Unlike
    # those, it needs NO runner variable — windows-2022 is always available. Run
    # it on a topic branch before merging via the Actions "Run workflow" button.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true' && needs.changes.outputs.android_only != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (msvc-x64-installer)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          # Dedicated namespace — the ninja-publish-msvc (LTO) preset's objects
          # differ from the ninja-iter-msvc build job's, so it keeps its own cache.
          key: ${{ runner.os }}-sccache-msvc-x64-installer-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-msvc-x64-installer-

      - name: Cache FetchContent _deps (msvc-x64-installer)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Fetch Font Awesome 6 Solid TTF (pinned + checksum-verified)
        uses: ./.github/actions/fetch-fontawesome

      - name: Install Inno Setup 6 (ISCC.exe)
        shell: pwsh
        run: |
          # release-github.sh requires Inno Setup's ISCC.exe to compile the installer.
          choco install innosetup -y --no-progress
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { Write-Host "iscc: $($iscc.Source)" }
          else { Write-Host "::warning::ISCC.exe not on PATH after choco; release-github.sh also searches fixed install dirs + the uninstall registry." }

      - name: Build x64 installer (release-github.sh)
        shell: bash
        run: |
          # No --publish (no gh/secrets) and no --sign (no signing cert in CI) — an
          # unsigned local bundle is fine for a packaging smoke; --publish would be
          # refused without --sign per the signing-enforcement policy anyway. Default
          # arch is x64 (ninja-publish-msvc). Skip everything but the standalone +
          # installer: --skip-unreal (no UE in CI), --skip-light-standalone,
          # --skip-source-zip, --skip-fab-bundle. --allow-dirty: the Font Awesome
          # fetch dirties the worktree.
          bash scripts/publish/release-github.sh \
            --tag x64-installer-smoke --allow-dirty \
            --skip-unreal --skip-light-standalone --skip-source-zip --skip-fab-bundle \
            --out-dir out/x64-installer

      - name: Silent-install + launch smoke (DX12/WARP)
        shell: pwsh
        env:
          SMATCHET_RENDERER: "dx12"
          SMATCHET_SPAWN_READY_MS: "30000"
        run: |
          # x64 installer basename is Smatchet-<tag>-windows-setup.exe (empty arch token).
          $setup = Get-ChildItem -Recurse -Path out/x64-installer -Filter '*windows-setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Error "x64 installer .exe not produced under out/x64-installer."; exit 1 }
          Write-Host "Installing $($setup.FullName) /VERYSILENT ..."
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Silent install failed (exit $($p.ExitCode))."; exit 1 }
          # DefaultDirName={localappdata}\Programs\Smatchet, PrivilegesRequired=lowest
          # (SmatchetStandalone.iss) — no admin needed in CI.
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Smatchet\Smatchet.exe'
          if (-not (Test-Path $exe)) { Write-Error "Installed exe missing: $exe"; exit 1 }
          Write-Host "Launch smoke: $exe cmd app.version --spawn --yes (SMATCHET_RENDERER=dx12)"
          # Hang watchdog: cap the spawned launch at 60s so a hung spawn fails fast
          # instead of burning the job timeout. The Start-Job child inherits this
          # step's env, so SMATCHET_RENDERER=dx12 applies to the spawned exe.
          $job = Start-Job -ScriptBlock {
            param($exePath)
            & $exePath cmd app.version --spawn --yes 2>&1 | Out-String
          } -ArgumentList $exe
          if (-not (Wait-Job -Job $job -Timeout 60)) {
            Stop-Job -Job $job -Force; Remove-Job -Job $job -Force
            Write-Error "Installed x64 exe smoke timed out after 60s (hang watchdog)."
            exit 1
          }
          $out = Receive-Job -Job $job
          Remove-Job -Job $job
          Write-Host $out
          if ($out -notmatch '"ok"\s*:\s*true') { Write-Error "Installed x64 exe launch smoke failed."; exit 1 }
          Write-Host "x64 installer smoke OK — installed + launched the standalone build."

      - name: Verify uninstall registration + user-data path
        shell: pwsh
        run: |
          # The installer must register an uninstaller; INSTALLER_SMOKE_TEST.md
          # checks this by hand. Assert the per-user uninstall key exists.
          $found = $false
          $roots = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $hit = Get-ChildItem $root | ForEach-Object { Get-ItemProperty $_.PSPath } |
              Where-Object { $_.DisplayName -match 'Smatchet' }
            if ($hit) { $found = $true; Write-Host "uninstall entry: $($hit.DisplayName) @ $($hit.UninstallString)" }
          }
          if (-not $found) { Write-Error "No Smatchet uninstall registration found after install."; exit 1 }

      - name: Upload x64 installer (for inspection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smatchet-x64-installer-${{ github.run_id }}
          path: out/x64-installer/assets/*windows-setup.exe
          if-no-files-found: ignore

  windows-msvc-light:
    name: Windows + MSVC (Smatchet light — AI/Whisper/MCP off)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.android_only != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
