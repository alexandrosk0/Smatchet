name: Sanitizer nightly

# Nightly ASan + UBSan + ctest on develop (plan:
# gate-enforcement-hardening § Slice 4). NOT a per-PR required
# check — per-PR ASan was rejected during grill as too slow for a solo project.
# The gate is "last nightly was clean"; a failure auto-opens a `bug` issue.
# Trade-off (accepted): a UB regression can sit up to ~24 h before this catches
# it; agent-side debug-detective sanitizer runs are the primary line.
#
# Uses ninja-clang-asan — the only preset delivering ASan AND UBSan
# (ninja-msvc-asan is ASan-only; MSVC lacks UBSan). It compiles with clang-cl,
# which needs both the MSVC environment and LLVM on PATH (both present on the
# windows-2022 image).

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  workflow_dispatch: {}    # manual trigger for verification

permissions:
  contents: read
  issues: write

concurrency:
  group: sanitizer-nightly
  cancel-in-progress: false

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sanitizer-nightly:
    name: Sanitizer nightly (Clang ASan+UBSan)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: develop
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Put LLVM (clang-cl) on PATH
        shell: bash
        run: |
          # windows-2022 ships LLVM at C:\Program Files\LLVM; ensure clang-cl is
          # reachable for the ninja-clang-asan preset.
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"

      - name: Verify clang-cl
        shell: bash
        run: clang-cl --version

      - name: Cache FetchContent _deps (clang-asan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # FETCHCONTENT_BASE_DIR defaults to .fetchcontent-src (CMakeLists.txt:469),
          # NOT build/ninja-clang-asan/_deps — the old path cached nothing and every
          # nightly cold-fetched all deps (ci-workflows-04; same fix coverage.yml
          # already applied at its line 145).
          path: |
            .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-clang-asan-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-clang-asan
        run: cmake --preset ninja-clang-asan -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_LUA_AUTOMATION=OFF

      - name: Build (Clang ASan+UBSan)
        shell: bash
        # Tee the build output so the auto-Issue step can tell a COMPILE-phase
        # failure (a build break) apart from a sanitizer FINDING at test time —
        # the two want different Issue titles/labels. pipefail keeps the real
        # cmake exit code despite the tee.
        run: |
          set -o pipefail
          cmake --build --preset ninja-clang-asan 2>&1 | tee build-clang-asan.log

      - name: Run ctest under ASan+UBSan
        working-directory: build/ninja-clang-asan
        run: ctest --output-on-failure

      - name: Surface sanitizer report in job summary
        if: failure()
        shell: bash
        run: |
          echo "## Sanitizer nightly failure (Clang ASan+UBSan)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          log=build/ninja-clang-asan/Testing/Temporary/LastTest.log
          if [ -f "$log" ]; then
            grep -A 30 -E 'ERROR: AddressSanitizer|runtime error:|UndefinedBehaviorSanitizer' "$log" \
              | head -120 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update bug issue on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Distinguish a COMPILE-phase break (the build never produced an exe to
          # sanitize) from a genuine sanitizer FINDING at test time. A build break
          # is NOT a sanitizer regression — mislabeling it sends a build-fix to the
          # wrong owner and pollutes the sanitizer-finding history. The build step
          # tees its output to build-clang-asan.log; these markers are emitted by
          # CMake/Ninja/Clang on a compile failure (and never by an ASan/UBSan
          # runtime report). NOTE: match only Ninja's FAILURE markers — `FAILED:`
          # and `ninja: build stopped` appear ONLY on a compile break, whereas
          # `Building CXX object` prints on every SUCCESSFUL TU too, so matching it
          # would false-positive a test-time sanitizer finding as a build break.
          build_log="build-clang-asan.log"
          is_compile_fail=0
          if [ -f "$build_log" ] && \
             grep -qE '^FAILED:|ninja: build stopped' "$build_log"; then
            is_compile_fail=1
          fi
          if [ "$is_compile_fail" = "1" ]; then
            title="Sanitizer nightly BUILD BREAK (compile failure, not a sanitizer finding)"
            label="build-break"
            body="The nightly Clang ASan+UBSan job on \`develop\` failed during the
          COMPILE phase — the build never produced an instrumented binary, so this
          is a BUILD BREAK, not a sanitizer finding.

          Run: ${RUN_URL}

          See the build log (\`build-clang-asan.log\`) in the run for the failing TU.
          Route to build-doctor, not a sanitizer-finding owner."
          else
            title="Sanitizer nightly failed (ASan+UBSan)"
            label="bug"
            body="The nightly Clang ASan+UBSan build/test on \`develop\` failed.

          Run: ${RUN_URL}

          See the job summary for the AddressSanitizer / UBSan report. This is the
          safety-net gate from gate-enforcement-hardening § Slice 4 —
          a sanitizer regression has landed on develop."
          fi
          # De-dup: reuse the single open issue with this exact title if present.
          existing=$(gh issue list --state open --label "$label" --search "$title in:title" \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "Recurred: ${RUN_URL}" || true
          else
            gh issue create --title "$title" --label "$label" --body "$body" || true
          fi
