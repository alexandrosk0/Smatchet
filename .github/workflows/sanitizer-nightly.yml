name: Sanitizer nightly

# Nightly sanitizer run on develop (plan: gate-enforcement-hardening § Slice 4).
# The per-PR sanitizer checks in build-and-test.yml run only on PRs that touch
# Core or plugin C++ (and in the merge queue); this workflow covers whatever
# reached develop without them. The gate is "last nightly was clean"; a failure
# auto-opens an issue. Trade-off (accepted): a regression can sit up to ~24 h
# before this catches it.
#
# Two jobs, because as configured today no one toolchain does both things on
# Windows:
#
#   sanitizer-nightly      ninja-clang-asan (clang-cl). Build only — the Clang
#                          warning set over the Whisper-off / Lua-off feature
#                          shape, app instrumented. It executes nothing.
#   sanitizer-nightly-rig  ninja-msvc-asan (cl.exe). Builds the SmatchetTests
#                          doctest rig instrumented with ASan and RUNS it. This
#                          is the job that executes code under a sanitizer.
#
# Why the rig does not run in the clang job: with the flags
# cmake/Sanitizers.cmake passes today, an exe instrumented by clang-cl does not
# survive every C++ exception path against the MSVC runtime — a rethrow caught
# in the same function aborts inside VCRUNTIME140.dll, and the instrumented rig
# dies seconds in with an execute fault inside MSVCP140.dll. One codegen flag
# cures the small reproduction (see the backlog entry below); until that is
# proven on the whole rig, the rig runs under cl.exe's ASan, which has no such
# problem — the per-PR "Sanitizer (ASAN via MSVC)" job runs it the same way.
#
# What is sanitized: ASan only, in both jobs. MSVC has no UBSan, and clang-cl is
# an MSVC-style driver, so cmake/Sanitizers.cmake takes its MSVC branch
# (/fsanitize=address) for it too, whatever the preset and job names say.
# Both points are tracked in
# docs/self-improvement/categories/infra/2026-10-03-clang-cl-sanitizer-lanes-apply-asan-only.md.
#
# A lane like this goes hollow quietly: a `ctest` over a configure that
# registered no test prints "No tests were found!!!" and exits 0 — a green run
# that executed nothing. The rig job therefore asserts what it claims: the built
# rig must import the ASan runtime, and its own summary must report at least one
# test case, or the job fails.

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  workflow_dispatch: {}    # manual trigger; from a feature branch it builds that branch

permissions:
  contents: read
  issues: write

# Per ref: a verification dispatch from a feature branch must not queue behind,
# or displace, the scheduled develop run. GitHub keeps one pending run per group
# and a newer one cancels it, and a cancelled nightly files no Issue.
concurrency:
  group: sanitizer-nightly-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sanitizer-nightly:
    name: Sanitizer nightly (Clang ASan+UBSan)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # No `ref:` — default checkout builds the right tree for both triggers: the
      # default branch (develop) on schedule, the dispatched branch on
      # workflow_dispatch. Pinning develop would make a dispatch from a feature
      # branch build develop's sources under that branch's workflow file, so a
      # change to anything this workflow builds could not be verified before it
      # merged.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Put LLVM (clang-cl) on PATH
        shell: bash
        run: |
          # windows-2022 ships LLVM at C:\Program Files\LLVM; ensure clang-cl is
          # reachable for the ninja-clang-asan preset.
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"

      - name: Verify clang-cl
        shell: bash
        run: clang-cl --version

      - name: Cache FetchContent _deps (clang-asan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # FETCHCONTENT_BASE_DIR defaults to .fetchcontent-src (CMakeLists.txt:469),
          # NOT build/ninja-clang-asan/_deps — the old path cached nothing and every
          # nightly cold-fetched all deps (ci-workflows-04; same fix coverage.yml
          # already applied at its line 145).
          path: |
            .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-clang-asan-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-clang-asan
        run: cmake --preset ninja-clang-asan -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_LUA_AUTOMATION=OFF

      - name: Build (Clang ASan+UBSan)
        shell: bash
        # Tee the build output so the auto-Issue step can tell a COMPILE-phase
        # failure (a build break) apart from a failure outside compilation —
        # the two want different Issue titles. pipefail keeps the real cmake
        # exit code despite the tee.
        run: |
          set -o pipefail
          cmake --build --preset ninja-clang-asan 2>&1 | tee build-clang-asan.log

      # No test step here on purpose: this job builds, the rig job runs (see the
      # header). A bare `ctest` in this build directory finds no test and exits 0.

      # Only a run on develop files an Issue. A workflow_dispatch from a feature
      # branch is someone verifying a change — its failures are theirs to read in
      # the run, not a regression on develop.
      - name: Open or update issue on failure
        if: failure() && github.ref == 'refs/heads/develop'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # This job only builds, so it has two ways to fail: the compile, or
          # something outside it (checkout, toolchain setup, configure). NOTE:
          # match only Ninja's FAILURE markers — `FAILED:` and `ninja: build
          # stopped` appear ONLY on a compile break, whereas `Building CXX object`
          # prints on every SUCCESSFUL TU too.
          build_log="build-clang-asan.log"
          if [ -f "$build_log" ] && \
             grep -qE '^FAILED:|ninja: build stopped' "$build_log"; then
            title="Sanitizer nightly BUILD BREAK (ninja-clang-asan compile failure, not a sanitizer finding)"
            body="The nightly clang-cl build on \`develop\` (job \`sanitizer-nightly\`,
          preset \`ninja-clang-asan\`) failed during the COMPILE phase. This is a
          BUILD BREAK, not a sanitizer finding.

          Run: ${RUN_URL}

          See the build log (\`build-clang-asan.log\`) in the run for the failing TU.
          Route to build-doctor, not a sanitizer-finding owner."
          else
            title="Sanitizer nightly HARNESS BREAK (ninja-clang-asan job failed outside the compile, not a sanitizer finding)"
            body="The nightly clang-cl build on \`develop\` (job \`sanitizer-nightly\`,
          preset \`ninja-clang-asan\`) failed before or outside the compile — checkout,
          toolchain setup or configure. This is a broken harness, not a sanitizer
          finding.

          Run: ${RUN_URL}

          Route to build-doctor, not a sanitizer-finding owner."
          fi
          label="build-break"
          # De-dup: reuse the single open issue with this exact title if present.
          existing=$(gh issue list --state open --label "$label" --search "$title in:title" \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "Recurred: ${RUN_URL}" || true
          else
            gh issue create --title "$title" --label "$label" --body "$body" || true
          fi

  sanitizer-nightly-rig:
    name: Sanitizer nightly (MSVC ASan, instrumented rig)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache FetchContent _deps (msvc-asan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-asan-nightly-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # The ninja-msvc-asan preset turns on SMATCHET_BUILD_TESTS and
      # SMATCHET_SANITIZE_TESTS itself, so the rig is built and instrumented with
      # /fsanitize=address; its build preset names SmatchetTests as a target. Same
      # feature shape as the per-PR "Sanitizer (ASAN via MSVC)" job.
      - name: Configure ninja-msvc-asan
        run: cmake --preset ninja-msvc-asan -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_LUA_AUTOMATION=OFF

      - name: Build (MSVC ASan)
        shell: bash
        # Teed for the auto-Issue step, as in the clang job.
        run: |
          set -o pipefail
          cmake --build --preset ninja-msvc-asan 2>&1 | tee build-msvc-asan.log

      - name: Check the rig is instrumented
        shell: bash
        run: |
          # An instrumented exe imports the ASan runtime DLL by name. If the rig does
          # not, the sanitize knob was lost somewhere and the run below would still
          # go green — on an uninstrumented rig, proving nothing.
          rig=build/ninja-msvc-asan/tests/SmatchetTests.exe
          if ! grep -a -q 'clang_rt\.asan' "$rig"; then
            echo "::error::$rig does not import the ASan runtime — the doctest rig is not instrumented."
            exit 1
          fi

      # The rig is run directly rather than through ctest, as the per-PR job does:
      # the exe is the instrumented surface, and its own output is what the
      # assertions below read. abort_on_error=0 so a stray abort() surfaces with a
      # stack, not an opaque SIGABRT.
      #
      # The step has its own timeout because a direct run has none of ctest's: a
      # deadlocked rig would otherwise sit until the job-level timeout, which
      # CANCELS the job — and a cancelled job files no Issue. A step timeout is a
      # failure. The rig takes about six minutes.
      - name: Run the instrumented doctest rig (ASan)
        shell: bash
        timeout-minutes: 20
        working-directory: build/ninja-msvc-asan
        env:
          ASAN_OPTIONS: abort_on_error=0
        run: |
          set -o pipefail
          ./tests/SmatchetTests.exe 2>&1 | tee ../../rig-msvc-asan.log
          # A run that reports no test case is a failure, never a pass.
          if ! grep -qE '^\[doctest\] test cases: +[1-9]' ../../rig-msvc-asan.log; then
            echo "::error::the doctest rig exited 0 without reporting a single test case."
            exit 1
          fi

      - name: Surface sanitizer report in job summary
        if: failure()
        shell: bash
        run: |
          echo "## Sanitizer nightly failure (MSVC ASan, instrumented rig)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f rig-msvc-asan.log ]; then
            grep -a -A 30 'ERROR: AddressSanitizer' rig-msvc-asan.log \
              | head -120 >> "$GITHUB_STEP_SUMMARY" || true
            grep -a -E '^\[doctest\] (test cases|assertions):' rig-msvc-asan.log \
              >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Only a run on develop files an Issue (see the clang job).
      - name: Open or update issue on failure
        if: failure() && github.ref == 'refs/heads/develop'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Four ways this job fails, and they want different owners:
          #   compile failure        the build never produced a rig        (BUILD BREAK)
          #   ASan report            a memory-safety finding               (the lane's purpose)
          #   a test failed          doctest reached its summary, no report (TEST FAILURE)
          #   none of the above      the rig never reached a verdict        (HARNESS BREAK)
          # Match only Ninja's FAILURE markers for the compile (see the clang job).
          build_log="build-msvc-asan.log"
          rig_log="rig-msvc-asan.log"
          if [ -f "$build_log" ] && \
             grep -qE '^FAILED:|ninja: build stopped' "$build_log"; then
            title="Sanitizer nightly BUILD BREAK (ninja-msvc-asan compile failure, not a sanitizer finding)"
            label="build-break"
            body="The nightly MSVC ASan build on \`develop\` (job \`sanitizer-nightly-rig\`,
          preset \`ninja-msvc-asan\`) failed during the COMPILE phase — it never
          produced an instrumented rig, so this is a BUILD BREAK, not a sanitizer
          finding.

          Run: ${RUN_URL}

          See the build log (\`build-msvc-asan.log\`) in the run for the failing TU.
          Route to build-doctor, not a sanitizer-finding owner."
          elif grep -a -qs 'ERROR: AddressSanitizer' "$rig_log"; then
            title="Sanitizer nightly failed (MSVC ASan report)"
            label="bug"
            body="The nightly instrumented doctest rig on \`develop\` (job
          \`sanitizer-nightly-rig\`, MSVC ASan) reported an AddressSanitizer error.

          Run: ${RUN_URL}

          See the job summary for the report. This is the safety-net gate from
          gate-enforcement-hardening § Slice 4 — a sanitizer regression has landed
          on develop."
          elif grep -a -qsE '^\[doctest\] test cases: +[1-9]' "$rig_log"; then
            title="Sanitizer nightly TEST FAILURE (no sanitizer report)"
            label="bug"
            body="A test failed in the nightly instrumented doctest rig on \`develop\`
          (job \`sanitizer-nightly-rig\`, MSVC ASan), and the output carries no
          AddressSanitizer report. Read it as a plain test failure under the
          sanitizer build (an assertion, a wall-clock budget, or a crash doctest
          caught and reported), not as a memory-safety regression, unless the log
          says otherwise.

          Run: ${RUN_URL}"
          else
            title="Sanitizer nightly HARNESS BREAK (the doctest rig reached no verdict, not a sanitizer finding)"
            label="build-break"
            body="The nightly instrumented doctest rig on \`develop\` (job
          \`sanitizer-nightly-rig\`, MSVC ASan) failed without a compile error, an
          AddressSanitizer report or a doctest summary — it never started, was not
          instrumented, ran no test case, or died without a report. This is a broken
          harness until shown otherwise, and the lane proves nothing meanwhile.

          Run: ${RUN_URL}

          Route to build-doctor, not a sanitizer-finding owner."
          fi
          # De-dup: reuse the single open issue with this exact title if present.
          existing=$(gh issue list --state open --label "$label" --search "$title in:title" \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "Recurred: ${RUN_URL}" || true
          else
            gh issue create --title "$title" --label "$label" --body "$body" || true
          fi
