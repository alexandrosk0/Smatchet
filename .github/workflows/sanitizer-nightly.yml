name: Sanitizer nightly

# Nightly sanitizer build + instrumented test run on develop (plan:
# gate-enforcement-hardening § Slice 4). The per-PR sanitizer checks in
# build-and-test.yml run only on PRs that touch Core or plugin C++ (and in the
# merge queue); this lane covers whatever reached develop without them, and is
# the one lane that runs the doctest rig instrumented by clang. The gate is
# "last nightly was clean"; a failure auto-opens an issue. Trade-off (accepted):
# a regression can sit up to ~24 h before this catches it.
#
# Uses ninja-clang-asan. It compiles with clang-cl, which needs both the MSVC
# environment and LLVM on PATH (both present on the windows-2022 image).
#
# What it sanitizes: ASan only. clang-cl is an MSVC-style driver, so
# cmake/Sanitizers.cmake takes its MSVC branch (/fsanitize=address) — UBSan is
# NOT applied here, whatever the preset and job names say. Tracked in
# docs/self-improvement/categories/infra/2026-10-03-clang-cl-sanitizer-lanes-apply-asan-only.md.
#
# The lane builds AND runs the SmatchetTests doctest rig, instrumented. A
# configure without SMATCHET_BUILD_TESTS registers no test at all: `ctest` then
# prints "No tests were found!!!" and exits 0 — a green run that executed
# nothing. Three things keep the lane from going hollow that way: tests are
# switched on at configure, the rig is a named build target, and ctest runs with
# --no-tests=error. Two assertions cover the quieter ways: the built rig must
# import the ASan runtime, and smatchet_tests itself must appear in ctest's
# output.

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily
  workflow_dispatch: {}    # manual trigger; from a feature branch it builds that branch

permissions:
  contents: read
  issues: write

# Per ref: a verification dispatch from a feature branch must not queue behind,
# or displace, the scheduled develop run. GitHub keeps one pending run per group
# and a newer one cancels it, and a cancelled nightly files no Issue.
concurrency:
  group: sanitizer-nightly-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sanitizer-nightly:
    name: Sanitizer nightly (Clang ASan+UBSan)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # No `ref:` — default checkout builds the right tree for both triggers: the
      # default branch (develop) on schedule, the dispatched branch on
      # workflow_dispatch. Pinning develop would make a dispatch from a feature
      # branch build develop's sources under that branch's workflow file, so a
      # change to the tests or CMake this lane builds could not be verified before
      # it merged.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Put LLVM (clang-cl) on PATH
        shell: bash
        run: |
          # windows-2022 ships LLVM at C:\Program Files\LLVM; ensure clang-cl is
          # reachable for the ninja-clang-asan preset.
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"

      - name: Verify clang-cl
        shell: bash
        run: clang-cl --version

      - name: Cache FetchContent _deps (clang-asan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # FETCHCONTENT_BASE_DIR defaults to .fetchcontent-src (CMakeLists.txt:469),
          # NOT build/ninja-clang-asan/_deps — the old path cached nothing and every
          # nightly cold-fetched all deps (ci-workflows-04; same fix coverage.yml
          # already applied at its line 145).
          path: |
            .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-clang-asan-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      # Tests ON and the rig instrumented. SMATCHET_BUILD_TESTS registers the ctest
      # targets (the preset alone registers none). SMATCHET_SANITIZE_TESTS applies
      # the sanitizer to SmatchetTests itself: the rig compiles the Source/Core TUs
      # it covers into its own exe, so without the knob it runs uninstrumented and
      # a clean run proves nothing about them.
      - name: Configure ninja-clang-asan
        run: cmake --preset ninja-clang-asan -DSMATCHET_WITH_WHISPER=OFF -DSMATCHET_WITH_LUA_AUTOMATION=OFF -DSMATCHET_BUILD_TESTS=ON -DSMATCHET_SANITIZE_TESTS=ON

      - name: Build (Clang ASan+UBSan)
        shell: bash
        # Tee the build output so the auto-Issue step can tell a COMPILE-phase
        # failure (a build break) apart from a sanitizer FINDING at test time —
        # the two want different Issue titles/labels. pipefail keeps the real
        # cmake exit code despite the tee.
        #
        # SmatchetTests is named explicitly: the build preset's own target list is
        # SmatchetStandalone alone, so the rig would otherwise never be built.
        run: |
          set -o pipefail
          cmake --build --preset ninja-clang-asan --target SmatchetStandalone SmatchetTests 2>&1 | tee build-clang-asan.log

      - name: Check the rig is instrumented and put the clang ASan runtime on PATH
        shell: bash
        run: |
          # An instrumented exe imports the ASan runtime DLL by name. If the rig does
          # not, SMATCHET_SANITIZE_TESTS was lost somewhere and every later step would
          # still go green on an uninstrumented run.
          rig=build/ninja-clang-asan/tests/SmatchetTests.exe
          if ! grep -a -q 'clang_rt.asan_dynamic' "$rig"; then
            echo "::error::$rig does not import the ASan runtime — the doctest rig is not instrumented."
            exit 1
          fi
          # The instrumented rig imports clang_rt.asan_dynamic-*.dll. That DLL sits in
          # clang's resource dir beside the import lib, not in LLVM\bin, and the MSVC
          # environment carries a same-named DLL from a different toolchain. Take the
          # directory of the exact import lib CMake linked (cmake/Sanitizers.cmake
          # caches it as _clang_asan_lib) and put it first on PATH.
          lib="$(sed -n 's/^_clang_asan_lib:FILEPATH=//p' build/ninja-clang-asan/CMakeCache.txt | tr -d '\r')"
          dir="$(dirname "$lib")"
          if [ -z "$lib" ] || ! ls "$dir"/clang_rt.asan_dynamic-*.dll >/dev/null 2>&1; then
            echo "::error::clang ASan runtime DLL not found beside '${lib:-<_clang_asan_lib missing from CMakeCache.txt>}' — the instrumented test rig cannot start."
            exit 1
          fi
          echo "ASan runtime dir: $dir"
          cygpath -w "$dir" >> "$GITHUB_PATH"

      - name: Run ctest under ASan+UBSan
        shell: bash
        working-directory: build/ninja-clang-asan
        # --no-tests=error: an empty test list is a failure, never a pass. The
        # output is teed so the auto-Issue step can tell "nothing ran" apart from a
        # sanitizer finding.
        run: |
          set -o pipefail
          ctest --output-on-failure --no-tests=error 2>&1 | tee ../../ctest-clang-asan.log
          # The rig is the point of this lane. The cmake-only android probes are
          # registered alongside it and must not satisfy the lane on their own.
          if ! grep -qE 'Test +#[0-9]+: smatchet_tests ' ../../ctest-clang-asan.log; then
            echo "::error::ctest ran, but not smatchet_tests — the doctest rig did not execute."
            exit 1
          fi

      - name: Surface sanitizer report in job summary
        if: failure()
        shell: bash
        run: |
          echo "## Sanitizer nightly failure (Clang ASan+UBSan)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          log=build/ninja-clang-asan/Testing/Temporary/LastTest.log
          if [ -f "$log" ]; then
            grep -A 30 -E 'ERROR: AddressSanitizer|runtime error:|UndefinedBehaviorSanitizer' "$log" \
              | head -120 >> "$GITHUB_STEP_SUMMARY" || true
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Only a run on develop files an Issue. A workflow_dispatch from a feature
      # branch is someone verifying a change — its failures are theirs to read in
      # the run, not a regression on develop.
      - name: Open or update bug issue on failure
        if: failure() && github.ref == 'refs/heads/develop'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Distinguish a COMPILE-phase break (the build never produced an exe to
          # sanitize) from a genuine sanitizer FINDING at test time. A build break
          # is NOT a sanitizer regression — mislabeling it sends a build-fix to the
          # wrong owner and pollutes the sanitizer-finding history. The build step
          # tees its output to build-clang-asan.log; these markers are emitted by
          # CMake/Ninja/Clang on a compile failure (and never by an ASan/UBSan
          # runtime report). NOTE: match only Ninja's FAILURE markers — `FAILED:`
          # and `ninja: build stopped` appear ONLY on a compile break, whereas
          # `Building CXX object` prints on every SUCCESSFUL TU too, so matching it
          # would false-positive a test-time sanitizer finding as a build break.
          build_log="build-clang-asan.log"
          is_compile_fail=0
          if [ -f "$build_log" ] && \
             grep -qE '^FAILED:|ninja: build stopped' "$build_log"; then
            is_compile_fail=1
          fi
          # A run in which the doctest rig never executed is a broken harness, not a
          # finding: ctest never started (configure, or the instrumentation/runtime
          # step, failed first), it had nothing to run, or it ran without the rig.
          ctest_log="ctest-clang-asan.log"
          is_harness_break=0
          if ! grep -qsE 'Test +#[0-9]+: smatchet_tests ' "$ctest_log"; then
            is_harness_break=1
          fi
          # A failure with no AddressSanitizer report in the output is a test that
          # failed on its own terms (an assertion, a wall-clock budget, a timeout) —
          # worth an Issue, but not a memory-safety regression.
          has_asan_report=0
          if grep -qs 'ERROR: AddressSanitizer' "$ctest_log"; then
            has_asan_report=1
          fi
          if [ "$is_compile_fail" = "1" ]; then
            title="Sanitizer nightly BUILD BREAK (compile failure, not a sanitizer finding)"
            label="build-break"
            body="The nightly Clang ASan+UBSan job on \`develop\` failed during the
          COMPILE phase — the build never produced an instrumented binary, so this
          is a BUILD BREAK, not a sanitizer finding.

          Run: ${RUN_URL}

          See the build log (\`build-clang-asan.log\`) in the run for the failing TU.
          Route to build-doctor, not a sanitizer-finding owner."
          elif [ "$is_harness_break" = "1" ]; then
            title="Sanitizer nightly HARNESS BREAK (the doctest rig did not run, not a sanitizer finding)"
            label="build-break"
            body="The nightly sanitizer job on \`develop\` failed without running the
          doctest rig — it stopped before ctest started, ctest found nothing to run,
          or ctest ran without smatchet_tests. This is a broken harness, not a
          sanitizer finding, and the lane proves nothing until it is fixed.

          Run: ${RUN_URL}

          Route to build-doctor, not a sanitizer-finding owner."
          elif [ "$has_asan_report" = "0" ]; then
            title="Sanitizer nightly TEST FAILURE (no sanitizer report)"
            label="bug"
            body="A test failed in the nightly instrumented run on \`develop\`, and the
          output carries no AddressSanitizer report. Read it as a plain test failure
          under the sanitizer build (an assertion, a wall-clock budget, a timeout),
          not as a memory-safety regression, unless the log says otherwise.

          Run: ${RUN_URL}"
          else
            title="Sanitizer nightly failed (ASan+UBSan)"
            label="bug"
            body="The nightly Clang ASan+UBSan build/test on \`develop\` failed.

          Run: ${RUN_URL}

          See the job summary for the AddressSanitizer / UBSan report. This is the
          safety-net gate from gate-enforcement-hardening § Slice 4 —
          a sanitizer regression has landed on develop."
          fi
          # De-dup: reuse the single open issue with this exact title if present.
          existing=$(gh issue list --state open --label "$label" --search "$title in:title" \
                       --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body "Recurred: ${RUN_URL}" || true
          else
            gh issue create --title "$title" --label "$label" --body "$body" || true
          fi
