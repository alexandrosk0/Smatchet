name: Release

# Publishes a signed Windows release (standalone + light standalone + Inno
# installer + source zip) to GitHub Releases whenever a `v*.*.*` tag is
# pushed, driving scripts/publish/release-github.sh — previously a
# maintainer-only, local-Windows-only script (see scripts/publish/SIGNING.md,
# scripts/publish/INSTALLER_SMOKE_TEST.md). The Windows-x64-installer-smoke
# job in build-and-test.yml already builds+installs this pipeline UNSIGNED on
# every develop push; this workflow is the signed, published counterpart that
# only runs against an actual release tag.
#
# Skips the Unreal plugin package and Fab bundle (--skip-unreal --skip-fab-bundle):
# both require an Unreal Engine install that hosted runners don't have. Ship
# those manually per scripts/publish/INSTALL_UNREAL_PLUGIN.md until UE tooling
# lands in CI.
#
# release-github.sh refuses to --publish a tag that doesn't match the
# CMakeLists.txt SmatchetApp VERSION (smatchet_version_tag) — bump the
# version with scripts/publish/sync-release-version.sh and commit it BEFORE
# tagging, or this workflow fails fast instead of publishing a mismatched
# release.

permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the triggering ref for a tag push; required for manual runs)"
        required: false
        default: ""
      publish:
        description: "Publish to GitHub Releases (false = build + sign only, upload artifacts for inspection)"
        type: boolean
        required: false
        default: true
      sign:
        description: "Sign the standalone + installer (SIGNING.md). Publishing requires this unless you know what you're doing."
        type: boolean
        required: false
        default: true
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        required: false
        default: false
      allow_unsigned_publish:
        description: "DANGER: publish WITHOUT signing. Users get SmartScreen warnings and the in-app updater refuses unsigned installers. Only for a bootstrap release before a certificate exists."
        type: boolean
        required: false
        default: false
      notes:
        description: "Release notes body. Leave empty to auto-generate from commits since the previous release — but note that the FIRST release has no previous release to diff against, so auto-generation spans the whole history and GitHub rejects it with 'body is too long (maximum is 125000 characters)'. Supply a short body for a bootstrap release."
        required: false
        default: ""
      release_name:
        description: "Release title. Leave empty for \"Smatchet <tag>\" — without a title GitHub falls back to displaying the bare tag."
        required: false
        default: ""

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish Windows release
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Resolve release parameters
        id: params
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
          INPUT_SIGN: ${{ github.event.inputs.sign }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_ALLOW_UNSIGNED: ${{ github.event.inputs.allow_unsigned_publish }}
        run: |
          $tag = $env:INPUT_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:REF_NAME }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error "No tag resolved — pass 'tag' on workflow_dispatch or trigger via a tag push."
            exit 1
          }
          # workflow_dispatch inputs arrive as strings; a tag push has no
          # inputs context at all, so default every switch to its tag-push
          # behavior (publish+sign, not draft/prerelease) when unset.
          $publish = $env:INPUT_PUBLISH -ne 'false'
          $sign = $env:INPUT_SIGN -ne 'false'
          $draft = $env:INPUT_DRAFT -eq 'true'
          $prerelease = $env:INPUT_PRERELEASE -eq 'true'
          # Unsigned publish is opt-in and manual-dispatch only: a tag push has
          # no inputs context, so INPUT_ALLOW_UNSIGNED is empty there and the
          # signed-publish requirement below still holds for every tag release.
          $allowUnsigned = $env:INPUT_ALLOW_UNSIGNED -eq 'true'
          if ($publish -and -not $sign -and -not $allowUnsigned) {
            Write-Error "publish=true requires sign=true (SIGNING.md: unsigned public releases are refused). To knowingly ship an unsigned bootstrap release, also set allow_unsigned_publish=true."
            exit 1
          }
          if ($publish -and -not $sign) {
            Write-Warning "Publishing UNSIGNED artifacts: users will see SmartScreen warnings and the in-app updater will REFUSE this installer."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "sign=$($sign.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "draft=$($draft.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "allow_unsigned=$($allowUnsigned.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag publish=$publish sign=$sign draft=$draft prerelease=$prerelease"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: ${{ steps.params.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (msvc-x64-release)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-msvc-x64-release-${{ steps.params.outputs.tag }}
          restore-keys: |
            ${{ runner.os }}-sccache-msvc-x64-release-
            ${{ runner.os }}-sccache-msvc-x64-installer-

      - name: Cache FetchContent _deps (msvc-x64-release)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Fetch Font Awesome 6 Solid TTF (pinned + checksum-verified)
        uses: ./.github/actions/fetch-fontawesome

      - name: Install Inno Setup 6 (ISCC.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { Write-Host "iscc: $($iscc.Source)" }
          else { Write-Host "::warning::ISCC.exe not on PATH after choco; release-github.sh also searches fixed install dirs + the uninstall registry." }

      - name: Decode signing certificate
        if: ${{ steps.params.outputs.sign == 'true' }}
        shell: pwsh
        env:
          SMATCHET_SIGN_PFX_BASE64: ${{ secrets.SMATCHET_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SMATCHET_SIGN_PFX_BASE64)) {
            Write-Error "sign=true but the SMATCHET_SIGN_PFX_BASE64 repository secret is not set. See scripts/publish/SIGNING.md — base64-encode the signing PFX into that secret, and the passphrase into SMATCHET_SIGN_PFX_PASSWORD."
            exit 1
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "smatchet-signing.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:SMATCHET_SIGN_PFX_BASE64))
          "SMATCHET_SIGN_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV

      - name: Build release bundle (release-github.sh)
        shell: bash
        env:
          SMATCHET_SIGN_PFX_PASSWORD: ${{ secrets.SMATCHET_SIGN_PFX_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          PARAM_TAG: ${{ steps.params.outputs.tag }}
          PARAM_SIGN: ${{ steps.params.outputs.sign }}
          PARAM_PUBLISH: ${{ steps.params.outputs.publish }}
          PARAM_DRAFT: ${{ steps.params.outputs.draft }}
          PARAM_PRERELEASE: ${{ steps.params.outputs.prerelease }}
          PARAM_ALLOW_UNSIGNED: ${{ steps.params.outputs.allow_unsigned }}
          # Passed straight through rather than via GITHUB_OUTPUT: notes are
          # free text and may be multi-line, which needs heredoc delimiters to
          # survive a step output. Read via $env: below, never interpolated
          # into the script body.
          PARAM_NOTES: ${{ github.event.inputs.notes }}
          PARAM_RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: |
          # Belt-and-braces tag guard for --publish runs. The "Tag not found
          # locally" failures this originally chased were NOT a missing ref: the
          # publisher's probes read a checked-command wrapper's return value,
          # which mixed the command's stdout in with the exit code, so the
          # checks inverted whenever the tag actually existed (fixed in that
          # script). Keeping an explicit HEAD-vs-tag check here is still worth
          # it: `git fetch --force` refreshes a tag ref without moving HEAD, so
          # this is the one place that can catch a checkout/tag mismatch before
          # we publish artifacts built from the wrong commit. Only --publish
          # cares, so dry runs skip it rather than fail on a transient fetch.
          if [ "${PARAM_PUBLISH:-}" = "true" ]; then
            if ! git fetch origin "+refs/tags/${PARAM_TAG}:refs/tags/${PARAM_TAG}" --force; then
              echo "Failed to fetch tag '${PARAM_TAG}' from origin before release." >&2
              exit 1
            fi
            # `git fetch --force` updates the local tag ref but does NOT move
            # HEAD or the checked-out working tree, so a re-fetch alone can't
            # actually fix a checkout/tag mismatch — it can only mask it.
            # Verify HEAD and the (peeled) tag commit agree before handing off
            # to --publish, and fail loudly instead of silently publishing
            # against the wrong commit.
            head_commit="$(git rev-parse HEAD)" || head_commit=""
            if [ -z "$head_commit" ]; then
              echo "Could not resolve HEAD to a commit." >&2
              exit 1
            fi
            tag_commit="$(git rev-parse "refs/tags/${PARAM_TAG}^{commit}")" || tag_commit=""
            if [ -z "$tag_commit" ]; then
              echo "Could not resolve tag 'refs/tags/${PARAM_TAG}' to a commit after fetch." >&2
              exit 1
            fi
            if [ "$head_commit" != "$tag_commit" ]; then
              echo "Checked-out HEAD ($head_commit) does not match tag '${PARAM_TAG}' ($tag_commit) after re-fetch; refusing to publish against a possibly wrong commit." >&2
              exit 1
            fi
          fi
          # A bash array, one element per token: never a single string run through
          # word-splitting. --notes and --release-name carry free text with spaces
          # (and possibly newlines), so a flat string would split them into bogus
          # positional arguments.
          release_args=(
            --tag "$PARAM_TAG"
            --skip-unreal
            --skip-fab-bundle
            --out-dir out/release
            # Matches build-and-test.yml's "Windows x64 installer smoke" job:
            # the Font Awesome fetch step dirties the worktree, so a clean
            # release build off a fresh checkout still needs --allow-dirty.
            --allow-dirty
          )
          if [ "${PARAM_SIGN:-}" = "true" ]; then release_args+=(--sign); fi
          # With no --notes, release-github.sh falls back to `gh --generate-notes`,
          # which diffs against the previous release. The FIRST release has no
          # previous release, so generation spans the entire history and GitHub
          # rejects the create with:
          #   HTTP 422 Validation Failed — body is too long (maximum is 125000 characters)
          # Supplying notes skips generation entirely. Later releases can leave
          # this empty: once a release exists, the generated diff is bounded.
          if [ -n "$(printf '%s' "${PARAM_NOTES:-}" | tr -d '[:space:]')" ]; then
            release_args+=(--notes "$PARAM_NOTES")
          fi
          # Without a title, GitHub displays the bare tag ("v0.6.8") as the
          # release heading. Default to "Smatchet <tag>" so every release gets a
          # real title with no per-run input, including tag-push runs (which
          # carry no inputs context at all). Only reaches gh on the create path;
          # a --clobber re-upload leaves an existing title untouched.
          release_name="${PARAM_RELEASE_NAME:-}"
          if [ -z "$(printf '%s' "$release_name" | tr -d '[:space:]')" ]; then
            release_name="Smatchet ${PARAM_TAG}"
          fi
          release_args+=(--release-name "$release_name")
          if [ "${PARAM_PUBLISH:-}" = "true" ]; then
            release_args+=(--publish)
            # release-github.sh independently refuses --publish without --sign;
            # forward the same knowing override the workflow already gated on.
            if [ "${PARAM_ALLOW_UNSIGNED:-}" = "true" ]; then release_args+=(--allow-unsigned-publish); fi
            if [ "${PARAM_DRAFT:-}" = "true" ]; then release_args+=(--draft); fi
            if [ "${PARAM_PRERELEASE:-}" = "true" ]; then release_args+=(--prerelease); fi
          fi
          echo "release-github.sh ${release_args[*]}"
          bash scripts/publish/release-github.sh "${release_args[@]}"

      - name: Remove decoded signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:SMATCHET_SIGN_PFX_PATH -and (Test-Path -LiteralPath $env:SMATCHET_SIGN_PFX_PATH)) {
            Remove-Item -LiteralPath $env:SMATCHET_SIGN_PFX_PATH -Force
          }

      - name: Upload release assets (for inspection)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smatchet-release-${{ steps.params.outputs.tag }}
          path: out/release/assets/*
          if-no-files-found: warn
          retention-days: 14
