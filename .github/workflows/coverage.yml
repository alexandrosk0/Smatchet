name: Coverage

# ci-required-context: self-gated
#
# Captures OpenCppCoverage line coverage on every PR. Uploads coverage.xml as a
# workflow artifact.
#
# BLOCKING (graduated 2026-06-04 via docs/plans/shipped/coverage-threshold-graduation.md):
# continue-on-error: false + --threshold 70. The number is the data-chosen
# FLOOR — the first real measurement on the Ui-excluded Source/Core surface was
# 67% (after issue #833 fixed OCC's substring-not-regex --sources bug that had
# made the gate measure 0 lines), so the gate graduates at a stable floor below
# current with a raise-to-70 ramp tracked in docs/self-improvement/categories/test.md.
# Threshold + excluded paths are config-sourced (project.config.json § coverage).
# Below-threshold PRs escape with the `coverage-out-of-band` label (parallel to
# tests-out-of-band). The structural coverage-delta gate (coverage-gate.yml) is
# independent and already hard-blocking.
#
# REQUIRED-CONTEXT SELF-GATE (coverage-required-context, tooling.md 2026-06-11;
# preventing gate from postmortems.md 2026-06-11 PR #1130, #923 option A):
# `Coverage (windows-2022 + OpenCppCoverage)` is promoted to a branch-protection
# REQUIRED context (project.config.json § branch_protection.required_contexts) so
# it binds ALL merge paths, not just the merge-gates poller's non-required-but-
# blocking allow-list (the gap #1130 sailed through via `gh pr merge --auto`).
# A REQUIRED context MUST report on EVERY PR or GitHub deadlocks any PR that
# never produces it (#880/#881/#882 class) — and the merge-gates poller, which
# reads required_contexts from project.config.json directly, blocks the moment
# the context is absent. So the workflow's `pull_request` trigger carries NO
# `paths:` filter (it runs on every PR), and the single `windows-coverage` job
# SELF-GATES internally: a `Detect coverage-relevant changes` step decides
# whether to run the real (40-min) coverage build or no-op green. On a docs-only
# / shell-only PR every heavy step skips and the job completes green — the
# required context is reported exactly once and NEVER fake-greens a real coverage
# failure on a code PR (the detect predicate runs the full gate whenever any
# coverage-relevant path changed). Mirrors doc-validation.yml's `Detect
# doc-relevant changes` + coverage-gate.yml's merge-queue self-gate.

on:
  pull_request:
    branches: [develop]
  # Merge-queue readiness (mirrors coverage-gate.yml / doc-validation.yml): when
  # develop is behind a GitHub merge queue, required checks run on the synthetic
  # `merge_group` ref; a required context that never reports there deadlocks the
  # queue forever. The detect step below self-gates any non-pull_request event to
  # `run=true` (the queued commit's coverage already passed at PR time, so the
  # full gate re-runs green) so the required context reports on the queued merge.
  merge_group:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# sccache (local-dir backend) — docs/plans/ci-build-time-reduction.md Phase 1.
# Local disk (not SCCACHE_GHA_ENABLED) so a GH-cache-service outage can't fail the build.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SCCACHE_DIR: ${{ github.workspace }}\.sccache

jobs:
  windows-coverage:
    name: Coverage (windows-2022 + OpenCppCoverage)
    runs-on: windows-2022
    timeout-minutes: 40
    continue-on-error: false  # BLOCKING — graduated 2026-06-04 (coverage-threshold-graduation)

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # delta gate needs full history for merge-base

      # Self-gate: this required check runs on EVERY PR (no workflow paths filter
      # — see the `on:` header). For a PR that touches no coverage-relevant file
      # the coverage build has nothing to measure, so every heavy step below
      # skips and the job completes green — the `Coverage (windows-2022 +
      # OpenCppCoverage)` required context is still reported (exactly once), which
      # keeps GitHub (and the merge-gates poller) from deadlocking a docs-only /
      # shell-only PR. The detect predicate is intentionally a SUPERSET of the
      # retired `pull_request.paths` allow-list (more inclusive = fail-safe: worst
      # case the coverage build runs when it strictly needn't and passes). It must
      # NEVER fake-green: when any coverage-relevant path changed, run=true and the
      # full --threshold 70 gate runs unchanged. Non-PR events (merge_group)
      # always run=true so the required context reports on the queued merge.
      - name: Detect coverage-relevant changes
        id: detect
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event — running full coverage gate."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" 2>/dev/null || true
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || true)"
          # Mirror the retired pull_request.paths allow-list (Source/Core,
          # Source/Plugins, tests, the CMake build descriptors, this workflow, and
          # the coverage script) MINUS markdown — a .md-only edit under those trees
          # never affects compiled coverage. grep -E over the changed-file list.
          if printf '%s\n' "$changed" \
            | grep -vE '\.md$' \
            | grep -qE '^(Source/Core/|Source/Plugins/|tests/|CMakeLists\.txt$|CMakePresets\.json$|\.github/workflows/coverage\.yml$|scripts/dev/coverage\.sh$|scripts/dev/coverage-perfile-gate\.sh$|tests/bats/coverage_perfile_gate\.bats$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "coverage-relevant changes detected — running full coverage gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no coverage-relevant changes — coverage no-ops (required check reported green)."
          fi

      - name: Setup MSVC dev environment
        if: steps.detect.outputs.run == 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        if: steps.detect.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache sccache objects (coverage)
        if: steps.detect.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-coverage-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-coverage-

      - name: Install OpenCppCoverage
        if: steps.detect.outputs.run == 'true'
        shell: powershell
        run: |
          choco install opencppcoverage -y --no-progress
          echo "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

      - name: Cache FetchContent _deps
        if: steps.detect.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # FETCHCONTENT_BASE_DIR defaults to .fetchcontent-src (CMakeLists.txt:280).
          # The previous path (build/ninja-test-msvc/_deps) was wrong — that dir
          # holds only the subbuild CMakeCache, not the downloaded sources — so
          # every coverage run cold-fetched all deps. Aligned to .fetchcontent-src
          # with a restore-key fallback to the main msvc build cache so a warm
          # build-and-test.yml run can seed this job too.
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-coverage-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-msvc-coverage-
            ${{ runner.os }}-fetchcontent-msvc-
            ${{ runner.os }}-fetchcontent-

      # -DSMATCHET_COVERAGE marks this as the coverage capture build. The shared
      # ninja-test-msvc preset is left untouched (it also drives build-and-test.yml
      # and local iter), so the macro is appended here, scoped to the coverage lane
      # only. Consumed by tests/support/StubAiClient.h to widen the internal
      # cancel-ack budget under OpenCppCoverage's ~10x instrumentation slowdown
      # (the normal build keeps the 100 ms budget). OpenCppCoverage sets no
      # __SANITIZE_ADDRESS__ macro, so the existing ASan guard does not cover it.
      - name: Configure ninja-test-msvc
        if: steps.detect.outputs.run == 'true'
        run: cmake --preset ninja-test-msvc -DCMAKE_CXX_FLAGS=-DSMATCHET_COVERAGE

      - name: Build SmatchetTests + SmatchetLuaTests
        if: steps.detect.outputs.run == 'true'
        run: cmake --build --preset ninja-test-msvc

      - name: Run ctest (sanity — must pass before coverage capture)
        if: steps.detect.outputs.run == 'true'
        working-directory: build/ninja-test-msvc
        run: ctest --output-on-failure

      - name: Report sccache stats
        if: always() && steps.detect.outputs.run == 'true'
        run: sccache --show-stats

      - name: Capture coverage (blocking; --threshold 70)
        if: steps.detect.outputs.run == 'true'
        shell: bash
        env:
          # The label escape documented in this file's header was prose-only
          # until 2026-06-06 (discovered on PR #939: a structural measured-set
          # expansion — newly-linked backend impl TUs entering the denominator
          # — dropped the rate below threshold while absolute coverage rose).
          # Labels come from the event payload, so apply the label THEN re-run.
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          oob=$(printf '%s' "${PR_LABELS:-[]}" | python -c "import json,sys; d=json.load(sys.stdin) or []; print(int(any(l.get('name')=='coverage-out-of-band' for l in d)))")
          if [ "$oob" = "1" ]; then
            if ! bash scripts/dev/coverage.sh --xml-only --threshold 70; then
              echo "::warning::line coverage below threshold — downgraded to WARN by the coverage-out-of-band label. Queue the coverage-recovery follow-up before removing the label."
            fi
          else
            bash scripts/dev/coverage.sh --xml-only --threshold 70
          fi

      # Per-file >=90% floor on the NAMED high-risk units (SSRF endpoint sanitizer,
      # credential redaction, JQL escaper, tracker HTTP pure classifier). Runs on the
      # coverage.xml the step above produced. Fails-OPEN on a missing XML / a unit
      # absent from the build, so it never wedges a docs-only PR or a feature-gated-out
      # unit. A per-unit `coverage-perfile-<unit>-out-of-band` PR label downgrades that
      # unit's below-floor failure to a WARN (parallel to coverage-out-of-band). The
      # named units are already comprehensively tested, so this is GREEN on HEAD.
      - name: Per-file high-risk coverage gate (>=90%)
        if: steps.detect.outputs.run == 'true'
        shell: bash
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          # Map any coverage-perfile-<unit>-out-of-band label onto the gate's env var.
          oob=$(printf '%s' "${PR_LABELS:-[]}" | python -c "import json,sys; d=json.load(sys.stdin) or []; print(','.join(l['name'][len('coverage-perfile-'):-len('-out-of-band')] for l in d if l.get('name','').startswith('coverage-perfile-') and l.get('name','').endswith('-out-of-band')))")
          SMATCHET_PERFILE_OOB="$oob" bash scripts/dev/coverage-perfile-gate.sh --xml coverage/coverage.xml

      - name: Upload coverage.xml artifact
        if: always() && steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: coverage/coverage.xml
          if-no-files-found: warn
