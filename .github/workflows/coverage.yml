name: Coverage (advisory)

# Captures OpenCppCoverage line + branch coverage on every PR touching
# Source/Core/ or tests/. Uploads coverage.xml as a workflow artifact and runs
# in ADVISORY mode (no threshold, continue-on-error) for the first two weeks
# after Phase 9 lands — pattern mirrors the Phase 7 screenshot-diff soak.
#
# Flip continue-on-error → false and pass --threshold 70 to coverage.sh once
# two consecutive weeks of clean runs have built confidence. See
# docs/plans/active/applied/test-suite-expansion-completion.md § Phase 9 + § End-state targets.

on:
  pull_request:
    branches: [develop]
    paths:
      - 'Source/Core/**'
      - 'Source/Plugins/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/coverage.yml'
      - 'scripts/dev/coverage.sh'
      # Markdown is never compiled — exclude the per-subsystem leaf docs now
      # living under Source/Core/src/<ctx>/*.md (and any other .md) so a
      # docs-only change doesn't spin up a coverage build. Negation must follow
      # the positives (GitHub: later matching pattern wins).
      - '!**/*.md'

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# sccache (local-dir backend) — docs/plans/active/ci-build-time-reduction.md Phase 1.
# Local disk (not SCCACHE_GHA_ENABLED) so a GH-cache-service outage can't fail the build.
env:
  SCCACHE_DIR: ${{ github.workspace }}\.sccache

jobs:
  windows-coverage:
    name: Coverage (windows-2022 + OpenCppCoverage)
    runs-on: windows-2022
    timeout-minutes: 40
    continue-on-error: true  # advisory soak until 2026-05-30; flip to false after

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # delta gate needs full history for merge-base

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache objects (coverage)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-coverage-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-coverage-

      - name: Install OpenCppCoverage
        shell: powershell
        run: |
          choco install opencppcoverage -y --no-progress
          echo "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

      - name: Cache FetchContent _deps
        uses: actions/cache@v4
        with:
          path: build/ninja-test-msvc/_deps
          key: ${{ runner.os }}-fetchcontent-msvc-coverage-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-msvc-coverage-
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-test-msvc
        run: cmake --preset ninja-test-msvc

      - name: Build SmatchetTests + SmatchetLuaTests
        run: cmake --build --preset ninja-test-msvc

      - name: Run ctest (sanity — must pass before coverage capture)
        working-directory: build/ninja-test-msvc
        run: ctest --output-on-failure

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      - name: Capture coverage (advisory; --threshold 0)
        shell: bash
        run: bash scripts/dev/coverage.sh --xml-only --threshold 0

      - name: Upload coverage.xml artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: coverage/coverage.xml
          if-no-files-found: warn
