name: Shell lint

# shellcheck gate (test-lint-bash.sh) over scripts/dev/ + agents/scripts/, on
# ubuntu-latest where shellcheck is preinstalled (zero install cost).
#
# Why a dedicated CI job: the same gate runs locally at the pre-push gate
# (scripts/dev/test-all.sh), but it SKIPS silently when shellcheck is not on
# PATH (an optional `npm i -g shellcheck`, per BUILD.md). On any machine without
# it, shell scripts ship unlinted with no backstop. This job is the CI backstop,
# independent of local tooling.
#
# Fail-set: SC2086 / SC2046 / SC2155 (the three that have masked real bugs in
# this repo); everything else is reported at --severity=warning, non-blocking.
#
# NOT path-filtered on purpose: this is a branch-protection REQUIRED check, and
# a path-filtered required check never reports a status on PRs that miss the
# filter — leaving them permanently un-mergeable ("Expected — Waiting"). The job
# is seconds-fast, so running it on every PR is cheap insurance.
#
# The repo's broader 5-rule gate (test-shell-lint.sh) also runs here as a second
# step: deps-preflight / shellcheck (SC2086,2046,2128,2155,2068) / curl -f /
# sha256-after-download / --flag↔--flag=value parity, over the same expanded
# target set (scripts/dev + agents/scripts/{core,project}). Its deps rule was
# hardened so graceful `cmd || fallback` / `if cmd` shapes no longer false-fire,
# which unblocked covering agents/scripts/ (was the deferral noted in #624).

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # Merge-queue readiness (docs/plans/active/build-quality-velocity-hardening.md
  # finding #14 path B): `Shell lint (shellcheck)` is a branch-protection
  # REQUIRED check. When develop is behind a GitHub merge queue, required checks
  # run on the synthetic `merge_group` ref; a required check that never reports
  # there deadlocks the queue forever (#880/#881/#882 class). The two lint steps
  # are not PR-scoped (they lint the working tree, only `git rev-parse
  # --show-toplevel`), so they run + report a real terminal status directly on
  # the queued merge ref — no self-gate needed.
  merge_group:

concurrency:
  group: shell-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  shell-lint:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No history needed (linters only `git rev-parse --show-toplevel`);
          # no later step uses the token, so don't persist credentials.
          persist-credentials: false

      - name: shellcheck version (preinstalled on ubuntu runner)
        run: shellcheck --version

      - name: test-lint-bash — shellcheck fail-set (SC2086 / SC2046 / SC2155)
        run: bash agents/scripts/core/test-lint-bash.sh

      - name: test-shell-lint — 5-rule self-review gate (deps / shellcheck / curl / sha256 / flag-parity)
        run: bash agents/scripts/core/test-shell-lint.sh
