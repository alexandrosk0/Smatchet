name: Doc validation

# Lightweight bucket-A checks for AGENTS.md / agents/ / docs/agent-rules/ diffs.
# Catches stale `AGENTS.md § <section>` cross-references and agent-prompt
# contract drift before merge — the surfaces that build-and-test.yml's
# paths-ignore deliberately skips and coverage.yml's paths: allow-list excludes.
#
# Runs:
#   - agents/scripts/core/test-doc-anchors.sh        (every AGENTS.md § <name> resolves)
#   - agents/scripts/core/test-agent-contract.sh     (9 sub-checks: headings per agent
#                                              class, frontmatter parity, Outcome
#                                              mandate, token-tracking drift)
#
# Scoped narrowly via `paths:` so non-doc PRs skip entirely. Runs on Ubuntu
# (cheap) because the two scripts are pure Python + bash, no MSYS2 / GL needed.
#
# Plan: docs/plans/shipped/process-backlog-tighten-1-2-3-9-11-12.md § Slice 8
# (gap closure on top of PR #309 Slice 2 + PR #312 Slice 7).

on:
  push:
    branches: [develop]
    paths:
      - '**/*.md'
      - 'AGENTS.md'
      - 'agents/**'
      - 'docs/agent-rules/**'
      - 'docs/backlog/**'
      - 'docs/self-improvement/**'
      - 'docs/plans/shipped/**'
      - 'project.config.json'
      - 'project.config.schema.json'
      - 'agents/scripts/core/test-doc-anchors.sh'
      - 'agents/scripts/core/test_doc_anchors.py'
      - 'agents/scripts/core/test-agent-contract.sh'
      - 'agents/scripts/core/test-agent-build-facts.sh'
      - 'agents/scripts/core/test-plan-index.sh'
      - 'agents/scripts/core/test-plan-ref-integrity.sh'
      - 'agents/scripts/core/test-portable-purity.sh'
      - 'agents/scripts/core/test-config-globs.sh'
      - 'agents/scripts/core/test-required-context-parity.sh'
      - 'agents/scripts/core/lib/ci-check-resolve.sh'
      - 'agents/scripts/core/test-plan-naming.sh'
      - 'agents/scripts/core/test-markdown-links.sh'
      - 'agents/scripts/core/test-agent-discovery-fixture.sh'
      - 'agents/scripts/project/test-subsystem-docs.sh'
      - 'agents/scripts/core/agent_size_audit.py'
      # test-gate-selftests scans these dirs for --selftest-exposing scripts, so
      # any added/changed gate must re-trigger the convention-check.
      - 'agents/scripts/core/test-gate-selftests.sh'
      - 'agents/scripts/core/**'
      - 'agents/scripts/project/**'
      - 'scripts/dev/**'
      - 'tests/bats/**'
      - 'CONTEXT-MAP.md'
      - 'Source/Core/src/**/AGENTS.md'
      - 'Source/Core/src/**/CONTEXT.md'
      - 'Source/Core/src/**/README.md'
      - 'scripts/dev/project-config.sh'
      - 'agents/_shared/token-tracking/**'
      - '.github/workflows/doc-validation.yml'
  # NO paths: filter here — DELIBERATE. `Doc anchors + agent contract` is a
  # REQUIRED branch-protection context (project.config.json § branch_protection).
  # A path-filtered required check is the classic GitHub deadlock: on a PR that
  # touches none of the filtered paths the workflow never runs, the required
  # context is never reported, and GitHub holds the PR `BLOCKED` forever (it
  # bit #880/#881/#882 — pure product/test diffs). So the workflow now runs on
  # EVERY PR and the doc-anchors job self-gates: a `Detect doc-relevant changes`
  # step decides whether to run the real validation or no-op green, so the
  # required context is ALWAYS reported exactly once. (Push keeps its paths
  # filter below — post-merge develop runs gate nothing.)
  pull_request:
    branches: [develop]
    # `edited` is added beyond GitHub's default [opened, synchronize, reopened] so a
    # PR that adds or fixes its `## Intent` section via a body edit re-runs the
    # `Intent section` job and self-heals the stale-red — no wasted empty-commit
    # push (the gate reads `github.event.pull_request.body`, which a metadata-only
    # body edit changes). The heavier jobs self-gate on `Detect doc-relevant
    # changes` and `concurrency.cancel-in-progress` collapses rapid edits, so the
    # extra trigger is cheap. See docs/agent-rules/ship-loops.md § Intent capture.
    types: [opened, synchronize, reopened, edited]
  # Merge-queue readiness (docs/plans/active/build-quality-velocity-hardening.md
  # finding #14 path B): `Doc anchors + agent contract` is a branch-protection
  # REQUIRED check. When develop is behind a GitHub merge queue, required checks
  # run on the synthetic `merge_group` ref; a required check that never reports
  # there deadlocks the queue forever (#880/#881/#882 class — the very deadlock
  # the self-gate below already exists to prevent on docs-less PRs). The
  # `Detect doc-relevant changes` step already self-gates non-pull_request events
  # to `docs=true` (full validation runs → reports terminal status), so adding
  # `merge_group` here makes the required context report on the queued merge with
  # no further change. The `autosync-plan-index` job stays PR-only (not required).
  merge_group:

concurrency:
  group: doc-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Auto-sync the shipped-plan INDEX on PR branches so authors never hand-run
  # `test-plan-index.sh --fix`. Concurrent-archive drift (postmortems.md
  # infra-P2): when one PR archives a plan, every other open plan PR's INDEX
  # goes stale; this job regenerates from the branch's own shipped/ set.
  #
  # CRITICAL re-trigger constraint: GitHub deliberately does NOT fire workflows
  # for commits pushed with the default GITHUB_TOKEN (its infinite-loop
  # safeguard). So a bot auto-commit pushed under GITHUB_TOKEN becomes the new
  # PR head but NO required check (Doc anchors+agent contract, Shell lint,
  # Test-delta, build) re-runs on it — the rollup freezes showing the PRE-sync
  # `test-plan-index` FAILURE and the PR is blocked until a human re-pushes.
  # (The earlier "idempotent re-trigger → no loop" comment was wrong: it assumed
  # the bot push re-triggers CI; it does not.)
  #
  # Two paths, neither leaving a silent stale failure:
  #   * PAT configured (secrets.PLAN_INDEX_PAT non-empty): checkout uses the PAT,
  #     so the auto-commit is PAT-authored → DOES re-trigger all checks → the
  #     re-run goes green. Convenience preserved.
  #   * No PAT (default today): do NOT push a bot commit. Print the drift diff +
  #     remedy and exit 1, so the PR shows a CORRECT failure on the CURRENT head
  #     (not a stale one on an un-checked bot head). The author re-pushes as
  #     themselves → CI re-triggers cleanly.
  #
  # To enable the auto-fix path: add a repo secret PLAN_INDEX_PAT = a
  # fine-grained PAT scoped to this repo with `Contents: Read and write`
  # (sufficient to push to an unprotected PR branch). No other scope needed.
  # Skips forks (no push access to a fork branch).
  autosync-plan-index:
    name: Auto-sync plan INDEX (PR branch)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Pre-checkout scope gate. The INDEX only tracks docs/plans/shipped/, so a
      # PR that does not touch shipped/ needs no autosync — and must NOT be redded
      # by the credentialed checkout below, whose PLAN_INDEX_PAT can be
      # absent/expired and then fails closed (`could not read Username`), failing
      # an unrelated PR. Detect changed files via the REST API under the default
      # GITHUB_TOKEN (no checkout, no PAT); skip every later step when shipped/ is
      # untouched. A job whose steps all skip still reports success, so this
      # non-required check goes green instead of failing. A PR that DOES touch
      # shipped/ still reaches the checkout — so that step is ALSO fail-open
      # (continue-on-error, below): an expired PAT there degrades the auto-fix to
      # a no-op rather than redding the PR, with the required test-plan-index
      # check (validate mode, doc-anchors job) still hard-gating INDEX drift.
      - name: Detect shipped-plan changes
        id: shipped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fail OPEN on a query error (run the autosync defensively) instead of
          # silently skipping — this job exists to catch shipped-INDEX drift, so a
          # `gh api` hiccup must not mask a real drift. Emit BOTH .filename and
          # .previous_filename so a plan RENAMED OUT of docs/plans/shipped/ (a
          # shipped->active un-ship, which test-plan-index.sh itself handles) is
          # detected — not just files whose NEW path is under shipped/.
          if ! files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
                 --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Unable to query PR files — running INDEX autosync defensively."
            exit 0
          fi
          if printf '%s\n' "$files" | grep -Eq '(^|[[:space:]])docs/plans/shipped/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PR touches docs/plans/shipped/ — running INDEX autosync."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PR does not touch docs/plans/shipped/ — autosync skipped (nothing the INDEX tracks changed)."
          fi
      - name: Checkout PR head branch
        id: checkout
        if: steps.shipped.outputs.changed == 'true'
        # FAIL-OPEN: a set-but-EXPIRED PLAN_INDEX_PAT is truthy, so the `||` below
        # keeps it (no GITHUB_TOKEN fallback) and the credentialed fetch dies with
        # `could not read Username`. This advisory auto-FIXER must never red an
        # unrelated PR for that, so the checkout is continue-on-error and every
        # later step gates on steps.checkout.outcome == 'success'. INDEX drift is
        # still hard-gated by the required test-plan-index check (validate mode);
        # losing auto-fix on a broken PAT only means the author re-syncs by hand.
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Use the fine-grained PAT when configured so a later auto-commit is
          # PAT-authored (re-triggers CI). Empty secret → fall back to the
          # default GITHUB_TOKEN: we can still READ the branch; the run step
          # below will NOT push under it (see PAT_CONFIGURED gate) to avoid the
          # GITHUB_TOKEN silent-stale-failure.
          token: ${{ secrets.PLAN_INDEX_PAT || github.token }}
          persist-credentials: true
      - name: Note autosync skipped (checkout could not authenticate)
        if: steps.shipped.outputs.changed == 'true' && steps.checkout.outcome == 'failure'
        run: |
          echo "::warning::INDEX autosync skipped — credentialed checkout could not authenticate (PLAN_INDEX_PAT absent/expired). This advisory auto-fixer is a no-op here; INDEX correctness stays hard-gated by the required test-plan-index check. Restore the PAT (see job header) to re-enable auto-fix."
      - name: Set up Python
        if: steps.shipped.outputs.changed == 'true' && steps.checkout.outcome == 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Regenerate INDEX + commit if drifted
        if: steps.shipped.outputs.changed == 'true' && steps.checkout.outcome == 'success'
        # Branch refs are untrusted input — a PR head branch name may contain
        # shell metacharacters ($(), backticks). Pass them through the env (not
        # inline ${{ }} template expansion into the script body) so the runner
        # shell can't re-parse them as command substitution. See
        # https://docs.github.com/en/actions/reference/security/secure-use
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # Secrets can't be read in a step `if:`; route presence through env.
          # Non-empty only when the owner has added the PLAN_INDEX_PAT secret.
          PAT_CONFIGURED: ${{ secrets.PLAN_INDEX_PAT != '' }}
        run: |
          # Scope: only act on PRs that actually touch docs/plans/ — a non-plan
          # PR doesn't change shipped/, so its INDEX is correct after the
          # (strict-mode-mandatory) rebase and needs no auto-commit. Skipping
          # them avoids a surprise bot commit + an extra CodeRabbit review cycle
          # on unrelated PRs (and spurious git-history date-column diffs).
          git fetch --no-tags origin "$BASE_REF" 2>/dev/null || true
          if ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^docs/plans/'; then
            echo "PR does not touch docs/plans/ — INDEX autosync skipped."
            exit 0
          fi
          bash agents/scripts/core/test-plan-index.sh --fix
          if git diff --quiet -- docs/plans/INDEX.md; then
            echo "plan INDEX already in sync — nothing to commit."
            exit 0
          fi

          # INDEX drifted and was regenerated in the working tree.
          if [ "$PAT_CONFIGURED" = "true" ]; then
            # PAT path: the checkout above used PLAN_INDEX_PAT, so this push is
            # PAT-authored and DOES re-trigger all required checks on the new
            # head → the re-run goes green. Auto-fix convenience preserved.
            echo "::notice::plan INDEX drifted — auto-syncing via PLAN_INDEX_PAT (re-triggers CI)."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/plans/INDEX.md
            git commit -m "chore(plan): auto-sync shipped-plan INDEX"
            git push origin "HEAD:$HEAD_REF"
            exit 0
          fi

          # No-PAT path (default): a GITHUB_TOKEN bot push would NOT re-trigger
          # CI, freezing the PR on a stale pre-sync failure. So instead FAIL
          # LOUDLY on the current head — the author re-pushes the fix as
          # themselves, which re-triggers CI cleanly.
          echo "::error::docs/plans/INDEX.md is out of sync with docs/plans/shipped/. Drift below."
          echo "----- INDEX drift (run the remedy to apply) -----"
          git --no-pager diff -- docs/plans/INDEX.md
          echo "-------------------------------------------------"
          echo "Remedy: bash agents/scripts/core/test-plan-index.sh --fix"
          echo "        git add docs/plans/INDEX.md && git commit && git push"
          echo "(Auto-fix can be enabled by adding the PLAN_INDEX_PAT repo secret"
          echo " — fine-grained PAT, Contents: Read and write. See job header.)"
          exit 1

  doc-anchors-and-agent-contract:
    name: Doc anchors + agent contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Self-gate: this required check now runs on EVERY PR (no workflow paths
      # filter — see the `on:` header). For a PR that touches no doc-relevant
      # file, the real validation has nothing to check, so every step below is
      # skipped and the job completes green — the required context is still
      # reported (exactly once), which is what keeps GitHub from deadlocking a
      # pure product/test PR. The detect predicate is intentionally a superset
      # of the retired `pull_request.paths` list (more inclusive = fail-safe:
      # worst case the validation runs when it strictly needn't and passes).
      - name: Detect doc-relevant changes
        id: detect
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event — running full doc validation."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF" 2>/dev/null || true
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || true)"
          # scripts/dev/test-*.sh is the one bats-wrapper root the test-orphan-bats
          # gate reads that `^agents/` doesn't already cover (Bugbot 793a0166): a
          # wrapper-only edit/deletion there must set docs=true so the orphan check
          # runs — else a suite can be un-wired by a scripts/dev-only PR while the
          # required doc job stays green. Mirrors the gate's `--include=test-*.sh`.
          if printf '%s\n' "$changed" | grep -qE '(\.md$|^AGENTS\.md$|^agents/|^docs/|^tests/bats/|^project\.config\.(json|schema\.json)$|^CONTEXT-MAP\.md$|^scripts/dev/project-config\.sh$|^scripts/dev/test-.*\.sh$|^scripts/dev/test_.*\.py$|^\.github/workflows/doc-validation\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "doc-relevant changes detected — running full doc validation."
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "no doc-relevant changes — doc validation no-ops (required check reported green)."
          fi
          # Separate signal for ANY workflow-file edit. The required-context
          # parity gate guards against a path-filter / non-pr-triggered deadlock
          # introduced by a workflow change — exactly the workflow-only PR that
          # the docs detector above excludes (generic .github/workflows/*.yml is
          # NOT doc-relevant). Gating the parity step on docs alone would self-
          # gate it out of the very case it exists to catch (CR #1180).
          if printf '%s\n' "$changed" | grep -qE '^\.github/workflows/.*\.ya?ml$'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "workflow-file changes detected — required-context parity gate will run."
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi

      - name: test-doc-anchors — every AGENTS.md § <section> resolves
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/core/test-doc-anchors.sh

      - name: test-agent-contract — required headings + frontmatter parity
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/core/test-agent-contract.sh

      - name: test-agent-build-facts — agent prompts cite real presets + live toolchain
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/core/test-agent-build-facts.sh

      - name: Validate project.config.json against schema
        if: steps.detect.outputs.docs == 'true'
        run: |
          python -m pip install --quiet jsonschema
          python - <<'PY'
          import json, jsonschema
          cfg = json.load(open("project.config.json"))
          schema = json.load(open("project.config.schema.json"))
          jsonschema.validate(cfg, schema)
          print("project.config.json: valid against schema")
          PY

      - name: test-plan-index — shipped-plan index in sync with archive
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/core/test-plan-index.sh

      - name: test-plan-ref-integrity — no dangling docs/plans refs
        if: steps.detect.outputs.docs == 'true'
        run: |
          bash agents/scripts/core/test-plan-ref-integrity.sh --selftest
          bash agents/scripts/core/test-plan-ref-integrity.sh

      - name: test-plan-naming — plan files are kebab-case
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/core/test-plan-naming.sh

      - name: md_lint — markdown style (MD028 etc.)
        if: steps.detect.outputs.docs == 'true'
        run: |
          python3 agents/scripts/core/md_lint.py --selftest
          python3 agents/scripts/core/md_lint.py --all

      - name: test-portable-purity — no NEW project literals in portable dirs
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/core/test-portable-purity.sh

      - name: test-config-globs — project.config.json globs match >=1 tracked file
        if: steps.detect.outputs.docs == 'true'
        run: |
          bash agents/scripts/core/test-config-globs.sh --selftest
          bash agents/scripts/core/test-config-globs.sh --check

      - name: test-required-context-parity — every required context emits unconditionally
        if: steps.detect.outputs.docs == 'true' || steps.detect.outputs.workflows == 'true'
        run: |
          python -m pip install --quiet pyyaml
          bash agents/scripts/core/test-required-context-parity.sh --selftest
          bash agents/scripts/core/test-required-context-parity.sh --check

      - name: test-workflow-job-mask — no job-level continue-on-error on a non-advisory job
        if: steps.detect.outputs.docs == 'true' || steps.detect.outputs.workflows == 'true'
        run: |
          python -m pip install --quiet pyyaml
          bash agents/scripts/core/test-workflow-job-mask.sh --selftest
          bash agents/scripts/core/test-workflow-job-mask.sh --check

      - name: test-required-context-adr-consistency — no ADR-rejected required-context addition
        if: steps.detect.outputs.docs == 'true' || steps.detect.outputs.workflows == 'true'
        run: |
          bash agents/scripts/core/test-required-context-adr-consistency.sh --selftest
          bash agents/scripts/core/test-required-context-adr-consistency.sh --check

      - name: test-gate-selftests — every --selftest-exposing gate asserts a failure case
        if: steps.detect.outputs.docs == 'true'
        run: |
          bash agents/scripts/core/test-gate-selftests.sh --selftest
          bash agents/scripts/core/test-gate-selftests.sh --check

      - name: test-oob-label-impl — every documented *-out-of-band label has an impl
        if: steps.detect.outputs.docs == 'true'
        run: |
          bash agents/scripts/core/test-oob-label-impl.sh --selftest
          bash agents/scripts/core/test-oob-label-impl.sh

      - name: test-portable-agent-vexp — no vexp literal re-injected into portable agent prompts
        if: steps.detect.outputs.docs == 'true'
        run: |
          bash agents/scripts/core/test-portable-agent-vexp.sh --selftest
          bash agents/scripts/core/test-portable-agent-vexp.sh

      - name: test-markdown-links — no dangling [label](href) targets
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/core/test-markdown-links.sh

      - name: test-orphan-bats — every tests/bats/*.bats has a runnable wrapper
        if: steps.detect.outputs.docs == 'true'
        run: |
          bash agents/scripts/core/test-orphan-bats.sh --selftest
          bash agents/scripts/core/test-orphan-bats.sh

      - name: work_item_lint — work-item close shape + ledger-citation sweep
        if: steps.detect.outputs.docs == 'true'
        run: |
          python3 agents/scripts/core/work_item_lint.py --selftest
          python3 agents/scripts/core/work_item_lint.py --all
          bash scripts/dev/test-work-item-lint.sh

      - name: test-agent-discovery-fixture — Gate #1 flat discovery from subdirs
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/core/test-agent-discovery-fixture.sh

      - name: test-subsystem-docs — leaf-doc registry parity + README staleness
        if: steps.detect.outputs.docs == 'true'
        run: bash agents/scripts/project/test-subsystem-docs.sh --diff origin/develop

      - name: agent-size gate — agent prompt / AGENTS.md line budget (delta vs develop)
        if: steps.detect.outputs.docs == 'true'
        run: python3 agents/scripts/core/agent_size_audit.py --diff origin/develop

  # PR-body lint: flag a PR whose body has no filled `## Intent` section (the
  # one-line redacted statement of the originating human ask — see
  # docs/agent-rules/ship-loops.md § Intent capture). PR-only (no push /
  # merge_group). BLOCKING as of pr-intent-capture-hardening #5: exits non-zero on
  # a missing/empty Intent. It is NOT a branch-protection required context
  # (deliberately NOT in project.config.json § branch_protection, which would need
  # merge_group reporting or it deadlocks the queue — ADR-0022); instead the check
  # name `Intent section` is on the merge-gates.sh meant-to-block allow-list, so the
  # poller treats its RED as a block exactly like Coverage / Sanitizer. The
  # `intent-out-of-band` label downgrades it for fresh-worktree / non-Claude-Code
  # fallback flows. The name must NOT contain "advisory" (the allow-list excludes
  # advisory-named checks).
  #
  # Bot-authored PRs are EXEMPT (the job skips, and merge-gates.sh maps SKIPPED →
  # pass alongside SUCCESS/NEUTRAL): a Dependabot bump has no originating human
  # ask to redact, and its body is bot-generated — a hand-added `## Intent` is
  # wiped by `@dependabot recreate`. Without the exemption the only way to green
  # a bump is pinning `intent-out-of-band` on every one, i.e. normalising an
  # override into routine, which is what makes an override stop meaning
  # anything. The exemption is an explicit login allow-list, NOT
  # `user.type == 'Bot'`: a future bot that opens *product* PRs must stay gated
  # by default. Guarded by tests/bats/capture_intent.bats.
  pr-intent-lint:
    name: Intent section
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check PR body has a filled ## Intent section
        # The PR body is untrusted input — route it through the env (never inline
        # ${{ }} expansion into the script body, which would let backticks / $()
        # in a title re-parse as shell). See the autosync-plan-index job header.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ.get("PR_BODY", "") or ""
          guide = "see docs/agent-rules/ship-loops.md § Intent capture"
          m = re.search(r'(?ms)^##\s+Intent\s*$(.*?)(?=^##\s|\Z)', body)
          if not m:
              print("::error title=Intent section missing::PR body has no `## Intent` "
                    "section. Add a one-line redacted statement of the originating ask (%s). "
                    "Override with the 'intent-out-of-band' label." % guide)
              sys.exit(1)
          # Strip HTML-comment template placeholder before the empty check.
          section = re.sub(r'(?s)<!--.*?-->', '', m.group(1)).strip()
          if not section:
              print("::error title=Intent section empty::PR body `## Intent` is empty or "
                    "only the template placeholder. Fill it with the originating ask (%s). "
                    "Override with the 'intent-out-of-band' label." % guide)
              sys.exit(1)
          print("Intent section present and filled.")
          PY
