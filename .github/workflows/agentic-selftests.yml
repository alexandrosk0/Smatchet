name: Agentic self-tests

# CI backstop for the agentic harness's own test suite (the bats layer + the
# shell self-tests under agents/scripts/{core,project} and scripts/dev). These
# run via scripts/dev/test-all.sh, which historically ran ONLY at a local
# pre-push gate that nothing actually invoked — so a regression in the lock /
# guard / merge-gate-logic / session-registry / plan + contract gates could
# merge green (the "gate, don't trust" suite gated nowhere). This lane is that
# missing backstop.
#
# Runs on ubuntu-latest where shellcheck is preinstalled; bats-core is installed
# from its pinned GitHub tag (not apt — see the install step) and python3 is
# preinstalled. `test-all.sh --ci` treats a missing built Smatchet.exe (exit 2)
# as a clean SKIP and denylists suites needing a service
# unavailable here (Perforce, live gh) or tracked-pending-fix — so only genuine
# assertion failures in the deterministic agentic suite red this lane. The
# denylist + its reasons live in scripts/dev/test-all.sh (CI_SKIP_RE).
#
# ADVISORY (WARN-first, non-blocking) gates registered in this lane — they run via the
# same test-all.sh `test-*.sh` glob as everything else and report `Passed: 1 Failed: 0`
# while printing their findings, so a detector false positive can never red the lane:
#   * test-dead-export-audit.sh   — cross-TU dead exports in Source/Core/include/**
#                                   (baseline: docs/high-integrity/dead-export-baseline.md)
#   * test-small-helper-audit.sh  — sub-MIN_CLONE_TOKENS duplicated free helpers
#                                   (baseline: docs/high-integrity/small-helper-baseline.md)
# Both follow the DRY gate's WARN-first -> blocking graduation path (ADR-0015);
# graduation is a separate decision with its own ADR. See gate-blind-spot-sweep.
#
# Follow-ups (tracked, not yet gated here): the guard-head-drift / guard-plan-lock /
# session-registry bats suites (one runner-checkout-sensitive assertion each) — un-skip
# these as each is hardened to run headless. The merge-watcher, pr-status-watch,
# lint-rules and bucket-lane-smoke suites have been hardened and now gate here. Since PR #1619 (block-on-any-red)
# this check IS a branch-protection REQUIRED context ("Agentic self-tests (bats)"
# in project.config.json § branch_protection.required_contexts, applied via
# setup-branch-protection.sh); the merge-gates poller additionally blocks on any
# red per AGENTS.md ("never merge past ANY red check").

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # Future-proof for a GitHub merge queue: this lane runs test-all.sh against the
  # working tree (no PR context), so it reports a real terminal status on the
  # synthetic merge_group ref with no self-gate needed.
  merge_group:

concurrency:
  group: agentic-selftests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Agent-layer indirection: the layer is the agent-layer/ submodule (every checkout
  # here uses `submodules: recursive`); the project is the checkout root.
  AGENT_LAYER_ROOT: agent-layer
  PROJECT_ROOT: .
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  agentic-selftests:
    name: Agentic self-tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: several gates are merge-base deltas vs origin/develop
          # (dup_audit / agent_size_audit / test-lint-rules / portable-purity).
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Ensure origin/develop ref (for delta-vs-develop gates)
        run: git fetch --no-tags --quiet origin develop || true

      # bats-core from its GitHub tag, NOT apt: the Ubuntu mirror is a dependency this
      # lane does not otherwise have, and a mirror DNS outage (2026-11-11, `Temporary
      # failure resolving 'azure.archive.ubuntu.com'`, exit 100 for 35+ min) red'd this
      # required lane on develop and every PR. github.com is already a hard dependency
      # (checkout). v1.10.0 = the version apt shipped on ubuntu-latest, so no behaviour
      # change; the tag is verified against its commit SHA so a moved tag fails loudly.
      - name: Install bats (shellcheck + python3 preinstalled on ubuntu runner)
        env:
          BATS_TAG: v1.10.0
          BATS_SHA: f7defb94362f2053a3e73d13086a167448ea9133
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/bats-core"
          for attempt in 1 2 3; do
            rm -rf "$src"
            if git clone --quiet --depth 1 --branch "$BATS_TAG" \
                 https://github.com/bats-core/bats-core.git "$src"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::bats-core clone failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          got="$(git -C "$src" rev-parse HEAD)"
          if [ "$got" != "$BATS_SHA" ]; then
            echo "::error::bats-core $BATS_TAG resolved to $got, expected $BATS_SHA"
            exit 1
          fi
          sudo "$src/install.sh" /usr/local
          bats --version
          # sed, not head: under pipefail an early-exiting head could SIGPIPE shellcheck.
          shellcheck --version | sed -n 1,2p
          python3 --version

      - name: Provision .claude/ adapter (gitignored — hooks/agents the guard + lint-hook + adapter suites source)
        run: bash "$AGENT_LAYER_ROOT/agents/scripts/core/setup-harness.sh" claude-code

      - name: test-all.sh --ci — agentic self-test aggregator
        run: bash scripts/dev/test-all.sh --ci
