name: Plan-locks render

# Regenerates docs/plans/active/_plan-locks.generated.md from the live state of
# refs/locks/* on origin. The rendered file is the human-readable mirror of
# the atomic ref-based plan-lock state — see docs/plans/shipped/git-ref-plan-locks.md
# (Phase 2) and agents/scripts/core/locks-render-markdown.sh.
#
# GitHub's `on: push` event does not fire for non-branch / non-tag refs
# (refs/locks/* are neither), so this workflow runs on a schedule plus manual
# dispatch. Mean lag from a ref-update to the rendered PR is bounded by the
# cron interval (currently 30 minutes).
#
# Branch protection — develop is unmodified. The workflow opens or updates
# a single bot-owned PR (`bot/plan-locks-sync`) which a human merges. No
# direct push to develop.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

concurrency:
  group: plan-locks-render
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  # Force JS actions onto Node 24 (Node 20 deprecated 2026-06-16). Covers
  # actions/checkout, actions/cache, ilammy/msvc-dev-cmd, upload-artifact —
  # incl. third-party actions with no Node 24 release yet.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  render:
    name: Render refs/locks/* to Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch refs/locks/*
        run: |
          # The default checkout does not pull refs outside refs/heads/.
          # Pull all refs/locks/* into the local repo for the render script.
          # NOTE: no `|| true` — a transient fetch failure here would leave the
          # local namespace empty and the render step would produce an
          # empty-state file, opening a PR that incorrectly claims all locks
          # released. Fail loud; the next scheduled run retries.
          git fetch --quiet --prune origin '+refs/locks/*:refs/locks/*'

      - name: Render
        run: |
          bash agents/scripts/core/locks-render-markdown.sh > docs/plans/active/_plan-locks.generated.md
          echo "--- rendered file size:"
          wc -l docs/plans/active/_plan-locks.generated.md

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet -- docs/plans/active/_plan-locks.generated.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No diff — refs/locks/* state matches the file already on develop."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Diff detected; will open or update the sync PR."
          fi

      # ---------------------------------------------------------------------
      # Two-step split: branch push uses the default GITHUB_TOKEN (contents:
      # write, always available). PR creation uses LOCK_RENDER_PAT, a fine-
      # grained PAT scoped to `pull-requests: write` on this single repo.
      #
      # Why split: GitHub disallows GITHUB_TOKEN from creating or approving
      # PRs by default since 2022 ("GitHub Actions is not permitted to create
      # or approve pull requests" — the failure mode this PR fixes). The
      # repo-wide "Allow GitHub Actions to create and approve pull requests"
      # checkbox would also work but relaxes the default for every workflow.
      # A fine-grained PAT keeps the relaxation surface to this one step.
      #
      # PAT setup procedure: see docs/plans/shipped/git-ref-plan-locks.md
      # § Operational requirements.
      # ---------------------------------------------------------------------

      - name: Commit + force-push sync branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="bot/plan-locks-sync"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always force the sync branch to develop tip + the new render.
          # The branch is bot-owned and exists solely to carry the regenerated
          # file. A human merges the PR or closes it.
          git checkout -B "$BRANCH"
          git add docs/plans/active/_plan-locks.generated.md
          git commit -m "chore(plan-locks): regenerate _plan-locks.generated.md from refs/locks/*"
          git push -u origin "$BRANCH" --force

      # Deliberately NOT diff-gated, and deliberately placed AFTER the push.
      #
      # Not diff-gated: most cron fires find no diff, so gating this behind
      # `changed == 'true'` would leave the expiry countdown — the whole point
      # of the check — dark on the majority of runs, and a lapsed token would
      # stay invisible until the next run that happens to carry a diff.
      #
      # After the push: a dead PAT must not cost lock data. The regenerated
      # file lands on the sync branch first (that step uses GITHUB_TOKEN and is
      # unaffected by the PAT); only PR creation is blocked. Hoisting this
      # above the push would turn an expired token into a data-loss stop.
      - name: LOCK_RENDER_PAT preflight
        env:
          GH_TOKEN: ${{ secrets.LOCK_RENDER_PAT }}
          # Interpolate a boolean, never the secret value itself, into the
          # script body.
          PAT_SET: ${{ secrets.LOCK_RENDER_PAT != '' }}
        run: |
          set -euo pipefail

          if [ "$PAT_SET" != "true" ]; then
            echo "::warning::LOCK_RENDER_PAT secret is not set. The PR step falls back to GITHUB_TOKEN, which is forbidden from creating PRs by default. If that step errors with 'GitHub Actions is not permitted to create or approve pull requests', see docs/plans/shipped/git-ref-plan-locks.md § Operational requirements for the one-time PAT setup."
            exit 0
          fi

          # A *missing* PAT and an *expired* one fail nothing alike. The branch
          # push above uses GITHUB_TOKEN and keeps succeeding, so the only
          # symptom of a lapsed PAT is gh emitting a bare "HTTP 401: Bad
          # credentials / Try authenticating with: gh auth login -h github.com"
          # — advice that is meaningless inside Actions and names neither the
          # secret nor the rotation procedure. Probe the token once up front
          # and translate the 401 into a sentence an operator can act on.
          # (Observed 2026-08-16: 23 consecutive red cron fires starting at the
          # PAT's 90-day mark, every one logging only the bare 401.)
          # Probe with a repo-scoped PR read — the exact permission the PR step
          # needs and the only one the least-privilege PAT is granted. Probing
          # /user instead would exercise a permission the token deliberately
          # does not hold, so a perfectly healthy PAT could fail the preflight.
          # `-i` also returns the token's own expiry as a response header, so
          # one call covers both checks.
          if ! probe=$(gh api -i "repos/${GITHUB_REPOSITORY}/pulls?per_page=1" 2>&1); then
            case "$probe" in
              *401*|*"Bad credentials"*)
                echo "::error::LOCK_RENDER_PAT is set but no longer authenticates (HTTP 401 Bad credentials) — the token has expired or was revoked. This PAT is minted with a 90-day expiry; rotate it per docs/plans/shipped/git-ref-plan-locks.md § Operational requirements -> Rotation, then re-run this workflow. Nothing is lost: refs/locks/* remain authoritative, and if this run carried a diff the regenerated file was already force-pushed to 'bot/plan-locks-sync' — only PR creation is blocked."
                ;;
              *)
                echo "::error::LOCK_RENDER_PAT preflight failed before any PR call: ${probe}"
                ;;
            esac
            exit 1
          fi

          # Early warning, so a 90-day cliff is announced two weeks ahead
          # instead of discovered by a red tip. Best-effort: a header rename
          # must never fail the job.
          expiry=$(printf '%s' "$probe" | tr -d '\r' \
            | grep -i '^github-authentication-token-expiration:' \
            | head -n1 | cut -d' ' -f2-) || true
          if [ -n "${expiry:-}" ] && exp_epoch=$(date -u -d "$expiry" +%s 2>/dev/null); then
            days_left=$(( (exp_epoch - $(date -u +%s)) / 86400 ))
            if [ "$days_left" -le 14 ]; then
              echo "::warning::LOCK_RENDER_PAT expires in ${days_left} day(s) (${expiry}). Rotate it before then per docs/plans/shipped/git-ref-plan-locks.md § Operational requirements -> Rotation — once it lapses, every 30-minute cron fire reds the develop tip until a human acts."
            else
              echo "::notice::LOCK_RENDER_PAT valid for ${days_left} more day(s) (${expiry})."
            fi
          fi

      - name: Open or update sync PR
        if: steps.diff.outputs.changed == 'true'
        env:
          # Prefer the fine-grained PAT when configured; fall back to the
          # default token (which will fail PR-creation with the GraphQL
          # "GitHub Actions is not permitted to create or approve pull
          # requests" error — that failure is loud and actionable). The
          # preflight step above has already vetted the PAT and named it if
          # unset or expired.
          GH_TOKEN: ${{ secrets.LOCK_RENDER_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="bot/plan-locks-sync"

          # Tell "no PR is open" apart from "the query failed". A trailing
          # `|| true` here conflated the two, so an auth or API blip read as an
          # empty result and sent the script on to create a duplicate PR.
          if ! existing=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[].number'); then
            echo "::error::'gh pr list' failed for head '$BRANCH' — cannot tell whether a sync PR is already open, so refusing to create one blindly (that would duplicate an existing PR). Re-run after resolving the API error above."
            exit 1
          fi

          if [ -z "$existing" ]; then
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "chore(plan-locks): regenerate _plan-locks.generated.md from refs" \
              --body "Automated regeneration of \`docs/plans/active/_plan-locks.generated.md\` from the current state of \`refs/locks/*\` on origin. Source of truth is the refs themselves; this Markdown is a convenience mirror per [git-ref-plan-locks](../blob/develop/docs/plans/shipped/git-ref-plan-locks.md) § Phase 2. Safe to merge or close — the workflow will regenerate on schedule."
            echo "::notice::Opened new sync PR."
          else
            echo "::notice::Existing PR #$existing already open against $BRANCH; commit force-pushed onto it."
          fi
