name: Perf PR-fast

# Slice 3 of docs/plans/shipped/pillar-1-2-perf-review-system.md. Runs the PR-fast
# 4-scenario subset (declared in scripts/dev/perf-pr-fast-set.json) on every
# PR that touches Source/Core / Plugins / Source/Standalone. Compares each
# scenario's output against the ci-windows-latest baseline at
# docs/perf/baselines/<scenario>.ci-windows-latest.json. Posts a markdown
# delta table to the PR via `gh pr comment`. Fails the gate if any
# scenario regresses beyond docs/perf/regression-policy.json thresholds.
#
# First-run bootstrap: when no baseline exists yet for ci-windows-latest,
# the workflow captures one into a workflow artefact + opens a PR adding
# it under docs/perf/baselines/. The gate becomes active after a human
# reviews + merges that bootstrap PR. (Bootstrapped 2026-06-07 — the 4
# ci-windows-latest baselines are committed and the gate is ARMED.)
#
# Override: applying the `perf-out-of-band` label downgrades regression
# failures to warnings (mirrors the existing `tests-out-of-band` pattern
# from AGENTS.md § Merge gates).
#
# REQUIRED-CHECK shape (perf-gate-revival steps 7 + 6b, 2026-06-07): the
# job is a branch-protection required context, so it must REPORT on every
# PR (docs/agent-rules/ci-required-check-pattern.md § Invariant). The old
# workflow-level positive `paths:` filter would wedge docs-only PRs
# ("Expected — Waiting for status"). Pattern C is used instead of the
# plan's original Pattern-B skip-companion because the filter's `!**/*.md`
# negation has no expressible inverse in `paths-ignore` (GitHub supports
# `!` only under `paths`) — a Source-markdown-only PR would have triggered
# NEITHER workflow of a Pattern-B pair. Now: no workflow-level filter, a
# fast `changes` detect job classifies the diff (fail-safe: defaults to
# perf=true on any uncertainty), and a skipped required job counts as
# success for branch protection.

on:
  pull_request:
    branches: [develop]
    # labeled/unlabeled so applying `perf-out-of-band` AFTER a red run re-triggers
    # the gate (paired with the LIVE label query in Gate decision below) — without
    # these, the only way to honour a just-applied label was an empty commit to
    # mint a fresh event (postmortems.md 2026-06-07 PR #966).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Merge-queue readiness (mirrors coverage.yml / coverage-gate.yml / doc-validation.yml):
  # when develop is behind a GitHub merge queue, required contexts run on the synthetic
  # `merge_group` ref; a required context that never reports there deadlocks the queue
  # forever (ci-workflows-03). The detect step below self-gates any non-pull_request
  # event to perf=false so the heavy perf build skips and the required context still
  # reports green (a skipped required job counts as success for branch protection); the
  # queued commit's perf already passed at PR time.
  merge_group:

concurrency:
  group: perf-pr-fast-${{ github.ref }}
  cancel-in-progress: true

# sccache (local-dir backend) — docs/plans/ci-build-time-reduction.md Phase 1.
# Local disk (not SCCACHE_GHA_ENABLED) so a GH-cache-service outage can't fail the
# build. /Z7 (CI gate in CMakeLists.txt) is perf-neutral — debug-info location
# only, no codegen change (plan Q3).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SCCACHE_DIR: ${{ github.workspace }}\.sccache
  # NOTE: the SMATCHET_MCP_REQUIRE_TOKEN_ON_LOOPBACK=false opt-out (PR A / #1574,
  # the #1566 fast-unblock) was REMOVED once PR B / #1576 landed the real product
  # fix (the --spawn parent auto-provisions a per-spawn MCP token). This perf
  # scenario.run --spawn path now runs under the SECURE default and relies on PR
  # B's handshake — keeping it green is part of the #1566 regression guard.

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect perf-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      perf: ${{ steps.detect.outputs.perf }}
      android_only: ${{ steps.detect.outputs.android_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect perf-relevant changes
        id: detect
        shell: bash
        run: |
          set -uo pipefail
          # Merge-queue self-gate (ci-workflows-03): on a non-pull_request event
          # (merge_group), there is no base_ref to diff against — skip the heavy
          # perf build and report the required context green (a skipped required
          # job counts as success). The queued commit already passed perf at PR time.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}) — merge-queue readiness: skipping perf build, reporting green."
            echo "perf=false" >> "$GITHUB_OUTPUT"
            echo "android_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NO --depth: a shallow base-ref fetch re-shallows develop after the
          # fetch-depth:0 checkout and breaks merge-base for the three-dot diff
          # below (#1227(b)). Masked here (`2>/dev/null || true` + fail-safe
          # perf=true default) but kept correct so the diff scans the true range.
          git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null || true)
          echo "Changed files:"; printf '  %s\n' $files
          # Default perf=true (fail-safe): only flip to false when we have a
          # non-empty file list AND every entry is irrelevant to the perf gate.
          # Mirrors the retired workflow-level filter: Source/** (minus .md),
          # the perf tooling, baselines, policy, and the CMake roots.
          perf=true
          if [ -n "$files" ]; then
            perf=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md) ;;  # markdown is never compiled — incl. Source/**/AGENTS.md leaf docs
                Source/*) perf=true; break ;;
                scripts/dev/perf-*.py|scripts/dev/perf-*.sh|scripts/dev/perf-*.json) perf=true; break ;;
                docs/perf/baselines/*|docs/perf/regression-policy.json) perf=true; break ;;
                CMakeLists.txt|CMakePresets.json) perf=true; break ;;
                .github/workflows/perf-pr-fast.yml) perf=true; break ;;
                *) ;;
              esac
            done <<< "$files"
          fi
          echo "perf-relevant changes present: ${perf}"
          echo "perf=${perf}" >> "$GITHUB_OUTPUT"
          # ---------------------------------------------------------------
          # android_only: a perf-relevant diff whose EVERY changed file is
          # Android-specific (the mobile tree or the NDK toolchain wrappers)
          # or an uncompiled docs/metadata path — so the desktop standalone
          # perf build is unnecessary (Source/Mobile/* matched Source/* above,
          # so a mobile-only PR would otherwise spin up the full desktop perf
          # gate). Mirrors the same dimension + tolerated set in
          # build-and-test.yml so the two required checks agree on what counts
          # as android-only. Fail-safe is FALSE (run the full desktop perf
          # gate) on any non-android-specific path. Only narrows an already
          # perf=true diff; an empty/failed diff leaves perf=true above and
          # android_only=false here, so the desktop gate still runs. The Android
          # NDK build surface is covered by build-and-test.yml's mobile-android-ndk.
          android_only=false
          if [ "$perf" = "true" ] && [ -n "$files" ]; then
            android_only=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                Source/Mobile/*|cmake/toolchains/*) ;;
                scripts/dev/test-docs.sh) ;;
                *.md|docs/*|agents/*|scripts/dev/local/*|.gitignore|.gitattributes|.coderabbit.yaml|.github/CODEOWNERS|.github/pull_request_template.md) ;;
                *) android_only=false; break ;;
              esac
            done <<< "$files"
          fi
          echo "android-only diff (skip desktop perf build): ${android_only}"
          echo "android_only=${android_only}" >> "$GITHUB_OUTPUT"

  perf-pr-fast:
    name: Perf PR-fast (windows-2022)
    needs: changes
    if: ${{ needs.changes.outputs.perf == 'true' && needs.changes.outputs.android_only != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Setup sccache (object cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache sccache objects (perf-iter)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-sccache-perf-iter-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-perf-iter-
            ${{ runner.os }}-sccache-msvc-

      - name: Cache FetchContent _deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # FETCHCONTENT_BASE_DIR defaults to .fetchcontent-src (CMakeLists.txt:280).
          # The previous path (build/ninja-iter-msvc/_deps) was wrong — that dir
          # contains only the subbuild CMakeCache, not the downloaded sources — so
          # every perf run cold-fetched all deps. Now aligned with build-and-test.yml
          # so the main build's warm cache is restored here too.
          path: .fetchcontent-src
          key: ${{ runner.os }}-fetchcontent-msvc-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Configure ninja-iter-msvc
        run: cmake --preset ninja-iter-msvc

      - name: Build SmatchetStandalone
        run: cmake --build --preset ninja-iter-msvc --target SmatchetStandalone

      - name: Report sccache stats
        if: always()
        run: sccache --show-stats

      # Mesa software-GL parity with bucket-C/E (build-and-test.yml). The
      # "headless" perf run is a hidden GLFW window (GLFW_VISIBLE=FALSE,
      # StandaloneAppBootstrap.cpp) that still needs a working opengl32 ICD
      # to reach ImGui_ImplOpenGL3_CreateDeviceObjects — without it the
      # --spawn child dies before MCP comes up and every scenario.run is a
      # run_failure. Keep MESA_VERSION + cache key in lockstep with
      # build-and-test.yml. docs/plans/perf-gate-revival.md step 1.
      - name: Cache Mesa software-GL DLLs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mesa-cache
          key: mesa-dlls-24.2.5-v2

      - name: Install Mesa software OpenGL ICD (opengl32sw.dll)
        shell: bash
        env:
          MESA_VERSION: "24.2.5"
        run: |
          set -euo pipefail
          # Mesa >= 22 splits the GL driver: opengl32.dll is only a thin loader
          # that hard-requires libgallium_wgl.dll (the actual ~53 MB driver) +
          # libglapi.dll beside it. Copying opengl32.dll alone makes EVERY exe
          # in the target dir die at process start (STATUS_DLL_NOT_FOUND,
          # silent) — exactly how the bucket-C/E + perf headless runs were
          # broken-but-masked until the perf-gate-revival step-3 investigation
          # (2026-06-06; reproduced + fixed locally against Smatchet.exe).
          need_fetch=0
          for d in opengl32.dll libgallium_wgl.dll libglapi.dll; do
            if [ ! -f "mesa-cache/$d" ]; then need_fetch=1; fi
          done
          if [ "$need_fetch" = "1" ]; then
            mkdir -p mesa-tmp mesa-cache
            cd mesa-tmp
            curl -fL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
            # Supply-chain integrity: pal1000/mesa-dist-win publishes no checksum
            # (digest:null on every release asset), so this is a self-computed TOFU
            # pin — it catches silent upstream tampering / corrupt transfer, not
            # first-time trust. Keep in lockstep with MESA_VERSION; update on bump.
            # security.md "Mesa archive integrity" entry.
            echo "3f288b9d5d8b2d25ec0bd81dd82c6b8c77bc0ffad45cc467c37489170dd001ab  mesa.7z" | sha256sum -c -
            7z x mesa.7z -o./extracted >/dev/null 2>&1 || true
            for d in opengl32.dll libgallium_wgl.dll libglapi.dll; do
              if [ -f "extracted/x64/$d" ]; then cp "extracted/x64/$d" "../mesa-cache/$d"; fi
            done
            cd ..
            rm -rf mesa-tmp
          fi
          # Strict copy — a missing DLL here must fail LOUDLY, not reproduce
          # the silent-loader-death class this block exists to prevent.
          for d in opengl32.dll libgallium_wgl.dll libglapi.dll; do
            cp "mesa-cache/$d" "build/ninja-iter-msvc/$d"
          done

      - name: Run PR-fast scenarios + compare against baselines
        id: perf
        shell: bash
        env:
          # Route the hidden-window GL context through Mesa llvmpipe — the
          # --spawn child inherits this step env via CreateProcessA.
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          mkdir -p build/perf-runs
          : > /tmp/perf-report.md
          echo "## Perf delta — PR-fast subset (ci-windows-latest)" >> /tmp/perf-report.md
          echo "" >> /tmp/perf-report.md
          # Trimmed twin of the report for the PR comment: per-scenario verdict
          # + regressing rows only (no per-scope table). The full table is in
          # /tmp/perf-report.md -> Step Summary. (Anti-spam comment policy.)
          : > /tmp/perf-summary.md
          echo "## Perf delta — PR-fast subset" >> /tmp/perf-summary.md
          echo "" >> /tmp/perf-summary.md
          echo "_Per-scenario verdict only — full per-scope table in the run's Step Summary._" >> /tmp/perf-summary.md
          echo "" >> /tmp/perf-summary.md
          regression_count=0
          run_failure_count=0
          missing_baseline_count=0
          # A run-failure increments run_failure_count and `continue`s without a
          # per-scope table (there is no usable snapshot to diff). Mirror a named
          # failure line into BOTH the step-summary report AND the PR-comment
          # twin so a pure run-failure comment names the broken scenario instead
          # of showing only boilerplate + clean rows. (CodeRabbit PR #1097 #1.)
          note_run_failure() {
            printf '### `%s` — ❌ run failure (%s)\n\n' "$1" "$2" >> /tmp/perf-report.md
            printf '### `%s` — ❌ run failure (%s)\n\n' "$1" "$2" >> /tmp/perf-summary.md
          }
          for scen in $(python -c "import json; print(' '.join(json.load(open('scripts/dev/perf-pr-fast-set.json'))['scenarios']))"); do
            echo "::group::Scenario $scen"
            # Median-of-3 with a discarded warmup (perf-gate-revival § Flake
            # mitigations): the absolute p99 ceiling (10.0 ms, 100 Hz floor)
            # sits inside single-run scheduler noise on a shared runner — the
            # first armed run false-flagged SmatchetUI::Draw p99 17.354 ms on a
            # diff with no render-path change. Gate on the median of 3 measured
            # runs; a plumbing failure of ANY run still counts as run_failure.
            warmup=$(bash scripts/dev/perf-run.sh "$scen" 2>&1 | tail -1 || true)
            if [ ! -f "$warmup" ]; then
              echo "FAIL: warmup scenario.run did not produce $warmup" >&2
              run_failure_count=$((run_failure_count + 1))
              note_run_failure "$scen" "warmup scenario.run produced no snapshot"
              echo "::endgroup::"
              continue
            fi
            rm -f "$warmup"   # cold-runner sample — never measured
            runs=()
            run_broke=0
            for i in 1 2 3; do
              r=$(bash scripts/dev/perf-run.sh "$scen" 2>&1 | tail -1 || true)
              if [ ! -f "$r" ]; then
                # Scenario-run plumbing failure (build broken, exe missing,
                # JSON not produced). Track SEPARATELY from regression_count
                # so the `perf-out-of-band` label can't downgrade a real
                # plumbing break to a warning. (CodeRabbit PR #323 #1.)
                echo "FAIL: scenario.run #$i did not produce $r" >&2
                run_failure_count=$((run_failure_count + 1))
                run_broke=1
                break
              fi
              runs+=("$r")
            done
            if [ "$run_broke" = "1" ]; then
              note_run_failure "$scen" "measured scenario.run produced no snapshot"
              echo "::endgroup::"
              continue
            fi
            result=$(python scripts/dev/perf-median.py "${runs[@]}" | tail -1 || true)
            if [ ! -f "$result" ]; then
              echo "FAIL: perf-median did not select a usable snapshot for $scen" >&2
              run_failure_count=$((run_failure_count + 1))
              note_run_failure "$scen" "perf-median selected no usable snapshot"
              echo "::endgroup::"
              continue
            fi
            baseline="docs/perf/baselines/${scen}.ci-windows-latest.json"
            if [ ! -f "$baseline" ]; then
              echo "::warning::No baseline at $baseline — capturing for first-run bootstrap."
              missing_baseline_count=$((missing_baseline_count + 1))
              mkdir -p docs/perf/baselines
              # First-run: snapshot the fresh run as the baseline. Workflow
              # uploads it as an artefact; a human reviews + opens a
              # bootstrap PR to commit it. Script extracted from an inline
              # heredoc — the heredoc body sat at column 0 inside this
              # `run: |` YAML block scalar, which terminated the block
              # early and prevented the workflow from scheduling.
              python scripts/dev/perf-baseline-bootstrap.py "$result" "$baseline" "$scen"
              echo "### $scen — baseline captured (first run)" >> /tmp/perf-report.md
              echo "" >> /tmp/perf-report.md
              echo "### \`$scen\` — baseline captured (first run)" >> /tmp/perf-summary.md
              echo "" >> /tmp/perf-summary.md
            else
              # Gate FIRST (exit code), report AFTER — so the confirm-on-exceed
              # retry below can swap in the confirm sample before the tables are
              # written (one table per scenario, always the gated sample).
              python scripts/dev/perf-compare.py "$baseline" "$result" > /dev/null 2>&1
              rc=$?
              confirm_plumbing=0
              # Confirm-on-exceed (gate-fp-hardening 2026-06-10): a median-of-3
              # on the 2-core shared runner still swings JOB-wide — observed
              # cell-edit-burst SmatchetUI::Draw p99 medians 10.9 -> 15.661 ms
              # across days with no code change (PR #1112), against a 15.0
              # ceiling calibrated from ~10.9 medians. One noisy job must not
              # fail the PR: take ONE more full 3x-median sample and gate on
              # that. A real regression fails both samples (false-positive
              # probability squared); a noisy-neighbor episode clears.
              # Trigger ONLY on rc=1 (regression) — rc=2 is malformed input,
              # which a re-run can't fix; it falls through and counts.
              if [ "$rc" -eq 1 ]; then
                echo "::warning::$scen exceeded policy on the first median — taking a confirm sample (3 more runs)."
                confirm_runs=()
                for i in 1 2 3; do
                  r=$(bash scripts/dev/perf-run.sh "$scen" 2>&1 | tail -1 || true)
                  if [ ! -f "$r" ]; then
                    echo "FAIL: confirm scenario.run #$i did not produce $r" >&2
                    run_failure_count=$((run_failure_count + 1))
                    note_run_failure "$scen" "confirm scenario.run produced no snapshot"
                    confirm_plumbing=1
                    break
                  fi
                  confirm_runs+=("$r")
                done
                if [ "$confirm_plumbing" = "0" ]; then
                  confirm_result=$(python scripts/dev/perf-median.py "${confirm_runs[@]}" | tail -1 || true)
                  if [ -f "$confirm_result" ]; then
                    python scripts/dev/perf-compare.py "$baseline" "$confirm_result" > /dev/null 2>&1
                    rc2=$?
                    if [ "$rc2" -eq 0 ]; then
                      echo "::notice::$scen confirm sample within policy — first exceed was runner noise (gated on the confirm median)."
                      result="$confirm_result" # report the gated (confirm) sample
                      rc=0
                    elif [ "$rc2" -eq 1 ]; then
                      echo "::warning::$scen exceeded policy on BOTH independent medians — confirmed regression."
                      result="$confirm_result" # report the gated (confirm) sample
                      rc=1
                    else
                      # rc2==2: malformed confirm snapshot — plumbing, not a
                      # regression (CR #1115). First sample stays the report.
                      echo "FAIL: confirm compare reported malformed input for $scen (rc=$rc2)" >&2
                      run_failure_count=$((run_failure_count + 1))
                      note_run_failure "$scen" "confirm compare reported malformed input"
                      confirm_plumbing=1
                    fi
                  else
                    echo "FAIL: perf-median selected no usable confirm snapshot for $scen" >&2
                    run_failure_count=$((run_failure_count + 1))
                    note_run_failure "$scen" "perf-median selected no usable confirm snapshot"
                    confirm_plumbing=1
                  fi
                fi
              fi
              # One report entry per scenario: a confirm-plumbing failure already
              # wrote its ❌ note via note_run_failure (and hard-fails via
              # run_failure_count, which no label can downgrade) — skip the table
              # AND the regression tally for it so the scenario is neither
              # double-reported nor double-counted.
              if [ "$confirm_plumbing" = "0" ]; then
                python scripts/dev/perf-compare.py "$baseline" "$result" --markdown-only >> /tmp/perf-report.md
                # Compact verdict twin for the PR comment (no per-scope table).
                python scripts/dev/perf-compare.py "$baseline" "$result" --summary-only >> /tmp/perf-summary.md
                if [ "$rc" -ne 0 ]; then
                  regression_count=$((regression_count + 1))
                fi
              fi
            fi
            echo "::endgroup::"
          done
          echo "regression_count=$regression_count" >> "$GITHUB_OUTPUT"
          echo "run_failure_count=$run_failure_count" >> "$GITHUB_OUTPUT"
          echo "missing_baseline_count=$missing_baseline_count" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/perf-report.md

      - name: Upload PR-fast snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-pr-fast-snapshots
          path: |
            build/perf-runs/*.json
            docs/perf/baselines/*.ci-windows-latest.json
          retention-days: 7

      # Anti-spam comment policy (user-mandated 2026-06-07; hardened
      # 2026-06-09): the full delta table ALWAYS lands in the run's Step
      # Summary; the PR thread gets a comment ONLY on a regression or run
      # failure — a clean pass is already communicated by the green required
      # check. A pure missing-baseline run (new scenario added without a
      # committed ci-windows-latest baseline) is deliberately NOT comment-
      # worthy: it is a persistent state that re-fires on EVERY open PR until
      # a human commits the bootstrapped baseline, so commenting on it spams
      # every unrelated PR (root cause of the #1013 side-by-side-2-grid /
      # concurrent-sync spam). The bootstrap signal still surfaces via the
      # step summary, the uploaded artefact, and the Gate-decision ::notice::.
      # The comment is single + updated-in-place via a hidden marker, so
      # reruns and follow-up pushes never stack duplicates; if a prior notable
      # comment exists and the run is now clean, it is updated to say so
      # (never left stale-red).
      - name: Publish perf report (step summary + conditional PR comment)
        if: always() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REGRESSION_COUNT: ${{ steps.perf.outputs.regression_count }}
          RUN_FAILURE_COUNT: ${{ steps.perf.outputs.run_failure_count }}
        run: |
          MARKER='<!-- perf-pr-fast-report -->'
          [ -s /tmp/perf-report.md ] || exit 0
          # 1. Always: full table to the run's Step Summary.
          cat /tmp/perf-report.md >> "$GITHUB_STEP_SUMMARY"
          # 2. Find a prior marker comment (update target), if any.
          existing_id=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            -q ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1) || existing_id=""
          # MISSING_COUNT is intentionally EXCLUDED — a pure missing-baseline
          # run must not post a PR comment (see policy note above). It still
          # reaches the step summary + Gate-decision ::notice::.
          notable=$(( ${REGRESSION_COUNT:-0} + ${RUN_FAILURE_COUNT:-0} ))
          if [ "$notable" -gt 0 ]; then
            # Comment body = trimmed verdict twin (regressing rows + per-scenario
            # verdict), NOT the full per-scope table — that already went to the
            # Step Summary above. Falls back to the report if the trim is empty.
            body_src=/tmp/perf-summary.md
            [ -s "$body_src" ] || body_src=/tmp/perf-report.md
            { echo "$MARKER"; cat "$body_src"; } > /tmp/perf-comment.md
            if [ -n "$existing_id" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" \
                -F body=@/tmp/perf-comment.md >/dev/null || true
            else
              gh pr comment "$PR" --body-file /tmp/perf-comment.md || true
            fi
          elif [ -n "$existing_id" ]; then
            # Clean run after a prior notable comment — update it, don't leave stale red.
            printf '%s\n## Perf delta — PR-fast subset\n\nAll scenarios within policy on the latest run (run %s). Full table: job Step Summary.\n' \
              "$MARKER" "${{ github.run_id }}" > /tmp/perf-comment.md
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" \
              -F body=@/tmp/perf-comment.md >/dev/null || true
          fi

      - name: Gate decision
        shell: bash
        env:
          REGRESSION_COUNT: ${{ steps.perf.outputs.regression_count }}
          RUN_FAILURE_COUNT: ${{ steps.perf.outputs.run_failure_count }}
          MISSING_COUNT: ${{ steps.perf.outputs.missing_baseline_count }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          # Read the override label from the LIVE API, not the frozen
          # github.event.pull_request.labels payload (which is snapshotted at the
          # triggering event — applying `perf-out-of-band` after a red run + re-run
          # replayed the stale payload -> override=false -> still red). Mirrors
          # coverage-gate.yml's live `gh pr view` query. (postmortems.md 2026-06-07.)
          override="false"
          labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null | tr '\n' ',' || echo "")"
          if echo ",$labels," | grep -q ',perf-out-of-band,'; then
            override="true"
          fi
          if [ "$MISSING_COUNT" -gt 0 ]; then
            echo "::notice::First-run bootstrap captured $MISSING_COUNT baseline(s). Review the uploaded artefacts + open a bootstrap PR to commit them under docs/perf/baselines/."
          fi
          # Plumbing failures (scenario.run missing output) normally fail
          # HARD regardless of the perf-out-of-band label — those are bugs
          # in the workflow / exe / build path, never intentional
          # regressions. (CodeRabbit PR #323 #1.)
          #
          # Exception: if NO baselines exist yet (first-run bootstrap
          # state on a fresh repo / fork) AND scenarios are failing, we
          # cannot distinguish "spawn-on-CI environment not yet wired up"
          # from "real plumbing break", because there's nothing to compare
          # against. Downgrade to WARN in that state so the workflow itself
          # can land + the bootstrap-PR cycle can begin. Once at least one
          # baseline is committed under docs/perf/baselines/<scen>.ci-
          # windows-latest.json, subsequent runs treat plumbing failures
          # as hard fails again.
          if [ "$RUN_FAILURE_COUNT" -gt 0 ]; then
            shopt -s nullglob
            existing_baselines=(docs/perf/baselines/*.ci-windows-latest.json)
            shopt -u nullglob
            if [ "${#existing_baselines[@]}" -eq 0 ]; then
              echo "::warning::$RUN_FAILURE_COUNT scenario(s) failed to run AND no ci-windows-latest baselines exist yet (first-run bootstrap state). Downgrading to WARN — fix the spawn / runner-environment before merging the first baseline."
            else
              echo "::error::$RUN_FAILURE_COUNT scenario(s) failed to run (plumbing / build / exe failure). perf-out-of-band label does NOT override this — fix the underlying break."
              exit 1
            fi
          fi
          if [ "$REGRESSION_COUNT" -gt 0 ]; then
            if [ "$override" = "true" ]; then
              echo "::warning::$REGRESSION_COUNT scenario regression(s) detected. Downgraded to WARN by perf-out-of-band label."
              exit 0
            fi
            echo "::error::$REGRESSION_COUNT scenario regression(s) exceeded docs/perf/regression-policy.json thresholds."
            exit 1
          fi
          echo "All scenarios within policy."
