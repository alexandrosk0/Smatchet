name: Verify Font Awesome 6 Solid TTF (committed, pinned)
description: >-
  Network-free sha256 check of the COMMITTED assets/fonts/fa-solid-900.ttf
  against a pinned, immutable Font Awesome tag. Single source of the font step
  that the UI-test / bucket / installer / release build jobs all share, so the
  tag + sha256 pin live in exactly one place (bump them here, in lockstep with
  the committed file). The directory keeps its historical `fetch-fontawesome`
  name so every `uses:` call site stays unchanged; the action takes no inputs
  and sets no outputs.

runs:
  using: composite
  steps:
    - name: Verify committed Font Awesome 6 Solid TTF (pinned sha256, no network)
      shell: bash
      env:
        # Pin to an immutable tag, not the mutable `6.x` branch — the bytes
        # committed under assets/fonts/ are the upstream file at this tag.
        FA_TAG: "6.7.2"
        # sha256 of fa-solid-900.ttf at tag 6.7.2. Bump in lockstep with FA_TAG
        # AND the committed assets/fonts/fa-solid-900.ttf.
        FA_SHA256: "af19d135d3a935b3ebfbd80320716ffe1202052c5f68dc2c5f1abc57005ac605"
      # No download: the TTF is committed, so this step reads only the checkout.
      # It used to curl the file from a single third-party host on every job
      # (six call sites, several on required checks); a 429 rate-limit window
      # (2026-07-09, 2026-08-17) and a transient upstream 404 (2026-08-18) each
      # redded otherwise-green required jobs, and `--retry-all-errors` burned
      # ~5 min per job re-asking a permanent 404. Verifying the committed bytes
      # against the same pin keeps the supply-chain guarantee with no network
      # dependency. Logic + messages: scripts/dev/verify-fontawesome.sh
      # (tests/bats/verify_fontawesome.bats).
      run: bash scripts/dev/verify-fontawesome.sh
