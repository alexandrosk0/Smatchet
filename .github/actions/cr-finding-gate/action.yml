name: CR finding gate
description: >-
  Posts a `CR findings (0 actionable)` commit StatusContext reflecting
  CodeRabbit's actionable-finding count on the PR's current head. Lifts the
  "0 actionable" semantics from agents/scripts/core/merge-gates.sh (client-side) to a
  server-side required check. Plan: gate-enforcement-hardening
  § Slice 3.

inputs:
  github-token:
    description: >-
      Token with statuses:write + pull-requests:read, plus pull-requests:write
      for the review auto-nudge. The nudge POSTs to the /issues/{n}/comments
      path, which reads like issues:write is enough — it is not. Fine-grained
      permissions are keyed on the TARGET type, not the endpoint path, and the
      target here is a pull request, so issues:write alone 403s
      ("Resource not accessible by integration"). That mistake shipped and
      went unnoticed for the whole life of the nudge feature, because the gate
      still functions read-only without the permission — the POST just warns
      and moves on, so the only symptom is a nudge that never appears.
    required: true
  pr-number:
    description: Pull-request number to evaluate.
    required: true
  head-sha:
    description: Head commit SHA the status is posted against.
    required: true

runs:
  using: composite
  steps:
    - name: Evaluate CodeRabbit actionable findings and post status
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr-number }}
        SHA: ${{ inputs.head-sha }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        # The required StatusContext name. Must match the develop branch-
        # protection entry exactly.
        CONTEXT: CR findings (0 actionable)
      run: |
        # GitHub runs composite-action bash steps with `-e` (errexit) injected:
        # `bash --noprofile --norc -e -o pipefail`. decide() deliberately
        # returns non-zero on its retry path, which under -e would abort the job
        # before any status is posted. Turn errexit OFF explicitly — this script
        # relies on explicit exit codes + checked returns, not errexit.
        set +e -uo pipefail

        post() {
          # $1 state (success|failure|pending|error), $2 description
          local state="$1" desc="$2"
          # GitHub truncates description at 140 chars.
          desc="${desc:0:140}"
          echo "CR finding gate -> ${state}: ${desc}"
          gh api "repos/${OWNER}/${REPO}/statuses/${SHA}" \
            -f state="${state}" \
            -f context="${CONTEXT}" \
            -f description="${desc}" >/dev/null \
            || echo "WARN: gh api statuses POST failed (fork PR / missing statuses:write?)" >&2
        }

        # --- Stale-evidence auto-nudge (shapes 1-2 of the 2026-08-12 entry) ----
        # A CodeRabbit review that COMPLETED can still leave the head with no
        # evidence this gate accepts: the auto-review attempt posts a rate-limit
        # SUCCESS status that never updates, and a later comment-triggered pass
        # on an incrementally-clean head replies its verdict as an ISSUE COMMENT
        # with no review object and no status refresh. Correct gate, wedged PR —
        # nothing ever re-triggers the reviewer (observed twice on the #1999
        # merge drive). Both times the manual fix was `@coderabbitai full
        # review`, which always submits a review object and refreshes the
        # status. Post that nudge from the gate itself instead of parking on
        # PENDING until a human intervenes. merge-gates.sh already has the
        # client-side twin (MERGE_GATES_STALE_REREVIEW_POLLS); this is the CI
        # side, for merges driven without the local poller.
        #
        # Guard rails:
        #   - RECENCY-ORDERED evidence, not mere presence: clean-pass prose has
        #     no head anchor, and a clean reply from an EARLIER head persists
        #     forever — trusting it blind would fire the nudge the moment a
        #     fresh head bounces on the rate limit, burning the once-per-head
        #     marker on a "limit reached" reply (and a rate-limit slot with
        #     it). So the nudge requires the newest clean-pass comment to be
        #     STRICTLY NEWER (updated_at) than every CR busy signal (rate-limit
        #     notice / review-in-progress edit). In the genuine wedge the clean
        #     reply IS CR's latest word; mid-review or mid-window it is not.
        #   - once per head: the nudge comment embeds `cr-full-review-nudge:
        #     <sha>`; a comment carrying the current head's marker suppresses
        #     re-posting forever (re-runs included).
        #   - budget-capped per PR (NUDGE_BUDGET, default 3 heads): a
        #     pathological push loop cannot spam the thread.
        #   - the persistent walkthrough comment is EXCLUDED as clean-pass
        #     evidence: CR edits it in place and its "No actionable comments…"
        #     text survives across heads. Its BUSY text does count as a busy
        #     signal — rate-limit and in-progress notices are edited into it.
        #   - a failed comment fetch nudges nothing: the dedup marker would be
        #     invisible and a re-run could double-post.
        #   - the nudge never decides the gate: callers still return
        #     non-terminal, and the triggered review's events re-run this
        #     workflow to a real verdict.
        NUDGE_BUDGET="${NUDGE_BUDGET:-3}"
        # How long a CR busy notice (rate limit / review-in-progress) keeps the
        # never-reviewed nudge quiet. CR quotes a rolling HOUR for its limit and
        # clears in-progress edits in minutes, so anything older cannot still be
        # holding a window open.
        NUDGE_BUSY_WINDOW_SECONDS="${NUDGE_BUSY_WINDOW_SECONDS:-3600}"
        nudge_attempted=false
        # $1 = mode:
        #   stale-clean    — CR's status is a stale not-a-review success while a
        #                    completed clean pass exists ONLY as a comment.
        #                    Nothing will ever re-trigger CR, so ask for a FULL
        #                    review (a plain `review` is a no-op once CR has
        #                    consumed the head as "already reviewed").
        #   never-reviewed — CR has not reviewed this head at all and is waiting
        #                    to be asked (`manual review required`, the default
        #                    state of every PR on a repo under 10 stars). A plain
        #                    `review` is the right ask, and there is no clean
        #                    pass to key on.
        maybe_nudge_review() {
          local mode="${1:-stale-clean}"
          # The poll loop calls decide() repeatedly — evaluate at most once per
          # action run (the cross-run dedup is the marker comment).
          [ "$nudge_attempted" = true ] && return 0
          nudge_attempted=true
          local marker command blurb
          case "$mode" in
            # Historical marker string preserved verbatim: a head that already
            # carries one from before this change must still dedup.
            stale-clean)
              marker="cr-full-review-nudge:${SHA}"
              command="@coderabbitai full review"
              blurb="CodeRabbit's status on head ${SHA:0:12} is a stale rate-limit success while a completed clean pass exists only as a comment — a full review creates current-head review evidence." ;;
            never-reviewed)
              marker="cr-first-review-nudge:${SHA}"
              command="@coderabbitai review"
              blurb="CodeRabbit has not reviewed head ${SHA:0:12} — its status says a manual review is required (this repository is under CodeRabbit's 10-star auto-review threshold). Requesting one so the gate has real review evidence instead of passing an unreviewed head." ;;
            *) return 0 ;;
          esac
          # `cmt`, not `body`: the bats suite extracts decide()'s jq programs
          # by literal substring markers keyed on decide()'s assignment names,
          # and this function sits earlier in the file — any line here that
          # contains such an assignment (even inside a comment) hijacks the
          # extraction and corrupts the suite's fixtures.
          local tsv rc login ts b64 cmt mine=false n_nudges=0
          local clean_ts="" busy_ts=""
          # login TAB updated_at TAB base64(body) per comment — base64 keeps
          # multiline bodies one-per-line so the loop sees whole comments;
          # ISO-8601 updated_at compares correctly as a plain string.
          tsv=$(gh api --paginate "repos/${OWNER}/${REPO}/issues/${PR}/comments?per_page=100" \
                  --jq '.[] | ((.user.login // "") + "\t" + (.updated_at // "") + "\t" + ((.body // "") | @base64))' 2>/dev/null)
          rc=$?
          [ "$rc" -eq 0 ] || return 0
          while IFS=$'\t' read -r login ts b64; do
            [ -n "$b64" ] || continue
            cmt=$(printf '%s' "$b64" | base64 -d 2>/dev/null) || continue
            # Markers are AUTHENTICATED by author: the nudge posts via the
            # workflow token, i.e. as github-actions[bot], so only that login's
            # markers count for the once-per-head dedup and the budget.
            # Trusting any commenter's text would let a forged
            # `cr-full-review-nudge:<sha>` (or three of them) suppress recovery
            # on a head that still lacks accepted review evidence — a
            # denial-of-recovery from a drive-by comment (CodeRabbit round-1
            # finding on this gate's own PR).
            if [ "$login" = "github-actions[bot]" ]; then
              # Budget counts BOTH nudge kinds: the cap exists to stop this gate
              # spamming a PR, and two half-budgets would double the ceiling.
              case "$cmt" in
                *cr-full-review-nudge:*|*cr-first-review-nudge:*) n_nudges=$((n_nudges + 1)) ;;
              esac
              case "$cmt" in *"$marker"*) mine=true ;; esac
            fi
            if [ "$login" = "coderabbitai[bot]" ] || [ "$login" = "coderabbitai" ]; then
              # Busy signals are matched on the NOTICE wording, deliberately
              # NOT on 'rate.?limit': CR's command replies quote stored repo
              # learnings verbatim, and ours contain "Review rate limited" —
              # matching that would mark the genuine clean reply itself busy
              # and suppress the nudge in exactly its target scenario.
              if printf '%s' "$cmt" | grep -qiE 'review limit reached|next review available|currently processing|review in progress by coderabbit'; then
                [ "$ts" \> "$busy_ts" ] && busy_ts="$ts"
              fi
              if ! printf '%s' "$cmt" | grep -q 'walkthrough_start' \
                 && printf '%s' "$cmt" | grep -qiE 'no actionable (comments|findings)'; then
                [ "$ts" \> "$clean_ts" ] && clean_ts="$ts"
              fi
            fi
          done <<< "$tsv"
          if [ "$mode" = "stale-clean" ]; then
            # Only meaningful when a completed clean pass is the newest CR word:
            # that is the state nothing else will ever re-trigger.
            [ -n "$clean_ts" ]                   || return 0
            [ "$clean_ts" \> "$busy_ts" ]        || return 0
          else
            # never-reviewed: there is NO clean pass to key on — requiring one is
            # exactly why the existing guard could not self-heal this state. The
            # rate-limit playbook still binds though: never post while a limit /
            # in-progress notice is ACTIVE, because a trigger inside an open
            # window RESETS the countdown (merge-gates.md rule 1), and a busy CR
            # is already engaged so the nudge is moot anyway.
            #
            # ACTIVE, not merely PRESENT. busy_ts is the newest busy comment over
            # the WHOLE thread with no recency bound, so `[ -z "$busy_ts" ]`
            # suppressed the nudge forever once a PR had been rate-limited even
            # once — which on this repo is nearly every PR, leaving the gate
            # PENDING with nothing able to un-park it (CodeRabbit, #2036). The
            # prose here already said "newest word"; only the test was stricter.
            #
            # Sized to CR's own limit: its notices quote a rolling HOUR, and
            # in-progress edits clear in minutes, so a busy notice older than the
            # window cannot still be holding anything.
            if [ -n "$busy_ts" ]; then
              # A `date` that cannot do relative math leaves cutoff empty, and
              # then we keep the OLD conservative behaviour (suppress). Failing
              # the other way would post into a live window and reset CR's
              # countdown — the one outcome the playbook forbids.
              # Digits-only, defaulted IN the function: an empty or garbage
              # window is not an error to `date` — GNU date reads `-d "- seconds"`
              # as NOW, which would put the cutoff at the present instant and let
              # every busy notice read as expired. That is a fail-OPEN on the one
              # guard whose whole job is to not post into a live window, and it
              # is invisible (rc=0). Resolving here also keeps the function
              # self-contained for the bats harness, which extracts it alone.
              local busy_win="${NUDGE_BUSY_WINDOW_SECONDS:-3600}"
              case "$busy_win" in ''|*[!0-9]*) busy_win=3600 ;; esac
              local busy_cutoff
              busy_cutoff="$(date -u -d "-${busy_win} seconds" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || true)"
              # Belt-and-braces, deliberately NOT load-bearing: an empty cutoff
              # already fails the `\<` below (nothing sorts before ""), so the
              # guard is suppress-either-way and no test can distinguish it.
              # Kept because it states the fail-safe DIRECTION explicitly — if
              # the comparison is ever rewritten, the intent survives the edit
              # instead of depending on a string-compare side effect.
              [ -n "$busy_cutoff" ] || return 0
              [ "$busy_ts" \< "$busy_cutoff" ] || return 0
            fi
          fi
          [ "$mine" = false ]                    || return 0
          [ "$n_nudges" -lt "$NUDGE_BUDGET" ]    || return 0
          echo "CR finding gate: posting ${command} nudge (${mode} on ${SHA:0:12})"
          gh api "repos/${OWNER}/${REPO}/issues/${PR}/comments" \
            -f body="${command}

        <!-- ${marker} -->
        _Auto-posted by the CR finding gate: ${blurb}_" >/dev/null \
            || echo "WARN: nudge comment POST failed (missing pull-requests:write? the /issues/ path needs it — permissions key on target type, not path)" >&2
        }

        # --- Override label (mirrors merge-gates.sh out-of-band pattern) -------
        # `cr-out-of-band` lets a maintainer force-pass this gate, consistent
        # with the tests-out-of-band / perf-out-of-band downgrade mechanism.
        labels=$(gh api "repos/${OWNER}/${REPO}/issues/${PR}/labels" --jq '.[].name' 2>/dev/null || true)
        if printf '%s\n' "$labels" | grep -qx 'cr-out-of-band'; then
          post success "cr-out-of-band label set — gate overridden"
          exit 0
        fi

        # --- Dependabot github-actions SHA bumps (auto-pass) ------------------
        # CodeRabbit's auto_review never engages on Dependabot PRs (observed: no
        # review node ever appears and CR posts no "CodeRabbit" StatusContext),
        # so without this branch the gate hangs on PENDING forever — the same
        # "stuck awaiting review" wedge as PR #536, but un-retriggerable because
        # CR never acts. SCOPED to the github-actions ecosystem (head ref
        # dependabot/github_actions/*, the only ecosystem in .github/dependabot.yml):
        # mechanical version pins with nothing for a reviewer to action, while the
        # build/test/lint gates still run in full. A NON-actions bump (npm/pip/…,
        # if ever added) carries real supply-chain surface and must NOT auto-pass
        # — it falls through to the normal CR poll so CR / a human actually reviews
        # it. Human PRs are never auto-passed. NOTE: `[bot]` is a glob char class,
        # so the author is matched with explicit string equality, not `case`.
        pr_author=$(gh api "repos/${OWNER}/${REPO}/pulls/${PR}" --jq '.user.login' 2>/dev/null || true)
        pr_head_ref=$(gh api "repos/${OWNER}/${REPO}/pulls/${PR}" --jq '.head.ref' 2>/dev/null || true)
        is_actions_bump=false
        case "$pr_head_ref" in
          dependabot/github_actions/*) is_actions_bump=true ;;
        esac
        if { [ "$pr_author" = "dependabot[bot]" ] || [ "$pr_author" = "dependabot" ]; } && [ "$is_actions_bump" = true ]; then
          post success "Dependabot github-actions bump (${pr_author}, ${pr_head_ref}) — CR does not auto-review bot PRs; build/test/lint still enforced"
          exit 0
        fi

        # --- Self-improvement-only PR (auto-pass) ------------------------------
        # A PR whose diff is ENTIRELY under docs/self-improvement/** is the
        # backlog / postmortem ledger: markdown that is never compiled and is
        # path-excluded by .coderabbit.yaml (`!docs/self-improvement/**`), so CR
        # posts "Review skipped due to path filters" and NEVER produces a review
        # node or a CodeRabbit StatusContext — wedging this required gate on
        # PENDING forever (observed #1718). merge-gates.sh already exempts these
        # client-side ($selfImpOnly; user ask 2026-06-20, plan
        # self-improvement-pr-review-exemption); lift the SAME verdict to the
        # server gate so the exemption survives a native / non-poller merge.
        #
        # Fail-safe to the normal CR path on ANY uncertainty (mirrors the
        # merge-gates.sh guards): an empty file list or a gh error falls through
        # — never auto-pass without proof EVERY path is under the exempt prefix.
        # `--paginate` follows every page (the REST per_page is capped at 100, so
        # a first-page-only fetch would be blind to a code file at position 101+);
        # the line-based count sees the full diff.
        #
        # FAIL CLOSED on a gh error: `--paginate` that dies on a LATER page still
        # emits the earlier pages, so `|| true` + a non-empty check would treat
        # that partial list as complete and a code file on the unfetched page
        # would be invisible — a >100-file code PR whose first page is all
        # self-improvement could then auto-pass. Capture the exit code and require
        # rc==0 before trusting the list (CodeRabbit #1724).
        files_list=$(gh api --paginate "repos/${OWNER}/${REPO}/pulls/${PR}/files?per_page=100" \
                       --jq '.[].filename' 2>/dev/null)
        files_rc=$?
        if [ "$files_rc" -eq 0 ] && [ -n "$files_list" ]; then
          n_files=$(printf '%s\n' "$files_list" | grep -c . || true)
          n_outside=$(printf '%s\n' "$files_list" | grep -cv '^docs/self-improvement/' || true)
        else
          n_files=0; n_outside=1   # gh error (partial/none) or empty — fail closed
        fi
        if [ "${n_files:-0}" -gt 0 ] && [ "${n_outside:-1}" -eq 0 ]; then
          post success "self-improvement-only diff (${n_files} file(s) under docs/self-improvement/**) — CR review exempt"
          exit 0
        fi

        # --- Is CodeRabbit installed? (probe .coderabbit.yaml/.yml) ------------
        # Fall through to PASS when CR is not installed — same posture as
        # merge-gates.sh (a repo without CR must not be blocked by this gate).
        # Probe at the PR head SHA (not the default branch) so a PR that
        # adds/removes .coderabbit.y*ml is evaluated against its own state.
        #
        # H12 (fail-closed): a confirmed HTTP 404 means the file is truly absent
        # → cr_installed=false. ANY other non-zero exit (auth, network, 5xx,
        # rate-limit) is a TRANSIENT failure, NOT proof of absence — collapsing
        # it to cr_installed=false would post "CR not installed", exit 0, and
        # wave the PR through with its CodeRabbit findings UN-REVIEWED. So treat
        # every non-404 error as installed (fail closed) and let the poll loop /
        # decide() block on unknown CR state. Mirrors merge-gates.sh:200-223.
        probe_404() {
          # Echoes "404" iff the gh api error body is a confirmed HTTP 404;
          # echoes "ok" on success; echoes "err" on any other non-zero exit.
          local path="$1" out rc=0
          out=$(gh api "repos/${OWNER}/${REPO}/contents/${path}?ref=${SHA}" 2>&1 >/dev/null) || rc=$?
          if [ "$rc" -eq 0 ]; then echo ok; return; fi
          if printf '%s' "$out" | grep -q "HTTP 404"; then echo 404; else echo err; fi
        }
        cr_installed=true
        yaml_probe=$(probe_404 .coderabbit.yaml)
        if [ "$yaml_probe" = 404 ]; then
          # .yaml confirmed absent; check .yml before concluding not-installed.
          yml_probe=$(probe_404 .coderabbit.yml)
          if [ "$yml_probe" = 404 ]; then
            cr_installed=false   # both files confirmed 404 — truly absent
          elif [ "$yml_probe" = err ]; then
            echo "WARN: .coderabbit.yml probe failed with non-404 error; assuming CR installed (fail closed)" >&2
          fi
        elif [ "$yaml_probe" = err ]; then
          echo "WARN: .coderabbit.yaml probe failed with non-404 error; assuming CR installed (fail closed)" >&2
        fi
        if [ "$cr_installed" = false ]; then
          post success "CodeRabbit not installed — gate not applicable"
          exit 0
        fi

        # Latest CR review whose commit.oid == headRefOid; CR posts "Actionable
        # comments posted: N" as the first body line. Also pull the head's
        # "CodeRabbit" StatusContext so a skipped review (no review node) can
        # still be resolved.
        q='query($owner:String!,$repo:String!,$pr:Int!){
          repository(owner:$owner,name:$repo){
            pullRequest(number:$pr){
              headRefOid
              reviews(first:100){
                nodes{ author{login} state submittedAt commit{oid} body }
              }
              commits(last:1){
                nodes{ commit{ statusCheckRollup{ contexts(first:100){
                  nodes{ __typename ... on StatusContext{ context state description } }
                } } } }
              }
            }
          }
        }'

        # decide(): one evaluation pass. Terminal verdicts call post + exit 0.
        # Returns 1 (non-terminal) only when CR has not yet settled on this head,
        # so the poll loop below can retry. ubuntu-latest ships jq; parse the
        # GraphQL response directly (merge-gates.sh is jq-free only for the local
        # Windows dev env).
        decide() {
          local resp n_reviews cr_ctx body n
          # On a transient GraphQL failure, do NOT post error + exit — that would
          # bypass the poll loop and leave a false blocking status on a brief API
          # blip. Return non-terminal so the loop retries; persistent failure is
          # surfaced as error only after the window is exhausted (see below).
          if ! resp=$(gh api graphql -f query="$q" \
                        -F owner="${OWNER}" -F repo="${REPO}" -F pr="${PR}" 2>/dev/null); then
            return 1
          fi
          any_fetch_ok=true

          # Count CR reviews on the current head that actually CARRY A VERDICT —
          # i.e. have a non-blank top-level body.
          #
          # Replying to a review thread creates a review node with an EMPTY body
          # (true for CR and for humans alike). Such a node is a reply artifact,
          # not a review result. Counting it was a permanent wedge, not a race:
          # n_reviews>0 skips the StatusContext disambiguation below, then the
          # body-parse branch finds no "Actionable comments posted:" header in an
          # empty body and fail-closes to a retry — every pass, forever, because
          # nothing ever displaces that reply as the latest on-head review. The
          # gate sat PENDING on a head CR had fully reviewed and marked SUCCESS
          # (PR #1996, head 51c74fe: CR replied to a resolved thread at 03:28:20,
          # and the 04:30 run still reported "awaiting CodeRabbit review").
          #
          # Blank-bodied nodes are therefore invisible here: they are evidence of
          # neither "reviewed" nor "findings". With only replies on the head the
          # count is 0 and CR's own StatusContext decides, which is exactly the
          # no-review-node case. This does NOT loosen the #524 fail-closed rule —
          # a review with a NON-blank body but no count header still fail-closes
          # below, and a review with findings always carries the header.
          n_reviews=$(printf '%s' "$resp" | jq -r '
            .data.repository.pullRequest as $pr
            | ($pr.headRefOid // "") as $oid
            | [ $pr.reviews.nodes[]
                | select((.author.login == "coderabbitai" or .author.login == "coderabbitai[bot]")
                         and (.commit.oid // "") == $oid
                         and ((.body // "") | test("\\S"))) ] | length
            ' 2>/dev/null) || n_reviews=0
          n_reviews="${n_reviews//[^0-9]/}"; n_reviews="${n_reviews:-0}"

          if [ "$n_reviews" -eq 0 ]; then
            # A terminal "Review skipped … path filters" case (every changed file
            # path-excluded by .coderabbit.yaml) is handled UP FRONT for the only
            # exempt set we can verify head-accurately: the docs/self-improvement/**
            # selfImpOnly file-list check above. A comment-body-based skip pass was
            # tried here but dropped (CodeRabbit #1724): CR's skip summary comment
            # carries no reliable head-commit anchor, so a stale skip comment from an
            # earlier docs-only commit could pass a LATER code commit before CR
            # re-reviewed it — a fail-open race. Any other path-excluded (non-self-
            # improvement) PR falls through to the StatusContext disambiguation
            # below, or the cr-out-of-band label, rather than trusting an unanchored
            # comment.
            #
            # No CR review node on this head. Disambiguate via CR's own
            # "CodeRabbit" StatusContext on the head commit:
            #   SUCCESS -> CR is done and skipped the review (trivial / workflow
            #              / docs change). No review node == nothing actionable
            #              -> PASS. Without this every CR-skipped PR wedges on
            #              PENDING once the gate is required.
            #   FAILURE/ERROR -> CR reported a problem -> FAIL.
            #   else (PENDING/EXPECTED/absent) -> still working -> retry.
            # The SUCCESS->pass shortcut is reached ONLY with no review node; a
            # review WITH findings is caught by the n>0 branch (CR's chill
            # profile keeps its StatusContext green even with findings, so we
            # never lean on it to detect findings).
            cr_ctx=$(printf '%s' "$resp" | jq -r '
              [ .data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                | select(.__typename == "StatusContext" and .context == "CodeRabbit") | .state ] | (.[0] // "ABSENT")
              ' 2>/dev/null) || cr_ctx="ABSENT"
            cr_ctx="${cr_ctx//[^A-Z]/}"

            # SUCCESS alone is NOT proof a review happened. When CodeRabbit is
            # rate limited it posts state=SUCCESS with description "Review rate
            # limited" — a review that never ran, published as a green (observed
            # on this PR, head 51c74fe, 03:28:01). Reading only .state, the
            # branch below would translate that into "completed with no review
            # on head (skipped/clean)" and pass an entirely unreviewed commit.
            #
            # That fail-open was previously masked: the blank-reply wedge fixed
            # alongside this kept the gate PENDING and never reached here. Fixing
            # the wedge without this would have TURNED a stuck check INTO a false
            # green — strictly worse, and precisely the escape class this gate
            # exists to prevent. The two changes must ship together.
            #
            # Scoped to the known not-a-review marker rather than a whitelist of
            # acceptable descriptions: this gate's history is a string of wedges
            # (#536, #1718, #1724, #1954), so an unrecognised description must
            # keep its existing pass behaviour instead of hanging every PR. CR
            # itself recorded this rule as a repo learning on 2026-08-11.
            cr_desc=$(printf '%s' "$resp" | jq -r '
              [ .data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                | select(.__typename == "StatusContext" and .context == "CodeRabbit")
                | (.description // "") ] | (.[0] // "")
              ' 2>/dev/null) || cr_desc=""
            if [ "$cr_ctx" = "SUCCESS" ] \
               && printf '%s' "$cr_desc" | grep -qiE 'rate.?limit|limit reached'; then
              # Not settled: CR has not reviewed this head yet. The poll window
              # will not outlive a multi-minute limit, so this resolves to
              # PENDING and the workflow's CR-comment trigger re-runs it once the
              # real review lands. Never green on an unreviewed head. But when a
              # completed clean pass is advertised ONLY in comments while this
              # stale status sits here, nothing will ever re-trigger CR — post
              # the full-review nudge (once per head, budget-capped) so the wedge
              # self-heals instead of waiting on a human.
              maybe_nudge_review stale-clean
              return 1
            fi

            # Second not-a-review marker, same fail-open, different string:
            # `Review skipped: manual review required for this OSS repository`.
            # CodeRabbit auto-reviews only repos at/above 10 stars; below that it
            # posts this status on EVERY PR at creation and waits to be asked. So
            # this is not "CR is done and skipped a trivial change" (the case the
            # SUCCESS->pass shortcut below is for) — it is "CR has not looked".
            # Passing it made the gate green-BY-DEFAULT on unreviewed code:
            # observed on #2028, green 13s after the status appeared and then
            # 11.5h at mergeable_state=clean with all 36 checks green and zero
            # review; only a human applying the repo learning stopped the merge.
            #
            # Matched on `manual review required`, NOT a bare `review skipped`:
            # CR's path-filter skip reads "Review skipped due to path filters"
            # and IS terminal (nothing to review), so a broad match would wedge
            # every legitimately path-excluded PR that is not caught by the
            # selfImpOnly check above — trading a fail-open for a fail-shut.
            if [ "$cr_ctx" = "SUCCESS" ] \
               && printf '%s' "$cr_desc" | grep -qi 'manual review required'; then
              maybe_nudge_review never-reviewed
              return 1
            fi

            case "$cr_ctx" in
              SUCCESS)       post success "CodeRabbit completed with no review on head (skipped/clean)"; exit 0 ;;
              FAILURE|ERROR) post failure "CodeRabbit check reported ${cr_ctx} on current head"; exit 0 ;;
              # Not settled — let the poll loop retry. But shape 2 can wedge
              # HERE, not just in the rate-limit branch: a comment-triggered
              # pass on an incrementally-clean head can complete as an issue
              # comment with no review object AND no StatusContext on the head
              # at all (cr_ctx ABSENT). The recency guard inside the nudge
              # keeps it quiet while CR is genuinely still working (the
              # in-progress / rate-limit edits are newer than any clean reply).
              *)             maybe_nudge_review stale-clean; return 1 ;;
            esac
          fi

          # FULL body of the latest VERDICT-CARRYING on-head CR review. #524: the
          # previous parse looked at only the FIRST body line, so a CR preamble
          # line above the "Actionable comments posted: N" header hid it → the
          # empty-n branch posted SUCCESS and waved findings through (fail open).
          # Search the whole body instead.
          #
          # The blank-body filter must match the n_reviews selection above, and
          # for a second reason: `last` is by submittedAt, so a thread reply
          # posted AFTER a real review would otherwise be selected, blanking the
          # body and fail-closing a head that genuinely reported its count. Both
          # selections therefore skip blank-bodied reply nodes.
          body=$(printf '%s' "$resp" | jq -r '
            .data.repository.pullRequest as $pr
            | ($pr.headRefOid // "") as $oid
            | [ $pr.reviews.nodes[]
                | select((.author.login == "coderabbitai" or .author.login == "coderabbitai[bot]")
                         and (.commit.oid // "") == $oid
                         and ((.body // "") | test("\\S"))) ]
            | sort_by(.submittedAt) | last
            | if . == null then "" else (.body // "") end
            ' 2>/dev/null) || body=""
          body="${body//$'\r'/}"

          n=$(printf '%s' "$body" | grep -oiE 'Actionable comments posted:[[:space:]]*[0-9]+' \
                | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$n" ]; then
            # Shape 3 (2026-08-12 entry, observed #2002 round 12): a clean pass
            # that carries only nitpicks omits the "Actionable comments posted:
            # N" header from the review body entirely, while a review WITH
            # findings always carries it. Treating every header-less body as
            # unsettled wedged the gate PERMANENTLY — the review it retried for
            # had already happened, and `@coderabbitai full review` re-wedges it
            # (the fresh review is clean again, omits the header again). So: an
            # on-head CR review whose header-less body still shows the
            # OBSERVED clean-with-nitpicks shape IS a settled clean verdict.
            # Two-sided discrimination, because this gate's history is a
            # string of CR-format wedges (#536, #1718, #1724, #1954) and the
            # symmetric risk here is a FORMAT-DRIFTED findings header (e.g.
            # "Actionable comments: 3") slipping past the count parse above
            # and going green on furniture alone:
            #   - positive: the nitpick section must be present (the shape
            #     that was actually observed to wedge) — generic review
            #     furniture ("Review details" etc.) appears in every CR body
            #     and proves nothing;
            #   - negative: no line may pair "actionable" with a digit — a
            #     drifted count header would, while clean prose ("No
            #     actionable comments were generated") does not.
            if printf '%s' "$body" | grep -qiE 'nitpick comments' \
               && ! printf '%s' "$body" | grep -i 'actionable' | grep -q '[0-9]'; then
              post success "CodeRabbit clean review on current head (nitpicks only, no actionable-count header)"; exit 0
            fi
            # Fail closed: we ARE in the n_reviews>0 branch (a CR review node
            # exists on this head) yet its body carries no actionable-count
            # header and none of CR's review furniture. That is an unexpected/
            # unsettled state, NOT proof of "0 actionable" — do not post
            # success. Return non-terminal so the poll loop retries; a
            # persistently header-less review resolves to PENDING at
            # window-exhaustion (a human/CR re-run settles it), never green.
            return 1
          fi
          if [ "$n" -gt 0 ]; then
            post failure "CodeRabbit posted ${n} actionable finding(s) on current head"; exit 0
          fi
          post success "CodeRabbit: 0 actionable findings on current head"; exit 0
        }

        # Poll loop: catches the CR-skip case where CR only flips its
        # StatusContext (no review/comment event re-triggers this workflow).
        # ~3 min total — long enough for a skip decision, short of a real
        # review (those re-trigger via pull_request_review events anyway).
        #
        # Bounded by a WALL-CLOCK deadline, not a fixed attempt count. The
        # previous `ATTEMPTS=12` + `sleep 15` form only bounded the *sleeping*
        # (165 s); its true cost was that plus 12 GraphQL round-trips, which is
        # unbounded from this step's point of view. On a congested runner the
        # job's timeout-minutes fired first and killed the step mid-`sleep`,
        # BEFORE either terminal `post` ran — so the required check went
        # non-terminal, the StatusContext kept whatever value it already had,
        # and nothing re-triggered the workflow: the PR wedged with no
        # self-healing path (observed on PR #1954). A deadline makes the exit
        # time an invariant of this step rather than a consequence of API
        # latency.
        #
        # POLL_BUDGET_SECONDS must stay below the Evaluate step's
        # timeout-minutes, which must stay below the job's — asserted by
        # tests/bats/cr_finding_gate.bats. The step-level timeout is what lets
        # the workflow's `if: always()` fallback poster still run; a job-level
        # kill would take the fallback down with it.
        POLL_BUDGET_SECONDS="${POLL_BUDGET_SECONDS:-180}"
        POLL_INTERVAL_SECONDS="${POLL_INTERVAL_SECONDS:-15}"
        any_fetch_ok=false   # set true by decide() on any successful fetch
        deadline=$(( SECONDS + POLL_BUDGET_SECONDS ))
        while :; do
          decide   # exits on a terminal verdict; falls through on retry
          # Stop once another interval plus the pass after it would not fit in
          # the budget, so the window always closes with time left to post.
          [ $(( SECONDS + POLL_INTERVAL_SECONDS )) -lt "$deadline" ] || break
          sleep "$POLL_INTERVAL_SECONDS"
        done
        # Window exhausted. If not a single fetch succeeded, the GraphQL API was
        # down the whole time -> surface error. Otherwise CR simply hasn't
        # settled on this head -> PENDING; a later review event or re-run
        # resolves it.
        if [ "$any_fetch_ok" = false ]; then
          post error "GraphQL query failed on every attempt (transient API issue?)"
        else
          post pending "awaiting CodeRabbit review on current head"
        fi
