query($owner: String!, $repo: String!, $pr: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $pr) {
      state
      isDraft
      reviewDecision
      headRefOid
      headRefName
      labels(first: 50) {
        pageInfo { hasNextPage }
        nodes { name }
      }
      commits(last: 1) {
        nodes {
          commit {
            statusCheckRollup {
              contexts(first: 100) {
                pageInfo { hasNextPage }
                nodes {
                  __typename
                  ... on CheckRun {
                    name
                    conclusion
                    status
                    # startedAt drives latest-per-name dedup: when a job is
                    # rerun, GitHub keeps both the old (FAILURE) + new (SUCCESS)
                    # rollup nodes. We pick the one with the latest startedAt
                    # per name so stale FAILUREs don't falsely block merge.
                    startedAt
                    isRequired(pullRequestNumber: $pr)
                  }
                  ... on StatusContext {
                    context
                    state
                    isRequired(pullRequestNumber: $pr)
                  }
                }
              }
            }
          }
        }
      }
      reviews(first: 100) {
        pageInfo { hasNextPage }
        nodes {
          author { login __typename }
          state
          submittedAt
          commit { oid }
          # Body — load-bearing for the three-bucket CR check (CURRENT_FINDINGS,
          # STALE_WITH_FINDINGS, STALE_CLEAN) per
          # docs/backlog/agent-self-improvement/process.md P1. CR posts
          # "Actionable comments posted: N" as the first line of its review body;
          # the poller parses N to distinguish a real-findings review (block) from
          # a clean review (pass) regardless of state==COMMENTED.
          body
        }
      }
      reviewThreads(first: 100) {
        pageInfo { hasNextPage }
        nodes {
          isResolved
          isOutdated
          comments(first: 100) {
            pageInfo { hasNextPage }
            nodes { author { login __typename } }
          }
        }
      }
      comments(first: 100) {
        pageInfo { hasNextPage }
        nodes { author { login __typename } }
      }
    }
  }
}
