## CodeRabbit configuration for Smatchet.
##
## Authoritative project rules live in `AGENTS.md` at the repo root — the
## `path_instructions` below cite those rules so CodeRabbit's reviewer
## agrees with them instead of suggesting C++17 features, GLFW headers in
## shared core, etc.
##
## Triage + routing of CodeRabbit feedback into Smatchet subsystem agents
## is owned by `agents/core/coderabbit-triage.md`.

language: en-US
early_access: false
tone_instructions: |
  Terse. Drop pleasantries. Cite file:line. One-line per finding when possible.
  Never suggest C++17/20 features in this repo (see C++14 hard rule).

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - develop
      - main

  ## Skip vendored / generated / lock-render artefacts — reviewing them is
  ## pure noise. `docs/self-improvement/**` (the agent system's own backlog /
  ## postmortem ledger — per-entry backlog files, postmortems.md, applied.md)
  ## is excluded too: a PR whose diff is entirely under it has nothing
  ## reviewable, so CR posts its terminal "Review skipped" status, which the
  ## merge-gate fast-passes via crReviewSkipped (see merge-gates.sh + plan
  ## docs/plans/self-improvement-pr-review-exemption.md). Bugbot's
  ## symmetric auto-skip lives in merge-gates.sh ($selfImpOnly).
  path_filters:
    - '!build/**'
    - '!**/.fetchcontent-src/**'
    - '!**/*-build-dir/**'
    - '!Source/UnrealPlugins/SmatchetImGuiPlugin/ThirdParty/**'
    - '!docs/plans/active/_plan-locks.generated.md'
    - '!docs/plans/active/_plan-locks-archive.md'
    - '!docs/self-improvement/**'
    - '!.session-context*'
    - '!.claude/**'
    - '!.codex/**'
    - '!.cursor/**'
    - '!**/*.min.js'
    - '!**/*.lock'

  ## Per-path review rules. The body of each instruction is read by the
  ## CodeRabbit reviewer agent verbatim — keep them concrete and citable.
  path_instructions:
    - path: 'Source/Core/**/*.{cpp,h}'
      instructions: |
        C++14 hard (must build on MSVC + MinGW UCRT). Do NOT suggest any of:
        `std::string_view`, `std::optional`, `std::variant`, structured
        bindings (`auto [a,b] = ...`), `if constexpr`, designated
        initialisers. Logging uses `LOG_DEBUG/INFO/WARN/ERROR/TRACE` from
        `Logger.h` only — flag (or reject) any `printf` / `std::cerr` /
        `std::cout` / `fprintf(stderr,...)`. RAII strict: no raw `new` /
        `delete` outside the documented sol2 / ImGui-callback edge cases —
        require `std::unique_ptr` + `make_unique`. nlohmann json:
        `obj["k"] = v` style only — `obj = {...}` brace-list reassignment
        does not compile. Prefer `const&` for non-trivial params,
        `std::move` on last owning use (no use-after-move).
    - path: 'Source/Core/include/**/*.h'
      instructions: |
        Shared header — also compiled into the DX12 / Unreal target. Do NOT
        suggest adding GLFW, glad, OpenGL, or any window-system include
        here. Do NOT redefine `IMGUI_USE_WCHAR32` (it is PUBLIC on
        `ImGuiLib`). Platform-specific code must be gated on
        `SMATCHET_EMBEDDED_IN_UNREAL`, `SMATCHET_WITH_MCP`, or
        `SMATCHET_WITH_LUA_AUTOMATION`.
    - path: 'Source/Core/{src,include}/Commands/**'
      instructions: |
        Unified command system (CLI + Palette + MCP + Lua + Scenarios).
        Every command takes `const CommandContext&`, returns the structured
        error envelope, defaults `args` to `{}`. Routes go through
        `CommandRegistry` — flag any bypass.
    - path: 'Source/Core/**/{Tracker,Jira,Plane,IssueCreate}*.{cpp,h}'
      instructions: |
        Backend-specific code (`Jira*`, `Plane*`) MUST NOT leak into
        `ITrackerBackend.h` or other shared interfaces. HTTP goes through
        `TrackerHttpClient` — flag direct `cpr::` usage in feature files.
        Field-value flow: catalog → parser → payload (no bypasses).
        Tracker writes must wire to `OfflineQueueService` +
        `BackendAuditTrail` / `FieldEditAuditSource`.
    - path: 'Source/Core/**/{LocalCacheManager,OfflineQueueService,TicketSyncService,BackendAuditTrail}*.{cpp,h}'
      instructions: |
        SQLite schema changes are additive only — flag drops, renames, or
        type changes. Offline-queue replay must remain idempotent + survive
        partial replay on crash.
    - path: 'Source/Core/**/Smatchet*Ui*.{cpp,h}'
      instructions: |
        UI thread is render-only — flag any synchronous `cpr::Get/Post`,
        `SQLite::Database` call, `p4` subprocess, `std::ifstream`-on-disk,
        `std::thread::join` (outside shutdown), or `std::mutex::lock` that
        is reachable from `ImGui::*` frame. Workers post results back via
        `MainThreadDispatcher::PostToMainThread`. Budget = 6.94 ms / frame
        (144 Hz target).
    - path: 'Source/Plugins/Mcp/**'
      instructions: |
        MCP wire protocol = JSON-RPC. Tool schemas live in `Source/Plugins/Mcp/`
        and `SmatchetMcpServerUi`. Tools added here must also flow through
        `CommandRegistry` — flag direct registration.
    - path: 'Source/Core/src/AppController_Lua*.cpp'
      instructions: |
        `AppController_LuaBindings.cpp` (ON) and `AppController_LuaStubs.cpp`
        (OFF) MUST stay in shape-parity — every binding added on one side
        needs the matching stub on the other.
    - path: 'scripts/**/*.lua'
      instructions: |
        Lua runs inside `LuaAutomationHost` sandbox. Hot-path Lua calls
        cost ~50–60× the C++ equivalent — flag per-frame sol2 bindings.
    - path: 'tests/**/*.{cpp,h,hpp}'
      instructions: |
        Doctest rig (`SMATCHET_BUILD_TESTS`, `ninja-test-msvc` preset). No
        UI / HTTP / ImGui / cpr / `p4` subprocess / on-disk-or-networked I/O
        surfaces — those route to bucket-E (ImGui Test Engine) or stay
        deferred. SERVICE tests (OfflineQueueService / TicketSyncService /
        IssueCreatePipeline TUs + the deps fakes) are SQLite-free since the
        ADR-0020 `ISyncCache` seam: they run on `tests/support/FakeSyncCache.h`
        and must NOT construct `LocalCacheManager` or include
        `LocalCacheManager.h`/`SqliteMemFixture.h` (configure-time purity guard
        in tests/CMakeLists.txt enforces this). `:memory:` SQLite remains
        legitimate ONLY for the cache-impl TUs (`LocalCacheManager*.test.cpp`,
        `LocalCacheTicketsV2Migration.test.cpp`), the dual-impl
        `SyncCacheContract.test.cpp` real half, and the single
        `OfflineQueueServiceRealCacheSmoke.test.cpp` backstop — do not flag
        those; DO flag on-disk / networked DB access anywhere. Scoped to C++
        test sources: `tests/bats/**` are shell / python integration suites for
        tooling (merge-watcher, merge-gates, lock primitives) that legitimately
        invoke scripts, so the rule does not apply to them.
    - path: '{CMakeLists.txt,cmake/**,CMakePresets.json,Source/Core/CMakeLists.txt,Source/Plugins/**/CMakeLists.txt,Source/UnrealPlugins/**/CMakeLists.txt}'
      instructions: |
        `*_DX12` targets are `EXCLUDE_FROM_ALL` (Unreal only) — do NOT
        suggest changes there unless the diff explicitly targets them.
        Available FetchContent libs: nlohmann/json, cpr, SQLiteCpp,
        cpp-httplib, md4c, ImGui (docking), GLFW, Lua + sol2,
        ghc::filesystem — do NOT propose adding new dependencies.
    - path: 'agents/**/*.md'
      instructions: |
        Agent definitions (`agents/core/*.md`, `agents/project/*.md`) carry a
        YAML frontmatter block whose capability list is spelled `capabilities:`
        (a YAML list) — NOT `capability-tags`, `capability_tags`, or `tags`. Do
        NOT flag the frontmatter as "missing a capabilities/capability-tags
        field" when `capabilities:` is present under a different-but-correct
        name; the field IS there. The capability set is CLOSED (the
        capability-tag → tool mapping lives in
        `docs/harness/capability-adapter.md`) — do NOT suggest adding new
        capability tags, renaming the field, or "standardising" it to
        `capability-tags`. The optional `harness-hints.<harness>:` blocks
        (e.g. `harness-hints.claude:`) are INTENTIONAL per-harness routing
        metadata (model selection, MCP tool lists) — harnesses ignore unknown
        blocks, so do NOT flag them as unknown/unsupported keys. The top-level
        `model:` key is likewise INTENTIONAL — it mirrors
        `harness-hints.claude-code.model` (the Claude Code native routing
        wire; parity enforced by `test-agent-contract.sh` check 15) — do NOT
        flag it as redundant with the hint or suggest removing either copy.
    - path: 'docs/plans/**'
      instructions: |
        Plan docs live in THREE tiers — `docs/plans/active/<slug>.md` (in
        flight), `docs/plans/shipped/<slug>.md` (done), and
        `docs/plans/deferred/<slug>.md` (parked). Cross-references between
        docs use the TIER-LESS, MOVE-PROOF form `docs/plans/<slug>.md` (NO
        `active/` / `shipped/` / `deferred/` segment): the link checkers
        (`test-plan-ref-integrity`, `test-markdown-links`) resolve it against
        whichever tier currently holds the file, so a `git mv` between tiers
        can never break a reference. Do NOT suggest "fixing" a tier-less
        `docs/plans/<slug>.md` reference by adding the tier segment, and do
        NOT suggest converting a working tier-less link into an
        `active/`-qualified one — that REINTRODUCES the move-fragility the
        convention exists to avoid. The `docs/plans/INDEX.md` "Applied /
        archived plans" table is AUTO-GENERATED from `docs/plans/shipped/` by
        `agents/scripts/core/test-plan-index.sh` between the
        `<!-- BEGIN auto-plan-index -->` / `<!-- END auto-plan-index -->`
        markers — do NOT suggest hand-editing rows there; a summary change
        goes in an `<!-- index-summary: ... -->` comment inside the plan file
        and is regenerated with `test-plan-index.sh --fix`.

  ## CodeRabbit's static-analysis tools are mostly redundant with the
  ## deferred-lint pipeline (cppcheck + clang-tidy + clang-format run on
  ## every edited file at end-of-turn via `.claude/hooks/lint-cpp-drain.sh`).
  ## Leave them on for the rare miss but suppress noise.
  tools:
    ast-grep:
      essential_rules: true
    cppcheck:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  # issues.scope:auto lets CodeRabbit auto-create Issues from @coderabbitai
  # CR-triage replies (this opened the #734 stray). Per ADR-0014 the orchestrator
  # is the authoritative Issue creator; CR's strays are EMBRACED + reconciled by
  # agents/scripts/core/issue-sweep.sh (relabel / mirror-then-close, bot-authored
  # only) rather than suppressed. See docs/agent-rules/issue-triage.md
  # § CodeRabbit auto-Issue reconciliation. Tighten this knob only if strays get noisy.
  issues:
    scope: auto
  pull_requests:
    scope: auto
