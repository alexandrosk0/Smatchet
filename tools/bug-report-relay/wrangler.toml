# Smatchet bug-report relay — Cloudflare Worker config.
# Deploy: see README.md. The GitHub token is a SECRET (never put it here) —
# set it with `wrangler secret put GITHUB_TOKEN`.

name = "smatchet-bug-report-relay"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# Destination dev repo for filed issues ("owner/repo").
REPO = "alexandrosk0/Smatchet"
# Optional separate repo for screenshot assets. Empty/unset = reuse REPO.
ASSETS_REPO = ""
# Optional shared access key. When set, the app must send a matching
# `x-relay-key` header (config key bugreport_relay_key). Leave unset for an
# open relay (rely on Cloudflare rate-limit rules / WAF instead).
# RELAY_KEY is set as a SECRET, not here — `wrangler secret put RELAY_KEY`.
# Optional separate repo for crash minidumps ("owner/repo"). Empty/unset falls
# back to ASSETS_REPO, then REPO. A minidump carries the crashing thread's stack
# memory and the loaded-module list, so the Worker REFUSES to upload one unless
# the destination repo is private (see `assertDumpRepoPrivate` in src/index.js).
DUMPS_REPO = ""

# --- Abuse protection -------------------------------------------------------
# Rate limits enforced INSIDE the Worker, so they ship with the code and apply on
# `*.workers.dev` too (a dashboard WAF Rate Limiting rule can only be attached to
# a custom-domain route). Run both — see "Abuse protection" in README.md.
# `simple.period` accepts only 10 or 60 seconds; the limit is per period, per key.

# Per-client-IP budget on POST /report. A human files one report at a time; 5/min
# leaves room for a retry after a failed submit without funding a flood.
[[unsafe.bindings]]
name = "REPORT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Whole-relay ceiling so a distributed flood (many IPs, each under the per-IP
# budget) still can't burn the GitHub token's secondary-rate-limit allowance.
[[unsafe.bindings]]
name = "GLOBAL_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
