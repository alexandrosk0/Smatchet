query($owner: String!, $repo: String!, $pr: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $pr) {
      state
      isDraft
      reviewDecision
      headRefOid
      headRefName
      mergeStateStatus
      labels(first: 50) {
        pageInfo { hasNextPage }
        nodes { name }
      }
      # Changed-file paths — load-bearing for the $selfImpOnly auto-exemption
      # (merge-gates.sh): a PR whose diff is ENTIRELY under docs/self-improvement/**
      # auto-skips the CR + Bugbot gates. first:100 is ample (a self-improvement PR
      # is 1-3 files); a >100-file PR sets pageInfo.hasNextPage, and the filter
      # treats overflow as NOT-exempt (fail-safe → full gates), so it is NOT folded
      # into the global pagination-overflow OR (which would wedge the poll).
      files(first: 100) {
        pageInfo { hasNextPage }
        nodes { path }
      }
      commits(last: 1) {
        nodes {
          commit {
            statusCheckRollup {
              contexts(first: 100) {
                pageInfo { hasNextPage }
                nodes {
                  __typename
                  ... on CheckRun {
                    name
                    conclusion
                    status
                    # startedAt drives latest-per-name dedup: when a job is
                    # rerun, GitHub keeps both the old (FAILURE) + new (SUCCESS)
                    # rollup nodes. We pick the one with the latest startedAt
                    # per name so stale FAILUREs don't falsely block merge.
                    startedAt
                    isRequired(pullRequestNumber: $pr)
                  }
                  ... on StatusContext {
                    context
                    state
                    # description carries CodeRabbit's terminal verdict text
                    # ("Review skipped" / "N actionable comments"); the gate's
                    # crReviewSkipped field reads it to distinguish a terminal
                    # generic skip (docs/trivial diff) from a pending review.
                    description
                    isRequired(pullRequestNumber: $pr)
                  }
                }
              }
            }
          }
        }
      }
      reviews(first: 100) {
        pageInfo { hasNextPage }
        nodes {
          author { login __typename }
          state
          submittedAt
          commit { oid }
          # Body — load-bearing for the three-bucket CR check (CURRENT_FINDINGS,
          # STALE_WITH_FINDINGS, STALE_CLEAN) per
          # docs/self-improvement/categories/process.md P1. CR posts
          # "Actionable comments posted: N" as the first line of its review body;
          # the poller parses N to distinguish a real-findings review (block) from
          # a clean review (pass) regardless of state==COMMENTED.
          body
        }
      }
      reviewThreads(first: 100) {
        pageInfo { hasNextPage }
        nodes {
          id
          isResolved
          isOutdated
          comments(first: 100) {
            pageInfo { hasNextPage }
            # C4 prong 2: commit { oid } lets the poller count CR review-thread
            # comments on the current head, distinguishing "CR has actively
            # reviewed this commit" (= pass via status-SUCCESS) from "CR's
            # placeholder StatusContext fired without a real review" (= wait
            # through grace, possibly the C4 draft-PR bypass path).
            nodes { author { login __typename } commit { oid } }
          }
        }
      }
      comments(first: 100) {
        pageInfo { hasNextPage }
        # body — load-bearing for the CR size-skip detection. When a PR exceeds
        # CodeRabbit's file limit, CR posts a conversation (issue) comment (NOT a
        # review object, so reviewDecision stays NONE) carrying the HTML marker
        # `skip review by coderabbit.ai`. The poller scans coderabbitai-authored
        # comment bodies for that marker to distinguish "CR skipped review (too
        # many files)" from a genuinely pending NONE.
        nodes { author { login __typename } body }
      }
    }
  }
}
